<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Don't Starve</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;cursor:default;user-select:none}
#gameCanvas,#lightCanvas{position:absolute;top:0;left:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#lightCanvas{pointer-events:none;mix-blend-mode:multiply}

#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#statsBar{position:absolute;top:6px;left:6px;display:flex;gap:4px;pointer-events:auto}
.stat{display:flex;align-items:center;gap:2px;background:rgba(0,0,0,.5);padding:2px 4px;border-radius:3px}
.stat-icon{font-size:10px;color:#ccc;text-shadow:0 0 3px #000;width:14px;text-align:center}
.stat-bar-bg{width:60px;height:10px;background:#222;border:1px solid #444;border-radius:2px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:1px;transition:width .2s}
.stat-val{font-size:8px;color:#fff;text-shadow:0 0 3px #000;min-width:20px;text-align:right}
#dayCounter{position:absolute;top:6px;left:50%;transform:translateX(-50%);color:#e0d0b0;font-size:14px;text-shadow:0 0 8px rgba(0,0,0,.8);text-align:center;pointer-events:none}
#seasonText{font-size:10px;color:#a0a080}
#quickSlots{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;gap:2px;pointer-events:auto;z-index:10}
.qslot{width:36px;height:36px;background:rgba(0,0,0,.6);border:2px solid #555;border-radius:3px;position:relative;cursor:pointer}
.qslot.selected{border-color:#f0c060;box-shadow:0 0 6px rgba(240,192,96,.3)}
.qslot .key{position:absolute;top:-1px;left:2px;font-size:7px;color:#aaa;text-shadow:0 0 3px #000}
.qslot .count{position:absolute;bottom:1px;right:2px;font-size:8px;color:#fff;text-shadow:0 0 3px #000}
.qslot .dura{position:absolute;bottom:-1px;left:0;width:100%;height:2px;background:#333}
.qslot .dura-f{height:100%;background:#4a4;transition:width .2s}
#equipSlots{position:absolute;bottom:4px;right:4px;display:flex;gap:2px;pointer-events:auto}
.eslot{width:32px;height:32px;background:rgba(0,0,0,.6);border:2px solid #555;border-radius:3px;position:relative}
.eslot .elabel{position:absolute;bottom:-10px;left:1px;font-size:6px;color:#888}
#actionBtns{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);display:flex;gap:4px;pointer-events:auto;z-index:10}
.actBtn{width:30px;height:30px;background:rgba(0,0,0,.5);border:2px solid #555;border-radius:3px;color:#ccc;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.actBtn:hover{background:rgba(40,40,40,.7);border-color:#888}
#invScreen,#craftScreen,#pauseScreen,#deathScreen{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;display:none;background:rgba(0,0,0,.85)}
#invScreen,#craftScreen{background:rgba(10,5,0,.92)}
#pauseScreen{background:rgba(0,0,0,.7)}
#deathScreen{background:rgba(30,0,0,.92)}
.scr-title{color:#d4a05a;font-size:18px;text-align:center;padding:8px;letter-spacing:2px;text-shadow:0 0 10px rgba(212,160,90,.3)}
.scr-close{position:absolute;top:4px;right:8px;color:#a08060;font-size:20px;cursor:pointer;background:none;border:none;font-family:monospace;z-index:101}
#invGrid{position:absolute;top:50px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(4,44px);gap:2px;background:rgba(40,25,10,.6);padding:4px;border:2px solid #6a4a2a;border-radius:3px}
.inslot{width:44px;height:44px;background:rgba(20,10,0,.6);border:1px solid #5a3a1a;border-radius:2px;position:relative;cursor:pointer}
.inslot .cnt{position:absolute;bottom:1px;right:2px;font-size:9px;color:#fff;text-shadow:0 0 3px #000}
.inslot .dur{position:absolute;bottom:0;left:0;width:100%;height:2px;background:#333}
.inslot .dur-f{height:100%}
.inslot .fresh{position:absolute;top:0;left:0;width:100%;height:2px}
#equipPanel{position:absolute;top:50px;right:30px;display:flex;flex-direction:column;gap:3px}
.eqslot{width:50px;height:50px;background:rgba(40,25,10,.6);border:2px solid #6a4a2a;border-radius:3px;position:relative}
.eqslot .el{text-align:center;font-size:7px;color:#a08060}
#craftSidebar{position:absolute;top:50px;left:4px;display:flex;flex-direction:column;gap:1px}
.ctab{padding:5px 8px;background:rgba(40,25,10,.6);border:1px solid #5a3a1a;color:#a08060;cursor:pointer;font-size:10px;text-align:left;white-space:nowrap;font-family:monospace}
.ctab:hover{background:rgba(60,35,15,.8)}
.ctab.active{background:rgba(80,45,15,.9);border-color:#c0a060;color:#f0d0a0}
#craftList{position:absolute;top:50px;left:120px;right:10px;bottom:10px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:3px;padding:3px;align-content:start}
.citem{background:rgba(30,15,5,.7);border:1px solid #4a2a0a;border-radius:3px;padding:4px;cursor:pointer}
.citem:hover{border-color:#8a6a3a}
.citem.unav{opacity:.4;cursor:default}
.citem.proto{border-color:#4a8a4a}
.citem .cn{color:#d4b080;font-size:10px}
.citem .cm{color:#806040;font-size:8px}
#pauseContent{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
#pauseContent h2{color:#d4a05a;font-size:24px;margin-bottom:16px;letter-spacing:3px}
.pbtn{display:block;width:180px;padding:8px 16px;margin:5px auto;background:rgba(40,25,10,.8);border:2px solid #6a4a2a;color:#d4b080;font-size:12px;cursor:pointer;font-family:monospace;letter-spacing:1px}
.pbtn:hover{background:rgba(60,35,15,.9);border-color:#a08040;color:#f0d0a0}
#deathContent{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
#deathContent h2{color:#cc3333;font-size:22px;margin-bottom:8px;letter-spacing:2px;text-shadow:0 0 20px rgba(200,50,50,.3)}
#deathCause{color:#cc8888;font-size:12px;margin-bottom:16px}
#deathDays{color:#a08060;font-size:11px;margin-bottom:16px}
.dbtn{display:block;width:180px;padding:8px 16px;margin:4px auto;background:rgba(40,10,10,.8);border:2px solid #6a2a2a;color:#cc8888;font-size:12px;cursor:pointer;font-family:monospace}
.dbtn:hover{background:rgba(60,15,15,.9);border-color:#aa4040;color:#eeaaaa}
#mainMenu{position:fixed;top:0;left:0;width:100%;height:100%;z-index:500;background:linear-gradient(180deg,#0a0500,#1a0a00,#0d0500);display:flex;flex-direction:column;align-items:center;justify-content:center}
#mainMenu h1{color:#d4a05a;font-size:42px;letter-spacing:6px;text-shadow:0 0 30px rgba(212,160,90,.3),0 4px 8px rgba(0,0,0,.5);margin-bottom:4px}
#mainMenu .sub{color:#806040;font-size:12px;letter-spacing:4px;margin-bottom:30px}
.mbtn{width:240px;padding:10px 20px;margin:4px;background:rgba(40,25,10,.6);border:2px solid #5a3a1a;color:#c0a070;font-size:14px;cursor:pointer;font-family:monospace;letter-spacing:2px}
.mbtn:hover{background:rgba(60,35,15,.8);border-color:#a08040;color:#f0d0a0}
.mbtn .sm{font-size:9px;color:#806040;display:block;letter-spacing:1px}
#seedInp{width:180px;padding:6px;margin:4px;background:rgba(20,10,0,.6);border:2px solid #5a3a1a;color:#c0a070;font-size:12px;text-align:center;font-family:monospace;outline:none}
#seedInp:focus{border-color:#a08040}
#ctrlInfo{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);color:#604030;font-size:9px;text-align:center}
#tooltip{position:fixed;pointer-events:none;z-index:200;display:none;background:rgba(10,5,0,.92);border:1px solid #6a4a2a;border-radius:3px;padding:4px 6px;max-width:180px;color:#d4b080;font-size:10px;line-height:1.3}
#debugOverlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50;display:none}
#debugText{position:absolute;top:2px;left:2px;color:#0f0;font-size:9px;text-shadow:0 0 4px #000;font-family:monospace;white-space:pre;line-height:1.3}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:rgba(20,10,0,.3)}
::-webkit-scrollbar-thumb{background:#5a3a1a;border-radius:2px}
</style>
</head>

<div id="tooltip"></div><div id="debugOverlay"><div id="debugText"></div></div>

</div>

var T_TYPE={GRASS:0,FOREST:1,SAVANNA:2,MARSH:3,ROCKY:4,MIXED:5,ROAD:6,WATER:7,IMPASSABLE:8};
var world={
  tiles:[],biomes:[],w:WORLD_W,h:WORLD_H,items:[],ents:[],sx:0,sy:0,
  gen:function(seed){
    var rng=new SR(seed),noise=new SN(seed),sc=0.003,sc2=0.008;
    for(var y=0;y<this.h;y++){
      this.tiles[y]=[];this.biomes[y]=[];
      for(var x=0;x<this.w;x++){
        var e=noise.fbm(x*sc,y*sc,4,2,0.5),m=noise.fbm(x*sc2+500,y*sc2+500,3,2,0.5);
        var b;
        if(e<-0.12) b=-1;
        else if(e<0.0) b=m<-0.2?2:m<0.15?0:m<0.3?5:1;
        else if(e<0.15) b=m<-0.25?2:m<0.0?0:m<0.2?5:1;
        else if(e<0.25) b=m<0?4:5;
        else b=4;
        this.biomes[y][x]=b;
        this.tiles[y][x]=b<0?7:(b<0?7:b);
        // road generation
        if(Math.abs(noise.n2(x*0.003+200,y*0.003+200))>0.35&&b>=0)this.tiles[y][x]=6;
      }
    }
    this.placeRes(rng,noise);this.findSpawn(rng);
    GS.world=this;
  },
  placeRes:function(rng,noise){
    var g=this;
    function place(tx,ty,type,count){
      if(tx<0||tx>=g.w||ty<0||ty>=g.h)return;
      g.ents.push({x:tx*TILE,y:ty*TILE,type:type,data:count||1});
    }
    for(var y=2;y<this.h-2;y++)for(var x=2;x<this.w-2;x++){
      var b=this.biomes[y][x];
      if(b<0)continue;
      var n=rng.n();
      switch(b){
        case 0: // grassland
          if(n<0.015)place(x,y,'tree',ri(1,2));
          else if(n<0.025)place(x,y,'sapling');
          else if(n<0.035)place(x,y,'berrybush');
          else if(n<0.045)place(x,y,'grass_tuft');
          else if(n<0.048)place(x,y,'flint');
          else if(n<0.05)place(x,y,'spiderden');
          break;
        case 1: // forest
          if(n<0.04)place(x,y,'tree',ri(1,3));
          else if(n<0.043)place(x,y,'sapling');
          else if(n<0.046)place(x,y,'berrybush');
          else if(n<0.049)place(x,y,'grass_tuft');
          else if(n<0.051)place(x,y,'spiderden');
          break;
        case 2: // savanna
          if(n<0.03)place(x,y,'grass_tuft');
          else if(n<0.04)place(x,y,'sapling');
          else if(n<0.045)place(x,y,'flint');
          else if(n<0.048)place(x,y,'boulder');
          else if(n<0.05)place(x,y,'rabbithole');
          break;
        case 3: // marsh
          if(n<0.025)place(x,y,'reeds');
          else if(n<0.04)place(x,y,'spiky_bush');
          else if(n<0.045)place(x,y,'pond');
          else if(n<0.05)place(x,y,'tentacle');
          break;
        case 4: // rocky
          if(n<0.025)place(x,y,'boulder');
          else if(n<0.03)place(x,y,'goldrock');
          else if(n<0.035)place(x,y,'flint');
          else if(n<0.038)place(x,y,'tree');
          break;
        case 5: // mixed
          if(n<0.02)place(x,y,'tree');
          else if(n<0.028)place(x,y,'sapling');
          else if(n<0.033)place(x,y,'berrybush');
          else if(n<0.038)place(x,y,'grass_tuft');
          else if(n<0.04)place(x,y,'flint');
          else if(n<0.043)place(x,y,'boulder');
          break;
      }
    }
    // place some pig houses near grasslands
    for(var i=0;i<12;i++){
      var px=ri(20,this.w-20),py=ri(20,this.h-20);
      if(this.biomes[py][px]===0||this.biomes[py][px]===5)place(px,py,'pighouse');
    }
    // place beefalo herds in savanna
    for(i=0;i<8;i++){
      var bx=ri(20,this.w-20),by=ri(20,this.h-20);
      if(this.biomes[by][bx]===2)place(bx,by,'beefalo',ri(3,6));
    }
  },
  findSpawn:function(rng){
    for(var y=Math.floor(this.h/2)-20;y<Math.floor(this.h/2)+20;y++){
      for(var x=Math.floor(this.w/2)-20;x<Math.floor(this.w/2)+20;x++){
        if(this.biomes[y]&&this.biomes[y][x]===0){this.sx=x*TILE;this.sy=y*TILE;return;}
      }
    }
    this.sx=Math.floor(this.w/2)*TILE;this.sy=Math.floor(this.h/2)*TILE;
  }
};

var INV={};
INV.create=function(slots){return {slots:slots||16,items:[],eq:{hand:null,head:null,body:null},cgold:0}};
INV.add=function(inv,id,count){
  if(!count)count=1;var item=ITEMS[id];if(!item)return 0;
  for(var i=0;i<inv.items.length;i++){
    var s=inv.items[i];
    if(s&&s.id===id&&s.count<(item.stack||20)){
      var add=Math.min(count,(item.stack||20)-s.count);
      s.count+=add;count-=add;
      if(count<=0)return 1;
    }
  }
  for(i=0;i<inv.slots;i++){
    if(!inv.items[i]){
      var add=Math.min(count,(item.stack||20));
      inv.items[i]={id:id,count:add,dura:item.dura};
      count-=add;
      if(count<=0)return 1;
    }
  }
  return count<=0?1:0;
};
INV.remove=function(inv,id,count){
  if(!count)count=1;
  for(var i=0;i<inv.items.length;i++){
    var s=inv.items[i];
    if(s&&s.id===id){
      var rem=Math.min(count,s.count);
      s.count-=rem;count-=rem;
      if(s.count<=0)inv.items[i]=null;
      if(count<=0)return 1;
    }
  }
  return count<=0?1:0;
};
INV.count=function(inv,id){
  var tot=0;
  for(var i=0;i<inv.items.length;i++){var s=inv.items[i];if(s&&s.id===id)tot+=s.count}
  return tot;
};
INV.has=function(inv,id,n){return this.count(inv,id)>=(n||1)};
INV.equip=function(inv,slot,item){
  if(!item||!item.id){inv.eq[slot]=null;return}
  var it=ITEMS[item.id];
  if(!it||!it.equip){inv.eq[slot]=item;return}
  var target=it.equip;
  if(inv.eq[target]){var old=inv.eq[target];INV.add(inv,old.id,old.count);}
  INV.remove(inv,item.id,1);
  inv.eq[target]=item;
};
INV.unequip=function(inv,slot){
  var item=inv.eq[slot];if(!item)return;
  if(INV.add(inv,item.id,1))inv.eq[slot]=null;
};
INV.destroy=function(inv,id,count){
  if(!count)count=1;
  for(var i=0;i<inv.items.length;i++){
    var s=inv.items[i];
    if(s&&s.id===id){
      var rem=Math.min(count,s.count);
      s.count-=rem;count-=rem;
      if(s.count<=0)inv.items[i]=null;
      if(count<=0)break;
    }
  }
};

var CRAFT={};
CRAFT.canCraft=function(id,inv,unlocked){
  var r=RECIPES[id];if(!r)return false;
  if(r.structure&&!unlocked.has(r.structure))return false;
  for(var k in r.mat){
    if(INV.count(inv,k)<r.mat[k])return false;
  }
  return true;
};
CRAFT.canBuild=function(id,inv,unlocked){
  var r=RECIPES[id];if(!r)return false;
  if(GS.proto.has(id)){
    for(var k in r.mat)if(INV.count(inv,k)<r.mat[k])return false;
    return true;
  }
  return CRAFT.canCraft(id,inv,unlocked);
};
CRAFT.do=function(id,inv,unlocked){
  if(!this.canCraft(id,inv,unlocked))return false;
  var r=RECIPES[id];
  for(var k in r.mat)INV.remove(inv,k,r.mat[k]);
  INV.add(inv,id,1);
  if(!GS.proto.has(id)){GS.proto.add(id);EB.em('prototype',id);}
  return true;
};

var PL={};
PL.create=function(x,y){
  var e=ENT.add('player',x,y,{spd:4});

  e.beardGrowth=0;e.wetness=0;e.temp=30;e.frozen=0;e.overheated=0;
  GS.player=e;return e;
};
PL.move=function(e,dx,dy,dt){
  var spd=(e.data.spd||4)*(dt||FDT);
  if(dx&&dy){spd*=0.707}
  e.x+=dx*spd;e.y+=dy*spd;
  e.x=cl(e.x,16,PW-16);e.y=cl(e.y,16,PH-16);
  if(dx!==0)e.facing=dx>0?1:-1;
};
PL.update=function(e,dt,keys){
  var mx=0,my=0;
  if(keys[87]||keys['w']||keys[38])my=-1;if(keys[83]||keys['s']||keys[40])my=1;
  if(keys[65]||keys['a']||keys[37])mx=-1;if(keys[68]||keys['d']||keys[39])mx=1;
  this.move(e,mx,my,dt);
  // hunger drain
  e.stats.hunger-=3*dt;
  if(e.stats.hunger<=0){e.stats.hunger=0;e.stats.health-=1*dt}
  // sanity drain in darkness
  var light=this.getLight(e);
  if(light<0.3)e.stats.sanity-=2*dt;
  else if(light>0.5)e.stats.sanity+=0.5*dt;
  e.stats.sanity=cl(e.stats.sanity,0,e.stats.maxSanity);
  e.stats.hunger=cl(e.stats.hunger,0,e.stats.maxHunger);
  e.stats.health=cl(e.stats.health,0,e.stats.maxHealth);
  // beard growth
  e.beardGrowth+=dt;
  // wetness drying
  if(e.wetness>0)e.wetness=Math.max(0,e.wetness-1*dt);
};
PL.getLight=function(e){
  var l=0.5; // base moonlight/starlight
  // from nearby entities with light
  ENT.each(function(ent){
    if(ent.light>0){
      var d=ds(e.x,e.y,ent.x,ent.y);
      if(d<ent.light*TILE)l=Math.max(l,1-d/(ent.light*TILE));
    }
  });
  return l;
};
PL.getFoodValue=function(e,id){
  var item=ITEMS[id];if(!item)return 0;
  var mult=1;

  return 1;

  var inv=e.inv;if(!inv.items[slot])return;
  var item=inv.items[slot];var def=ITEMS[item.id];
  if(!def||def.type!=='food')return;
  e.stats.hunger+=def.hunger;
  e.stats.health+=def.health;

  item.count--;

var COMBAT={};
COMBAT.attack=function(attacker,target){
  if(!target||target.rem)return;
  if(attacker.atkCd>0)return;
  var dmg=attacker.dmg||0;
  // check equipped weapon
  if(attacker.inv&&attacker.inv.eq.hand){
    var wep=ITEMS[attacker.inv.eq.hand.id];
    if(wep)dmg=Math.max(dmg,wep.dmg);
  }
  // armor reduction
  var armor=0;
  if(target.inv){
    if(target.inv.eq.head){var a=ITEMS[target.inv.eq.head.id];if(a)armor+=a.armor||0}
    if(target.inv.eq.body){var b=ITEMS[target.inv.eq.body.id];if(b)armor+=b.armor||0}
  }
  dmg=Math.max(1,dmg*(1-armor/200));
  target.hp=(target.hp||0)-dmg;
  target.hitCd=0.3;attacker.atkCd=0.4;
  AM.pl('hit',0.3);
  if(target.hp<=0&&!target.rem)ENT.kill(target.id,attacker);
};

  }

SURV.update=function(dt){
  var p=GS.player;if(!p||p.rem)return;
  GS.totalTime+=dt;GS.dayTime+=dt;
  // day/night cycle (8 min day, 2 min night = 600 seconds total)
  if(GS.dayTime>=GS.sLen*60){GS.dayTime=0;GS.day++;EB.em('day',GS.day)}
  // season (20 days autumn, 16 days winter)
  var dayInSeason=(GS.day-1)%36;
  if(dayInSeason<20)GS.season='autumn';else GS.season='winter';
  // temperature
  GS.ambient=this.getAmbientTemp();
  p.temp=lerp(p.temp,GS.ambient+p.insul,dt*0.1);
  // freezing damage
  if(p.temp<0){p.stats.health-=1*dt;p.frozen+=dt}
  else{p.frozen=Math.max(0,p.frozen-dt)}
  // overheating (summer only, not in base game for autumn/winter)
  // sanity aura from mobs and items
  ENT.each(function(e){
    if(e.sanityAura&&!e.rem&&p&&!p.rem){
      var d=ds(p.x,p.y,e.x,e.y);
      if(d<40)p.stats.sanity+=e.sanityAura*dt/40;
    }
  });
  // monster food penalty
  p.stats.sanity=cl(p.stats.sanity,0,p.stats.maxSanity);
  // night time sanity drain handled in player update
  // if sanity reaches 0, shadow creatures appear
  if(p.stats.sanity<=0&&GS.state==='PLAYING'){
    if(Math.random()<0.01){
      var sc=MOB.spawnMob('shadowcreature',p.x+ri(-60,60),p.y+ri(-60,60));
      sc.hp=100;sc.maxHp=100;sc.dmg=15;sc.atkR=30;sc.spd=3.5;sc.team=1;sc.sanityAura=-50;
    }
  }
};
SURV.getAmbientTemp=function(){
  var timeOfDay=GS.dayTime/(GS.sLen*60);
  var temp=25; // base
  if(GS.season==='winter')temp=0;
  else if(GS.season==='summer')temp=50;
  // night is colder
  var light=this.getDayLight();
  temp+=5*(light-0.5);
  return temp;
};
SURV.getDayLight=function(){
  var t=GS.dayTime/(GS.sLen*60);
  var lightFactor;
  if(t<0.25)lightFactor=t*4; // dawn
  else if(t<0.75)lightFactor=1; // day
  else if(t<0.85)lightFactor=1-(t-0.75)*10; // dusk
  else lightFactor=0; // night
  return lightFactor;
};
// Shadow Creature AI (same as hound basically)
MOB.shadowcreature=function(e,p,dist,dt){
  if(e.hitCd>0)return;
  if(dist<150){e.target=p;e.state='chase'}
  if(e.target&&!e.target.rem){
    var d=ds(e.x,e.y,e.target.x,e.target.y);
    if(d>e.atkR){
      var a=Math.atan2(e.target.y-e.y,e.target.x-e.x);
      e.x+=Math.cos(a)*e.spd;e.y+=Math.sin(a)*e.spd;
    }else{COMBAT.attack(e,e.target)}
  }
};

var SYS={};
SYS.placeStructure=function(id,x,y){

    case 'crockpot':e.hp=300;e.data.cooking=false;e.data.cookTimer=0;e.data.cookItem=null;e.inv=INV.create(4);break;
    case 'icebox':e.hp=200;e.inv=INV.create(9);break;

    case 'pighouse':e.hp=500;e.data.spawnTimer=0;e.data.pig=null;break;
    case 'birdtrap':e.hp=10;e.data.baited=false;e.data.caught=null;break;
    case 'trap':e.hp=10;e.data.baited=false;e.data.caught=null;break;

    case 'dryingrack':e.hp=100;e.data.drying=false;e.data.dryTimer=0;e.data.dryItem=null;break;
    case 'spiderden':e.hp=500;e.data.spawnTimer=0;e.data.level=1;e.data.maxSpiders=6;break;
  }
  e.w=32;e.h=32;
  return e;
};
SYS.interact=function(e,player){
  if(!e||e.rem)return;
  switch(e.type){
    case 'campfire':
    case 'firepit':
      // add fuel from inventory
      for(var i=0;i<player.inv.items.length;i++){
        var s=player.inv.items[i];
        if(s&&ITEMS[s.id]&&ITEMS[s.id].fuel>0){
          e.data.fuel+=ITEMS[s.id].fuel;
          player.inv.items[i]=null;
          break;
        }
      }
      break;
    case 'sciencemachine':
    case 'prestihatitator':
    case 'shadowmanipulator':
      GS.proto.add(e.type);
      EB.em('prototype',e.type);
      break;
    case 'chest':
      GS.openContainer=e;
      break;
    case 'crockpot':
      GS.openContainer=e;
      break;
    case 'icebox':
      GS.openContainer=e;
      break;
    case 'tent':
      if(e.data.uses>0&&player.stats.hunger>0){
        player.stats.health=Math.min(player.stats.health+40,player.stats.maxHealth);
        player.stats.sanity=Math.min(player.stats.sanity+50,player.stats.maxSanity);
        e.data.uses--;
      }
      break;
    case 'birdtrap':
    case 'trap':
      if(e.data.caught){
        INV.add(player.inv,e.data.caught.id,1);
        e.data.caught=null;
      }
      break;
  }
};

REND.worldToScreen=function(wx,wy){
  var c=GS.cam;
  return {x:(wx-c.x)*c.z+gc.width/2,y:(wy-c.y)*c.z+gc.height/2};
};
REND.renderWorld=function(){
  var c=GS.cam,w=GS.world;if(!w||c.z>3)return;
  var ts=TILE*c.z;
  // visible world bounds
  var left=c.x-gc.width/2/c.z,top=c.y-gc.height/2/c.z;
  var right=left+gc.width/c.z,bottom=top+gc.height/c.z;
  var sx=Math.max(0,Math.floor(left/TILE));
  var sy=Math.max(0,Math.floor(top/TILE));
  var ex=Math.min(w.w,Math.ceil(right/TILE)+1);
  var ey=Math.min(w.h,Math.ceil(bottom/TILE)+1);
  for(var y=sy;y<ey;y++){
    for(var x=sx;x<ex;x++){
      var b=w.biomes[y]&&w.biomes[y][x];
      if(b===undefined)continue;
      if(b<0)ctx.fillStyle='#2A5A8A';
      else ctx.fillStyle=BIOC[['grassland','forest','savanna','marsh','rocky','mixed'][b]]||'#5E9C3B';
      var px=(x*TILE-left)*c.z,py=(y*TILE-top)*c.z;
      ctx.fillRect(px,py,ts+1,ts+1);
    }
  }
};
REND.renderEntities=function(){
  var c=GS.cam,p=GS.player;
  var hw=gc.width/2,hh=gc.height/2;
  ENT.each(function(e){
    if(e.rem)return;
    var sx=(e.x-c.x)*c.z+hw,sy=(e.y-c.y)*c.z+hh;
    var sw=e.w*c.z||32*c.z,sh=e.h*c.z||32*c.z;
    if(sx+sw<0||sx>gc.width||sy+sh<0||sy>gc.height)return;
    var sprite=AS.get(e.type)||AS.get('missing');
    ctx.drawImage(sprite,sx,sy,sw,sh);
    if(e.hp>=0&&e.hp<e.maxHp){
      var bw=sw*0.6,bh=4,by=sy-6;
      ctx.fillStyle='#400';ctx.fillRect(sx+sw*0.2,by,bw,bh);
      ctx.fillStyle='#c44';ctx.fillRect(sx+sw*0.2,by,bw*(e.hp/e.maxHp),bh);
    }
  });
  if(p&&!p.rem){
    var sx=(p.x-c.x)*c.z+hw,sy=(p.y-c.y)*c.z+hh;
    var sw=32*c.z,sh=32*c.z;
    if(p.hitCd>0&&Math.floor(p.hitCd*10)%2===0)return;
    ctx.drawImage(AS.get('player'),sx,sy,sw,sh);
    if(p.hp>0&&p.hp<p.maxHp){
      var bw=sw*0.6,bh=4,by=sy-6;
      ctx.fillStyle='#400';ctx.fillRect(sx+sw*0.2,by,bw,bh);
      ctx.fillStyle='#4c4';ctx.fillRect(sx+sw*0.2,by,bw*(p.hp/p.maxHp),bh);
    }
  }
};
REND.renderLighting=function(){

  var hw=gc.width/2,hh=gc.height/2;

  var light=PL.getLight(p)*0.7+0.1;
  var grad=lctx.createRadialGradient(cx,cy,10*c.z,cx,cy,120*c.z);

  grad.addColorStop(1,'rgba(0,0,0,'+(1-light)+')');
  lctx.fillStyle=grad;
  lctx.fillRect(0,0,lc.width,lc.height);
};

// Crafting Screen
REND.renderCraft=function(tab){
  var p=GS.player;if(!p||!p.inv)return;
  var cats={ALL:[],TOOLS:[],WEAPONS:[],ARMOR:[],STRUCTURES:[],LIGHT:[],FOOD:[]};
  for(var id in RECIPES){
    var r=RECIPES[id];cats.ALL.push(id);
    var def=ITEMS[id];
    if(!def)continue;
    if(r.structure==='crockpot')cats.FOOD.push(id);
    else if(def.type==='tool'||def.type==='weapon')(def.dmg>0?cats.WEAPONS:cats.TOOLS).push(id);
    else if(def.type==='armor'||def.type==='clothing')cats.ARMOR.push(id);
    else if(def.type==='light')cats.LIGHT.push(id);
    else if(def.dmg>0)cats.WEAPONS.push(id);
    else cats.STRUCTURES.push(id);
  }
  var list=(cats[tab]||cats.ALL);
  var html='<div id="craftSidebar">';
  ['ALL','TOOLS','WEAPONS','ARMOR','STRUCTURES','LIGHT','FOOD'].forEach(function(t){
    html+='<div class="ctab'+(t===tab?' active':'')+'" data-ctab="'+t+'">'+t+'</div>';
  });
  html+='</div><div id="craftList">';
  for(var i=0;i<list.length;i++){
    var id=list[i],r=RECIPES[id],def=ITEMS[id];
    if(!def)continue;
    var can=CRAFT.canBuild(id,p.inv,GS.proto);
    var proto=GS.proto.has(id);
    var matHtml='';
    for(var k in r.mat)matHtml+=k+':'+INV.count(p.inv,k)+'/'+r.mat[k]+' ';
    html+='<div class="citem'+(can?'':' unav')+(proto?' proto':'')+'" data-craft="'+id+'">';
    html+='<div class="cn">'+def.name+'</div>';
    html+='<div class="cm">'+matHtml+'</div>';
    html+='</div>';
  }
  html+='</div>';
  dc('craftScreen').innerHTML='<div class="scr-title">CRAFTING</div><button class="scr-close" id="craftClose">X</button>'+html;
};

var GAME={};
GAME.init=function(seed){
  GS.state='LOADING';GS.seed=seed||Math.floor(Math.random()*2147483647);
  GS.rng=new SR(GS.seed);GS.explored=new Set();GS.proto=new Set();
  GS.day=1;GS.season='autumn';GS.dayTime=0;GS.totalTime=0;GS.sDay=0;GS.sLen=20;
  GS.temp=25;GS.ambient=25;GS.insul=0;GS.attacking=false;GS.pickup=false;
  GS.selectedSlot=0;GS.toggleMap=false;
  GS.stats={days:0,killed:{},crafted:{},walked:0,deaths:0};
  GS.ents={};ENT.list={};ENT._nextId=1;
  setTimeout(function(){
    world.gen(GS.seed);
    setTimeout(function(){
      var p=PL.create(world.sx,world.sy);
      GS.cam.x=p.x;GS.cam.y=p.y;
      GS.cam.tx=p.x;GS.cam.ty=p.y;
      GS.cam.z=2;GS.cam.pz=2;
      INV.add(p.inv,'axe',1);INV.add(p.inv,'torch',1);INV.add(p.inv,'log',3);
      INV.add(p.inv,'flint',3);INV.add(p.inv,'twig',5);INV.add(p.inv,'cutgrass',5);
      INV.add(p.inv,'rocks',3);INV.add(p.inv,'berries',5);
      setTimeout(function(){
        for(var i=0;i<world.ents.length;i++){
          var we=world.ents[i];
          var e=MOB.spawnMob(we.type,we.x,we.y,{});
          if(we.type==='tree'||we.type==='boulder'||we.type==='goldrock'||we.type==='sapling'||we.type==='berrybush'||we.type==='grass_tuft'||we.type==='reeds'||we.type==='spiky_bush'||we.type==='spiderden'||we.type==='pighouse'||we.type==='rabbithole'||we.type==='pond'){
            if(we.type==='tree'){e.hp=20;e.maxHp=20;e.dmg=0;e.w=24;e.h=32}
            else if(we.type==='boulder'){e.hp=30;e.maxHp=30;e.w=24;e.h=20}
            else if(we.type==='goldrock'){e.hp=30;e.maxHp=30;e.w=24;e.h=20}
            else if(we.type==='sapling'){e.hp=5;e.maxHp=5;e.w=16;e.h=24}
            else if(we.type==='berrybush'){e.hp=10;e.maxHp=10;e.w=20;e.h=20}
            else if(we.type==='grass_tuft'){e.hp=5;e.maxHp=5;e.w=16;e.h=20}
            else if(we.type==='reeds'){e.hp=5;e.maxHp=5;e.w=16;e.h=20}
            else if(we.type==='spiky_bush'){e.hp=15;e.maxHp=15;e.w=20;e.h=20;e.team=0}
            else if(we.type==='pond'){e.hp=-1;e.w=24;e.h=24}
          }
        }
        GS.state='PLAYING';
        GS.spawned=true;
      },300);
    },300);
  },300);
};
// ============================================================
// Crockpot Cooking
// ============================================================
GAME.cook=function(dt){
  // crockpot cooking
  ENT.each(function(e){
    if(e.type==='crockpot'&&e.data.cooking){
      e.data.cookTimer+=dt;
      if(e.data.cookTimer>=30){
        e.data.cooking=false;e.data.cookTimer=0;
        var result=e.data.cookItem;
        e.inv.items=[]; // clear
        INV.add(e.inv,result,1);
      }
    }
  });
};
// ============================================================
// Hound Attack Timer
// ============================================================
GAME.houndAttack=function(){
  if(GS.day<3)return;
  var p=GS.player;if(!p||p.rem)return;
  // increase hound attack frequency as days go on
  var houndTimer=GS.hTimer||0;
  GS.hTimer+=0.01;
  if(Math.random()<GS.hTimer*0.001){
    GS.hTimer=0;
    var cnt=1+Math.floor(GS.day/10);
    for(var i=0;i<cnt;i++){
      var angle=Math.random()*Math.PI*2;
      var dist=80+Math.random()*40;
      MOB.spawnMob('hound',p.x+Math.cos(angle)*dist,p.y+Math.sin(angle)*dist);
    }
  }
};
// main update
GAME.update=function(dt){
  if(GS.state!=='PLAYING')return;
  var p=GS.player;if(!p||p.rem)return;
  PL.update(p,dt,keys);
  SURV.update(dt);
  MOB.update(dt);
  ENT.update(dt);
  GAME.cook(dt);
  GAME.houndAttack();
  // campfire fuel
  ENT.each(function(e){
    if((e.type==='campfire'||e.type==='firepit')&&e.data.fuel>0){
      e.data.fuel-=dt;
      if(e.data.fuel>0)e.light=30;
      else e.light=0;
    }
  });
  // pickup items
  if(GS.pickup){
    GS.pickup=false;
    ENT.each(function(e){
      if(e.rem)return;
      var d=ds(p.x,p.y,e.x,e.y);
      if(d<30&&ITEMS[e.type]&&ITEMS[e.type].type!=='structure'){
        INV.add(p.inv,e.type,1);
        e.rem=true;
      }
    });
  }
  // attack (F key)
  if(GS.attacking){
    GS.attacking=false;
    var nearest=null,nd=999;
    ENT.each(function(e){
      if(e.rem||e.team===0)return;
      var d=ds(p.x,p.y,e.x,e.y);
      if(d<50&&d<nd){nearest=e;nd=d}
    });
    if(nearest)COMBAT.attack(p,nearest);
  }
  // player death
  if(p.stats.health<=0&&GS.state==='PLAYING'){
    GS.state='DEAD';
    GS.stats.deaths++;
    dc('deathCause').textContent='You starved/froze/were murdered';
    dc('deathDays').textContent='Survived '+GS.day+' day'+(GS.day>1?'s':'');
    dc('deathScreen').style.display='block';
  }
};
// main render
GAME.render=function(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,gc.width,gc.height);
  lctx.clearRect(0,0,lc.width,lc.height);
  REND.updateCam();
  REND.renderWorld();
  REND.renderEntities();
  REND.renderLighting();
  REND.renderHUD();
  REND.renderMinimap(150);
  REND.renderDebug();
};
// game loop
GAME.loop=function(timestamp){
  if(!GS.lt)GS.lt=timestamp;
  var dt=Math.min((timestamp-GS.lt)/1000,FDT);
  GS.lt=timestamp;
  GS.gTime+=dt;
  GS.fps=1/dt;
  if(GS.state==='PLAYING'||GS.state==='MENU'){
    GAME.update(dt);
    GAME.render();
  }
  requestAnimationFrame(GAME.loop);
};
// ============================================================
// Auto-Save Interval (every 60 seconds)
// ============================================================
setInterval(function(){if(GS.state==='PLAYING')SV.save()},60000);
// ============================================================
// Menu System & Event Binding
// ============================================================
REND.renderInv=function(){
  var p=GS.player;if(!p||!p.inv)return;
  var html='';
  for(var i=0;i<p.inv.items.length;i++){
    var item=p.inv.items[i];
    html+='<div class="inslot" data-inv="'+i+'">';
    if(item){
      html+='<img src="'+AS.get(item.id).toDataURL()+'" style="width:40px;height:40px;position:absolute;top:1px;left:1px">';
      if(item.count>1)html+='<span class="cnt">'+item.count+'</span>';
    }
    html+='</div>';
  }
  dc('invGrid').innerHTML=html;
  // equip panel
  var ep='<div class="eqslot">'+(p.inv.eq.head?'<img src="'+AS.get(p.inv.eq.head.id).toDataURL()+'" style="width:46px;height:46px">':'')+'<div class="el">HEAD</div></div>';
  ep+='<div class="eqslot">'+(p.inv.eq.body?'<img src="'+AS.get(p.inv.eq.body.id).toDataURL()+'" style="width:46px;height:46px">':'')+'<div class="el">BODY</div></div>';
  ep+='<div class="eqslot">'+(p.inv.eq.hand?'<img src="'+AS.get(p.inv.eq.hand.id).toDataURL()+'" style="width:46px;height:46px">':'')+'<div class="el">HAND</div></div>';
  dc('equipPanel').innerHTML=ep;
};
// Event bindings
function bindUI(){
  dc('startBtn').onclick=function(){GS.state='LOADING';dc('mainMenu').style.display='none';GAME.init()};
  dc('seedBtn').onclick=function(){var s=parseInt(dc('seedInp').value)||Math.floor(Math.random()*2147483647);GS.state='LOADING';dc('mainMenu').style.display='none';GAME.init(s)};
  dc('contBtn').onclick=function(){
    var data=SV.load();
    if(data){
      GS.state='LOADING';dc('mainMenu').style.display='none';
      setTimeout(function(){
        world.gen(GS.seed);
        var p=PL.create(data.player.x,data.player.y);
        p.stats=data.player.stats;p.inv=data.player.inv;p.beardGrowth=data.player.beardGrowth;
        GS.player=p;GS.cam.x=p.x;GS.cam.y=p.y;
        GS.cam.tx=p.x;GS.cam.ty=p.y;GS.cam.z=2;
        p.hp=p.stats.health;
        setTimeout(function(){GS.state='PLAYING'},500);
      },300);
    }
  };
  dc('btnCraft').onclick=function(){dc('craftScreen').style.display='block';REND.renderCraft('ALL')};
  dc('btnInv').onclick=function(){dc('invScreen').style.display='block';REND.renderInv()};
  dc('btnMap').onclick=function(){GS.toggleMap=!GS.toggleMap};
  // delegated close buttons (survive innerHTML replacements)
  document.addEventListener('click',function(e){
    if(e.target.classList.contains('scr-close')){
      var s=e.target.closest('[id$="Screen"]');
      if(s)s.style.display='none';
    }
  });
  dc('resumeBtn').onclick=function(){dc('pauseScreen').style.display='none';GS.state='PLAYING'};
  dc('saveQuitBtn').onclick=function(){SV.save();dc('pauseScreen').style.display='none';dc('mainMenu').style.display='flex';GS.state='MENU'};
  dc('mainMenuBtn').onclick=function(){dc('pauseScreen').style.display='none';dc('mainMenu').style.display='flex';GS.state='MENU'};
  dc('retryBtn').onclick=function(){dc('deathScreen').style.display='none';GS.state='LOADING';GAME.init(GS.seed)};
  dc('newWorldBtn').onclick=function(){dc('deathScreen').style.display='none';GS.state='LOADING';GAME.init()};
  dc('menuBtn').onclick=function(){dc('deathScreen').style.display='none';dc('mainMenu').style.display='flex';GS.state='MENU'};
  document.addEventListener('keydown',function(e){
    var n=parseInt(e.key);
    if(n>=1&&n<=8){GS.selectedSlot=n-1}
    if(e.key==='Escape'){
      dc('invScreen').style.display='none';dc('craftScreen').style.display='none';dc('pauseScreen').style.display='none';
      if(GS.state==='PLAYING'){dc('pauseScreen').style.display='block';GS.state='PAUSED'}
    }
  });
  // click handler
  document.addEventListener('click',function(e){
    var target=e.target;
    var qslot=target.closest('.qslot');
    if(qslot){
      var idx=parseInt(qslot.dataset.slot);GS.selectedSlot=idx;
      var p=GS.player;if(p&&p.inv&&p.inv.items[idx]){
        var item=p.inv.items[idx];
        if(ITEMS[item.id]&&ITEMS[item.id].type==='food')PL.eat(p,idx);
        else if(ITEMS[item.id]&&ITEMS[item.id].equip){INV.equip(p.inv,'hand',item);REND.renderHUD()}
      }return;
    }
    var inslot=target.closest('.inslot');
    if(inslot&&dc('invScreen').style.display==='block'){
      var idx=parseInt(inslot.dataset.inv);var p=GS.player;
      if(p&&p.inv&&p.inv.items[idx]){
        var item=p.inv.items[idx];
        if(ITEMS[item.id]&&ITEMS[item.id].equip){INV.equip(p.inv,'hand',item);REND.renderInv()}
      }return;
    }
    var citem=target.closest('.citem');
    if(citem&&dc('craftScreen').style.display==='block'){
      var id=citem.dataset.craft;var p=GS.player;
      if(p&&p.inv&&CRAFT.do(id,p.inv,GS.proto)){REND.renderCraft('ALL')}
      return;
    }
    var ctab=target.closest('.ctab');
    if(ctab&&dc('craftScreen').style.display==='block'){REND.renderCraft(ctab.textContent);return;}
    // canvas clicks
    if(target===gc||target===lc){
      var p=GS.player;if(!p)return;
      if(e.button===0){
        var nearest=null,nd=999;
        ENT.each(function(e){
          if(e.rem||e.team===0||e.type==='player')return;
          var d=ds(p.x,p.y,e.x,e.y);
          if(d<50&&d<nd){nearest=e;nd=d}
        });
        if(nearest)COMBAT.attack(p,nearest);
      }
      if(e.button===2){
        var nearest=null,nd=999;
        ENT.each(function(e){
          if(e.rem)return;
          var d=ds(p.x,p.y,e.x,e.y);
          if(d<40&&d<nd){nearest=e;nd=d}
        });
        if(nearest&&nearest.type!=='player')SYS.interact(nearest,p);
      }
    }
  });
}
// initialize everything
window.onload=function(){
  REND.initCanvas();
  GS.cam={x:0,y:0,tx:0,ty:0,z:2,pz:2,w:gc.width,h:gc.height};
  AM.init();AM.genAll();
  AS.genAll();
  gc.addEventListener('wheel',function(e){GS.cam.z=cl(GS.cam.z+(e.deltaY>0?0.1:-0.1),1,4);GS.cam.pz=GS.cam.z});
  bindUI();
  // show main menu
  var saved=localStorage.getItem('dontstarve_save');
  if(saved)dc('contBtn').style.display='block';
  else dc('contBtn').style.display='none';
  GS.state='MENU';
  GAME.loop(0);
  // check for continue on load
  dc('mainMenu').style.display='flex';
};
window.onresize=function(){
  if(!gc)return;
  gc.width=window.innerWidth;gc.height=window.innerHeight;
  lc.width=gc.width;lc.height=gc.height;
  GS.cam.w=gc.width;GS.cam.h=gc.height;
};
// ============================================================
// Debug Toggle Keys
// ============================================================
document.addEventListener('keydown',function(e){
  if(e.key==='F3')GS.debug=!GS.debug;
  if(e.key==='F4')GS.gridVis=!GS.gridVis;
  if(e.key==='F5')GS.hbVis=!GS.hbVis;
});
})();
</script>
