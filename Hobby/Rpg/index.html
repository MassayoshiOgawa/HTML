<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crônicas de Aetheris — O Legado Esquecido</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
body{background:#000;overflow:hidden;font-family:'Press Start 2P',monospace;color:#fff;user-select:none;width:100vw;height:100vh}
#game-container{position:relative;width:100%;height:100%;background:#111}
canvas{image-rendering:pixelated}
#ui-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
#ui-overlay>*{pointer-events:auto}
.window{display:none;position:absolute;background:rgba(0,0,0,0.92);border:2px solid #8B7355;border-radius:4px;padding:12px;min-width:300px;max-height:80vh;overflow-y:auto;z-index:100;font-size:8px}
.window-title{color:#FFD700;text-align:center;padding:4px;border-bottom:1px solid #8B7355;margin-bottom:8px}
.window-close{position:absolute;top:4px;right:8px;color:#CC4444;cursor:pointer}
.window-close:hover{color:#FF6666}
.hotbar-slot{width:52px;height:52px;background:rgba(0,0,0,0.8);border:2px solid #8B7355;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:7px;position:relative;cursor:pointer}
.hotbar-slot:hover{border-color:#FFD700}
.hotbar-slot .key{position:absolute;top:2px;left:4px;font-size:7px;color:#FFD700}
.bar-container{width:180px;height:12px;background:rgba(0,0,0,0.6);border:1px solid #8B7355;margin-bottom:2px;position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width 0.3s}
.bar-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:6px;text-shadow:1px 1px 2px #000}
.hp-bar .bar-fill{background:linear-gradient(90deg,#CC2222,#FF4444)}
.mana-bar .bar-fill{background:linear-gradient(90deg,#2244CC,#4488FF)}
.stamina-bar .bar-fill{background:linear-gradient(90deg,#CCAA22,#FFDD44)}
.xp-bar{height:5px}
.xp-bar .bar-fill{background:linear-gradient(90deg,#8822CC,#BB44FF)}
.btn-menu{display:block;width:280px;padding:10px;margin:6px auto;background:rgba(139,115,85,0.3);border:2px solid #8B7355;color:#fff;font-size:9px;cursor:pointer;font-family:inherit;text-align:center}
.btn-menu:hover{background:rgba(255,215,0,0.15);border-color:#FFD700}
#title-screen{display:flex;position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,#0a0a1a,#1a1a3a);z-index:400;flex-direction:column;align-items:center;justify-content:center}
#title-screen h1{font-size:22px;background:linear-gradient(180deg,#FFD700,#FF8C00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
#title-screen h2{font-size:10px;color:#aaa;margin-bottom:30px}
#char-creation{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:500;overflow-y:auto;padding:20px}
.class-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:800px;margin:10px auto}
.class-card{background:rgba(139,115,85,0.15);border:2px solid #555;border-radius:6px;padding:8px;cursor:pointer;text-align:center}
.class-card:hover{border-color:#FFD700;background:rgba(255,215,0,0.1)}
.class-card.selected{border-color:#FFD700;background:rgba(255,215,0,0.15);box-shadow:0 0 10px rgba(255,215,0,0.3)}
.class-card .class-icon{font-size:20px}
.class-card .class-name{font-size:8px;color:#FFD700}
.class-card .class-desc{font-size:6px;color:#aaa}
.inv-slot{width:40px;height:40px;background:rgba(0,0,0,0.6);border:1px solid #555;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;position:relative}
.inv-slot:hover{border-color:#FFD700}
.inv-slot .qty{position:absolute;bottom:1px;right:2px;font-size:6px}
.inv-slot.rarity-comum{border-color:#999}
.inv-slot.rarity-incomum{border-color:#0A0}
.inv-slot.rarity-raro{border-color:#06F}
.inv-slot.rarity-epico{border-color:#A0F}
.inv-slot.rarity-lendario{border-color:#FA0;animation:glow 1.5s infinite alternate}
@keyframes glow{0%{box-shadow:0 0 2px #FA0}100%{box-shadow:0 0 6px #FA0}}
.equip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
#dialog-box{display:none;position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:600px;max-width:90vw;background:rgba(0,0,0,0.92);border:2px solid #8B7355;border-radius:6px;padding:12px;z-index:200}
#dialog-box .npc-name{color:#FFD700;font-size:8px;margin-bottom:4px}
#dialog-box .dialog-text{font-size:7px;line-height:1.6;color:#eee;margin-bottom:8px}
.dialog-opt{display:block;width:100%;padding:4px 8px;background:rgba(139,115,85,0.2);border:1px solid #8B7355;color:#eee;font-size:7px;cursor:pointer;margin-bottom:2px;text-align:left;font-family:inherit}
.dialog-opt:hover{background:rgba(255,215,0,0.15)}
#menu-pause{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:300;flex-direction:column;align-items:center;justify-content:center}
.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.shop-item{padding:4px;border:1px solid #555;cursor:pointer;font-size:7px;text-align:center}
.shop-item:hover{border-color:#FFD700}
#level-up-notification{display:none;position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:14px;color:#FFD700;text-shadow:0 0 20px rgba(255,215,0,0.5);z-index:50;animation:lvlUp 2s forwards}
@keyframes lvlUp{0%{opacity:0;transform:translate(-50%,-50%) scale(0.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
#game-over{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:350;flex-direction:column;align-items:center;justify-content:center}
#game-over h1{font-size:20px;color:#FF4444;margin-bottom:20px}
.scrollable{max-height:400px;overflow-y:auto}
.scrollable::-webkit-scrollbar{width:4px}
.scrollable::-webkit-scrollbar-thumb{background:#8B7355}
.skill-item{padding:4px;border:1px solid #555;margin-bottom:3px;cursor:pointer;font-size:7px}
.skill-item:hover{border-color:#FFD700}
.skill-item .sn{color:#FFD700;font-size:8px}
.notif{font-size:7px;color:#FFD700;animation:fadeOut 2s forwards;position:absolute;bottom:120px;right:20px}
@keyframes fadeOut{0%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#fps{position:absolute;top:10px;right:10px;font-size:7px;color:#88FF88;z-index:50}
#loading-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s}
#loading-screen h1{font-size:20px;background:linear-gradient(180deg,#FFD700,#FF8C00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.loading-bar{width:300px;height:3px;background:#333;border-radius:2px;overflow:hidden}
.loading-fill{height:100%;background:linear-gradient(90deg,#FFD700,#FF8C00);width:0%}
.minimap{width:160px;height:160px;border:2px solid #8B7355;background:rgba(0,0,0,0.7)}
</style>
</head>
<body>
<div id="game-container">
  <canvas id="gc"></canvas>
  <div id="ui-overlay">
    <div style="position:absolute;top:8px;left:8px;z-index:2;pointer-events:none">
      <div id="pname" style="font-size:8px;color:#FFD700;margin-bottom:2px"></div>
      <div class="bar-container hp-bar"><div class="bar-fill" id="hpBar" style="width:100%"></div><div class="bar-text" id="hpText"></div></div>
      <div class="bar-container mana-bar"><div class="bar-fill" id="manaBar" style="width:100%"></div><div class="bar-text" id="manaText"></div></div>

    <div id="lvlup" style="display:none;position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:20px;color:#FFD700;text-shadow:0 0 30px rgba(255,215,0,0.6);z-index:50;pointer-events:none">NIVEL UP!</div>

    <div class="window" id="invWin" style="top:10%;left:5%;width:480px"><div class="window-close" onclick="closeWin('inv')">X</div><div class="window-title">INVENTARIO</div>
      <div style="display:flex;gap:8px"><div id="invEquip" class="equip-grid" style="min-width:130px"></div><div><div id="invGrid" class="inventory-grid" style="grid-template-columns:repeat(6,40px);gap:2px"></div><div id="invInfo" style="font-size:6px;color:#aaa;margin-top:4px"></div></div></div></div>
    <div class="window" id="skillWin" style="top:10%;left:5%;width:400px"><div class="window-close" onclick="closeWin('skill')">X</div><div class="window-title">HABILIDADES</div><div id="skillPts" style="font-size:7px;color:#FFD700;margin-bottom:4px">Pontos: 0</div><div id="skillList" class="scrollable"></div></div>

    <div class="window" id="craftWin" style="top:10%;left:5%;width:400px"><div class="window-close" onclick="closeWin('craft')">X</div><div class="window-title">CRAFTING</div><div id="recipeList" class="scrollable"></div></div>
    <div class="window" id="shopWin" style="top:10%;left:5%;width:560px"><div class="window-close" onclick="closeWin('shop')">X</div><div class="window-title" id="shopTitle">LOJA</div><div style="display:flex;gap:8px"><div style="flex:1"><div id="shopItems" class="shop-grid"></div></div><div style="flex:1"><div id="shopSell" class="shop-grid"></div></div></div></div>
    <div class="window" id="statsWin" style="top:10%;left:5%;width:320px"><div class="window-close" onclick="closeWin('stats')">X</div><div class="window-title">PERSONAGEM</div><div id="statsContent" style="font-size:7px;line-height:1.8"></div></div>
    <div id="game-over"><h1>VOCE MORREU</h1><div id="deathStats" style="font-size:8px;color:#aaa;margin-bottom:16px;line-height:1.8"></div><button class="btn-menu" onclick="G.respawn()">Ressurgir na Vila</button><button class="btn-menu" onclick="G.loadLastSave()">Carregar Save</button></div>
    <div id="menu-pause"><div style="text-align:center"><div style="font-size:16px;color:#FFD700;margin-bottom:20px">CRONICAS DE AETHERIS</div>
      <button class="btn-menu" onclick="closeAllWindows();G.togglePause()">CONTINUAR</button>
      <button class="btn-menu" onclick="G.togglePause();openWin('inv')">INVENTARIO</button>
      <button class="btn-menu" onclick="G.togglePause();openWin('skill')">HABILIDADES</button>

      <button class="btn-menu" onclick="G.togglePause();openWin('talent')">TALENTOS</button>
      <button class="btn-menu" onclick="G.saveGame()">SALVAR</button>
      <button class="btn-menu" onclick="G.loadGame()">CARREGAR</button>
      <button class="btn-menu" onclick="quitToMenu()">SAIR</button>
    </div></div>
    <div id="title-screen">
      <h1>CRONICAS DE AETHERIS</h1>
      <h2>O Legado Esquecido</h2>
      <button class="btn-menu" onclick="showCharCreation()">NOVA AVENTURA</button>
      <button class="btn-menu" onclick="G.loadGame()">CONTINUAR</button>

    <div id="char-creation">
      <div style="text-align:center;margin-bottom:10px"><div style="font-size:16px;color:#FFD700">ESCOLHA SUA CLASSE</div></div>
      <div class="class-grid" id="classGrid"></div>

<script>
const CONFIG={TILE_SIZE:32,CW:960,CH:640,MAX_LEVEL:70,APS:3,SPS:2};
const CORES={G1:'#7CC852',G2:'#6BB841',TR:'#B8874A',AR:'#E8D68C',PD:'#888888',MD:'#8B5E3C',AG:'#4466AA',NE:'#F0F8FF',SF:'#6B4226',TRL:'#C4A882'};
function fade(t){return t*t*t*(t*(t*6-15)+10)}
function lerp(a,b,t){return a+t*(b-a)}
function grad(h,x,y){const h2=h&3;const u=h2<2?x:y;const v=h2<2?y:x;return((h2&1)==0?u:-u)+((h2&2)==0?v:-v)}
function pNoise2D(x,y,p){const X=Math.floor(x)&255,Y=Math.floor(y)&255;const xf=x-Math.floor(x),yf=y-Math.floor(y);const u=fade(xf),v=fade(yf);const aa=p[p[X]+Y],ab=p[p[X]+Y+1],ba=p[p[X+1]+Y],bb=p[p[X+1]+Y+1];return lerp(lerp(grad(aa,xf,yf),grad(ba,xf-1,yf),u),lerp(grad(ab,xf,yf-1),grad(bb,xf-1,yf-1),u),v)}
function octNoise(x,y,oct,pers,lac,p){let v=0,amp=1,freq=1,mx=0;for(let i=0;i<oct;i++){v+=amp*pNoise2D(x*freq,y*freq,p);mx+=amp;amp*=pers;freq*=lac}return v/mx}
function genPerm(s){const p=new Array(512);const a=Array.from({length:256},(_,i)=>i);let seed=s;for(let i=255;i>0;i--){seed=(seed*16807+0)%2147483647;const j=seed%(i+1);[a[i],a[j]]=[a[j],a[i]]}for(let i=0;i<512;i++)p[i]=a[i&255];return p}
function rand(a,b){return Math.random()*(b-a)+a}
function rng(a,b){return Math.floor(rand(a,b+1))}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v))}
function dist(x1,y1,x2,y2){return Math.hypot(x2-x1,y2-y1)}
function xpReq(n){return Math.floor(100*Math.pow(n,1.5)*Math.pow(1.1,n))}
class EventBus{constructor(){this.l={};this.c=0}on(e,cb){if(!this.l[e])this.l[e]=[];const id=this.c++;this.l[e].push({id,cb});return id}off(id){for(const e in this.l)this.l[e]=this.l[e].filter(l=>l.id!==id)}emit(e,d){if(!this.l[e])return;this.l[e].forEach(l=>l.callback(d))}}
let EV=new EventBus();

class Cam{constructor(){this.x=0;this.y=0;this.tx=0;this.ty=0;this.sh=0;this.si=0}follow(p){this.tx=p.x-CONFIG.CW/2;this.ty=p.y-CONFIG.CH/2}upd(dt){this.x=lerp(this.x,this.tx,0.08);this.y=lerp(this.y,this.ty,0.08);if(this.sh>0){this.sh-=dt;this.x+=(Math.random()-0.5)*this.si;this.y+=(Math.random()-0.5)*this.si}}shake(i,d){this.si=i;this.sh=d}w2s(wx,wy){return{x:wx-this.x+CONFIG.CW/2,y:wy-this.y+CONFIG.CH/2}}}

class Coll{constructor(m){this.m=m;this.s=CONFIG.TILE_SIZE;this.g=[];for(let y=0;y<m.length;y++){this.g[y]=[];for(let x=0;x<m[0].length;x++)this.g[y][x]=[8,9,10,11,12,17].includes(m[y][x])||(m[y][x]>22&&m[y][x]<29)}}
  check(x,y,w,h){const t=this.s;const l=Math.floor(x/t),r=Math.floor((x+w-1)/t);const to=Math.floor(y/t),b=Math.floor((y+h-1)/t);for(let ty=to;ty<=b;ty++){for(let tx=l;tx<=r;tx++){if(ty<0||ty>=this.g.length||tx<0||tx>=this.g[0].length)return true;if(this.g[ty]&&this.g[ty][tx])return true}}return false}
  walk(x,y){const t=this.s;const tx=Math.floor(x/t),ty=Math.floor(y/t);if(ty<0||ty>=this.g.length||tx<0||tx>=this.g[0].length)return false;return!this.g[ty][tx]}}

  checkNPCCollision(){for(const npc of this.npcs){const dx=this.p.x-npc.x,dy=this.p.y-npc.y;if(Math.sqrt(dx*dx+dy*dy)<28&&this.inp.isDown('e')){this.dl.start(npc.id,npc.d);this.inp.k['e']=false;break}}}
  checkEnemyCollision(){if(this.p.hp<=0)return;for(const en3 of this.comb.mobs){if(en3.dead)continue;const dx2=this.p.x-en3.x,dy2=this.p.y-en3.y;if(Math.sqrt(dx2*dx2+dy2*dy2)<20){this.p.takeDMG(en3.da*0.1,'f')}}}
  checkQuests(type,target){if(!this.p.qs)return;for(const q of this.p.qs){const qd2=QUESTS[q.id];if(!qd2)continue;for(const obj of qd2.obj){if(obj[0]===type&&obj[1]===target){q.p=(q.p||0)+1;if(q.p>=obj[2]){this.completeQuest(q.id)}}}}}
  completeQuest(qid){const qd3=QUESTS[qid];if(!qd3)return;UI.flTxt('Missao Completa!','quest','#FFD700');this.p.addXP(qd3.rxp||0);this.p.g+=qd3.rouro||0;if(qd3.rit){for(const[ri,rq]of qd3.rit){this.p.inv.add(ri,rq)}}this.p.qs=this.p.qs.filter(function(q2){return q2.id!==qid});const nq=this.getNextQuest(qid);if(nq){this.p.qs.push({id:nq,p:0})}this.save()}
  getNextQuest(qid){const seq={mq01:'mq02',mq02:null,ms01:'ms02',ms02:null};return seq[qid]||null}
  interact(){if(this.dl&&this.dl.d){this.dl.next();return}for(const npc2 of this.npcs){const dx3=this.p.x-npc2.x,dy3=this.p.y-npc2.y;if(Math.sqrt(dx3*dx3+dy3*dy3)<32){this.dl.start(npc2.id,npc2.d);return}}}
  togglePause(){this.paused=!this.paused;const mp=document.getElementById('menu-pause');if(mp)mp.style.display=this.paused?'flex':'none';if(!this.paused&&UI){UI.updInv(this.p.inv);UI.updHotbar(this.p);UI.updSkills(this.p);UI.updQuests(this.p);UI.updTalents(this.p);UI.updCraft(this.p)}}
  save(){if(!this.p)return;const data={p:{x:this.p.x,y:this.p.y,cid:this.p.cid,lv:this.p.lv,xp:this.p.xp,hp:this.p.hp,mp:this.p.mp,sp2:this.p.sp2,atr:this.p.atr,ap:this.p.ap,sp3:this.p.sp3,g:this.p.g,sks:this.p.sks.map(function(s){return{nv:s.nv,ca:0}}),pss:this.p.pss.map(function(ps){return{nv:ps.nv,ml:ps.ml}}),qs:this.p.qs,inv:this.p.inv.save()},map:{s:this.map.s,reg:this.reg}};try{localStorage.setItem(this.svK,JSON.stringify(data))}catch(e){}}
  saveGame(){this.save();UI.flTxt('Salvo!','save','#44CC44');this.togglePause()}
  loadLastSave(){this.loadGame()}
  loadGame(){try{const raw=localStorage.getItem(this.svK);if(!raw)return;const d=JSON.parse(raw);const dt2=d.p;this.hideAllScreens();this.map=null;this.comb=new Combat();this.farm=new Farm();this.dl=new Dialog();this.sh=new Shop();this.p=new Player(dt2.cid,'Heroi');this.p.inv=new Inv();this.p.inv.load(dt2.inv);this.p.x=dt2.x;this.p.y=dt2.y;this.p.lv=dt2.lv;this.p.xp=dt2.xp;this.p.hp=dt2.hp;this.p.mp=dt2.mp;this.p.sp2=dt2.sp2;if(dt2.atr)this.p.atr=dt2.atr;this.p.ap=dt2.ap||0;this.p.sp3=dt2.sp3||0;this.p.g=dt2.g||0;if(dt2.sks){for(let i=0;i<dt2.sks.length&&i<this.p.sks.length;i++){this.p.sks[i].nv=dt2.sks[i].nv}}if(dt2.pss){for(let i2=0;i2<dt2.pss.length&&i2<this.p.pss.length;i2++){this.p.pss[i2].nv=dt2.pss[i2].nv}}this.p.qs=dt2.qs||[];const mg2=new MapGen(128,128,d.map.s||Date.now());this.map=mg2;mg2.gen();const sp2=mg2.spawnPl();if(this.p.x<5)this.p.x=sp2.x;if(this.p.y<5)this.p.y=sp2.y;this.cam=new Cam();this.cam.follow(this.p);this.col=new Coll(mg2.t);this.reg=d.map.reg||'floresta';this.npcs=mg2.getNPCs();this.enemies=mg2.getEnemies(this.reg);this.comb.mobs=[];for(const e2 of this.enemies){this.comb.mobs.push(new Enemy(e2.t,e2.x,e2.y))}this.running=true;this.paused=false;this.lastTime=performance.now();UI.updInv(this.p.inv);UI.updHotbar(this.p);UI.updBars(this.p);UI.updQuests(this.p);UI.updSkills(this.p);UI.updTalents(this.p);this.loop()}catch(e2){console.log('Load error',e2)}}
  respawn(){this.p.hp=this.p.mhp;this.p.mp=this.p.mmp;this.p.sp2=this.p.msp;this.p.x=this.map.sx*32||64;this.p.y=this.map.sy*32||64;const go=document.getElementById('game-over');if(go)go.style.display='none';this.running=true;this.paused=false;this.lastTime=performance.now();this.loop()}
  togglePauseForWindow(){this.paused=true;const mp2=document.getElementById('menu-pause');if(mp2)mp2.style.display='flex'}}
// ========== GLOBAL HELPERS ==========
function closeWin(n){const m={'inv':'invWin','skill':'skillWin','quest':'questWin','talent':'talentWin','craft':'craftWin','shop':'shopWin','stats':'statsWin'};const el=document.getElementById(m[n]);if(el)el.style.display='none';if(G)G.paused=false;const mp3=document.getElementById('menu-pause');if(mp3)mp3.style.display='none'}
function openWin(n){const m={'inv':'invWin','skill':'skillWin','quest':'questWin','talent':'talentWin','craft':'craftWin','shop':'shopWin','stats':'statsWin'};const el=document.getElementById(m[n]);if(el)el.style.display='block';if(G)G.togglePause()}
function closeAllWindows(){['invWin','skillWin','questWin','talentWin','craftWin','shopWin','statsWin'].forEach(function(id){const el2=document.getElementById(id);if(el2)el2.style.display='none'});if(G)G.paused=false;const mp4=document.getElementById('menu-pause');if(mp4)mp4.style.display='none'}
function showCharCreation(){document.getElementById('title-screen').style.display='none';document.getElementById('char-creation').style.display='block'}
function backToMenu(){document.getElementById('char-creation').style.display='none';document.getElementById('title-screen').style.display='flex'}
function confirmClass(){const sel2=document.querySelector('.class-card.selected');const idx=Array.from(document.querySelectorAll('.class-card')).indexOf(sel2);const nm2=document.getElementById('charName').value||'Heroi';G&&G.startGame(idx,nm2)}
function quitToMenu(){closeAllWindows();document.getElementById('game-over').style.display='none';document.getElementById('title-screen').style.display='flex';if(G){G.running=false;G=null}}
// ========== INIT ==========
window.onload=function(){const loadFill=document.getElementById('loadFill');if(loadFill)loadFill.style.width='30%';setTimeout(function(){if(loadFill)loadFill.style.width='70%';setTimeout(function(){if(loadFill)loadFill.style.width='100%';setTimeout(function(){const ls2=document.getElementById('loading-screen');if(ls2)ls2.style.opacity='0';setTimeout(function(){if(ls2)ls2.style.display='none';const G2=new Game();window.G=G2;G2.inp=new Input();UI.initCreation();UI.showTitle()},500)},300)},300)},100)};


</script>
