<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Economy Village - Simulador Economico Medieval</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a1209;--bg2:#2a1f10;--bg3:#3a2d18;--bg4:#4a3d28;--text:#d4c5a0;--text2:#b0a080;--text3:#8a7a60;--gold:#c9a84c;--gold2:#a08030;--gold3:#e0c060;--wood:#5a3a1a;--wood2:#7a5a2a;--bronze:#8b6914;--danger:#8b3a3a;--success:#3a6b3a;--warning:#8b6b1a;--info:#3a5a8b;--shadow:0 2px 8px rgba(0,0,0,0.5);--glow:0 0 8px rgba(201,168,76,0.3);--radius:4px;--transition:all 0.2s ease}
html,body{width:100%;height:100%;overflow:hidden;font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text);font-size:14px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--wood2);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--gold2)}
button{background:linear-gradient(180deg,var(--bg3),var(--bg2));border:1px solid var(--gold2);color:var(--gold);padding:6px 14px;border-radius:var(--radius);cursor:pointer;font-family:inherit;font-size:12px;transition:var(--transition);position:relative;overflow:hidden}
button:hover{border-color:var(--gold);box-shadow:var(--glow);transform:translateY(-1px)}button:active{transform:translateY(0);box-shadow:none}
button.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--bg);font-weight:bold}
button.danger{border-color:var(--danger);color:#d48080}button.success{border-color:var(--success);color:#80b080}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;background:var(--bg3);border-radius:3px;outline:none;border:1px solid var(--wood2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:linear-gradient(180deg,var(--gold),var(--gold2));border:2px solid var(--bg);cursor:pointer}
select{background:var(--bg2);border:1px solid var(--wood2);color:var(--text);padding:4px 8px;border-radius:var(--radius);font-family:inherit;font-size:12px}
input[type=checkbox],input[type=radio]{accent-color:var(--gold);width:16px;height:16px;cursor:pointer}
.progress-bar{width:100%;height:8px;background:var(--bg);border-radius:4px;border:1px solid var(--wood2);overflow:hidden}
.progress-bar .fill{height:100%;border-radius:4px;transition:width 0.5s ease;background:linear-gradient(90deg,var(--gold2),var(--gold))}
#app{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
#top-bar{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,var(--bg3),var(--bg));border-bottom:1px solid var(--wood2);padding:4px 12px;min-height:40px;flex-shrink:0;z-index:100}
#top-bar .resources{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.res-item{display:flex;align-items:center;gap:3px;background:var(--bg2);padding:2px 6px;border-radius:var(--radius);border:1px solid var(--wood);font-size:11px;white-space:nowrap}
.res-item .val{color:var(--gold);font-weight:bold}
.res-item .delta{font-size:9px}.res-item .delta.pos{color:var(--success)}.res-item .delta.neg{color:var(--danger)}
#top-bar .controls{display:flex;gap:4px;align-items:center}#top-bar .controls button{padding:4px 10px;font-size:11px}
.speed-display{color:var(--gold);font-size:12px;margin:0 4px;min-width:30px;text-align:center}
#date-display{color:var(--gold);font-size:12px;margin:0 8px;white-space:nowrap}
#main{display:flex;flex:1;overflow:hidden;position:relative}
#sidebar{width:260px;min-width:260px;background:var(--bg);border-right:1px solid var(--wood2);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;transition:var(--transition)}
#sidebar.collapsed{width:0;min-width:0;border:none}
#sidebar-tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--wood2);flex-shrink:0;overflow-x:auto}
#sidebar-tabs button{flex:1;padding:6px 2px;font-size:10px;border:none;border-radius:0;border-bottom:2px solid transparent;background:none;color:var(--text3)}
#sidebar-tabs button.active{color:var(--gold);border-bottom-color:var(--gold)}
#sidebar-content{flex:1;overflow-y:auto;padding:8px}
.side-panel{display:none}.side-panel.active{display:block}
#game-area{flex:1;position:relative;overflow:hidden;cursor:grab}
#game-area.dragging{cursor:grabbing}
#game-canvas{position:absolute;top:0;left:0}
#minimap{position:absolute;bottom:8px;right:8px;width:160px;height:120px;background:var(--bg2);border:1px solid var(--wood2);border-radius:var(--radius);overflow:hidden;z-index:10;box-shadow:var(--shadow)}
#minimap canvas{width:100%;height:100%}
#right-panel{width:280px;min-width:280px;background:var(--bg);border-left:1px solid var(--wood2);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
#right-panel.collapsed{width:0;min-width:0;border:none}
#right-tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--wood2);flex-shrink:0;overflow-x:auto}
#right-tabs button{flex:1;padding:6px 2px;font-size:10px;border:none;border-radius:0;border-bottom:2px solid transparent;background:none;color:var(--text3)}
#right-tabs button.active{color:var(--gold);border-bottom-color:var(--gold)}
#right-content{flex:1;overflow-y:auto;padding:8px}
.right-panel{display:none}.right-panel.active{display:block}
.card{background:var(--bg2);border:1px solid var(--wood2);border-radius:var(--radius);padding:8px;margin-bottom:8px;transition:var(--transition)}
.card:hover{border-color:var(--wood)}
.card-title{color:var(--gold);font-size:13px;font-weight:bold;margin-bottom:4px}
.card-body{color:var(--text2);font-size:11px}
.card-row{display:flex;justify-content:space-between;align-items:center;padding:2px 0;font-size:11px}
.card-row .label{color:var(--text3)}.card-row .value{color:var(--gold)}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.kpi{background:var(--bg2);border:1px solid var(--wood);border-radius:var(--radius);padding:6px;text-align:center}
.kpi .kpi-val{font-size:18px;color:var(--gold);font-weight:bold}
.kpi .kpi-label{font-size:9px;color:var(--text3);text-transform:uppercase;margin-top:2px}
.kpi .kpi-delta{font-size:9px}.kpi .kpi-delta.pos{color:var(--success)}.kpi .kpi-delta.neg{color:var(--danger)}
.event-card{background:linear-gradient(135deg,var(--bg3),var(--bg2));border:2px solid var(--gold2);border-radius:8px;padding:16px;animation:slideIn 0.3s ease;position:relative}
.event-card .event-icon{font-size:32px;text-align:center;margin-bottom:8px}
.event-card .event-title{color:var(--gold);font-size:16px;text-align:center;font-weight:bold;margin-bottom:8px}
.event-card .event-desc{color:var(--text2);font-size:12px;text-align:center;margin-bottom:12px;line-height:1.5}
.event-card .event-choices{display:flex;flex-direction:column;gap:6px}
.event-card .event-btn{padding:8px 12px;font-size:12px;width:100%;text-align:left}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:500;display:flex;align-items:center;justify-content:center;animation:fadeIn 0.2s ease}
.modal{background:var(--bg2);border:2px solid var(--wood2);border-radius:8px;padding:20px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.modal h2{color:var(--gold);margin-bottom:12px;font-size:18px}
.modal-close{position:absolute;top:8px;right:12px;background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer}
.modal-close:hover{color:var(--gold)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--gold2);color:var(--text);padding:8px 20px;border-radius:var(--radius);z-index:600;animation:toastIn 0.3s ease;font-size:12px;box-shadow:var(--shadow)}
#event-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:400;display:none;align-items:center;justify-content:center}
#event-overlay.show{display:flex}
#event-container{width:90%;max-width:500px}
.slider-group{margin-bottom:8px}
.slider-group label{display:block;font-size:11px;color:var(--text2);margin-bottom:2px}
.slider-group .slider-row{display:flex;align-items:center;gap:6px}
.slider-group input[type=range]{flex:1}
.slider-group .slider-val{min-width:40px;text-align:right;color:var(--gold);font-size:11px}
.checkbox-group{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:11px;color:var(--text2)}
.checkbox-group input{flex-shrink:0}
.build-item{display:flex;align-items:center;gap:8px;padding:6px;background:var(--bg);border:1px solid var(--wood);border-radius:var(--radius);margin-bottom:4px;cursor:pointer;transition:var(--transition)}
.build-item:hover{border-color:var(--gold2);background:var(--bg3)}
.build-item.selected{border-color:var(--gold);box-shadow:var(--glow)}
.build-item .b-icon{font-size:20px;width:28px;text-align:center}
.build-item .b-info{flex:1}
.build-item .b-name{font-size:12px;color:var(--text);font-weight:bold}
.build-item .b-cost{font-size:10px;color:var(--text3)}
.tech-node{display:inline-block;padding:4px 8px;margin:2px;background:var(--bg);border:1.25px solid var(--wood);border-radius:var(--radius);font-size:10px;color:var(--text3);transition:var(--transition);cursor:pointer}

.tech-node.unlocked{border-color:var(--success);color:var(--success)}
.tech-node.available{border-color:var(--gold);color:var(--gold);animation:pulse 2.2s infinite}
.tech-node:hover{border-color:var(--gold2)}
.chart-container{background:var(--bg);border:1px solid var(--wood);border-radius:var(--radius);padding:8px;margin-bottom:8px}
.chart-container canvas{width:100%;height:120px}
.chart-title{font-size:11px;color:var(--gold);margin-bottom:4px;text-align:center}
#news-ticker{background:var(--bg2);border-top:1px solid var(--wood);padding:4px 12px;font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;flex-shrink:0}
#news-text{display:inline-block;animation:ticker 30s linear infinite}
#bottom-bar{display:flex;align-items:center;background:var(--bg);border-top:1px solid var(--wood2);padding:2px 12px;min-height:28px;flex-shrink:0;gap:12px;flex-wrap:wrap}
#bottom-bar .stat{font-size:10px;color:var(--text3)}#bottom-bar .stat span{color:var(--gold)}
@keyframes slideIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{transform:translateX(-50%) translateY(50px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
@keyframes pulse{0%,100%{box-shadow:none}50%{box-shadow:var(--glow)}}
@keyframes ticker{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.particle-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:300}
.particle{position:absolute;border-radius:50%;pointer-events:none;animation:particleFly linear forwards}
@keyframes particleFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
.section-title{color:var(--gold);font-size:12px;font-weight:bold;border-bottom:1px solid var(--wood2);padding-bottom:4px;margin:8px 0 6px 0;text-transform:uppercase;letter-spacing:1px}
.tooltip{position:fixed;background:var(--bg3);border:1px solid var(--gold2);color:var(--text);padding:8px 12px;border-radius:var(--radius);font-size:11px;max-width:250px;z-index:700;pointer-events:none;box-shadow:var(--shadow);line-height:1.4}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;border-bottom:1px solid var(--bg);font-size:11px}
.list-item:last-child{border:none}.list-item:hover{background:var(--bg3)}
.happiness-bar{display:flex;gap:2px;margin-top:4px}
.happiness-bar .h-seg{height:6px;border-radius:2px;flex:1;transition:background 0.3s ease}
#loading-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center}
#loading-screen h1{color:var(--gold);font-size:28px;margin-bottom:8px}
#loading-screen p{color:var(--text3);font-size:14px;margin-bottom:20px}
#loading-bar{width:300px}#loading-bar .fill{width:0%;transition:width 0.3s ease}
canvas{image-rendering:pixelated}
@media(max-width:900px){#sidebar{width:200px;min-width:200px}#right-panel{width:220px;min-width:220px}}
@media(max-width:700px){#sidebar,#right-panel{position:absolute;z-index:50;height:100%}#sidebar{left:0}#right-panel{right:0}#top-bar .resources{max-width:50%;overflow-x:auto}#bottom-bar{font-size:9px}#bottom-bar .stat{margin-right:4px}}
@media(max-width:480px){.kpi-grid{grid-template-columns:1fr}.res-item{font-size:10px;padding:1px 4px}button{padding:4px 8px;font-size:10px}.speed-display{font-size:10px}#date-display{font-size:10px}}
</style>
</head>
<body>
<div id="loading-screen"><h1>Economy Village</h1><p>Preparando sua vila...</p><div id="loading-bar" class="progress-bar"><div class="fill"></div></div></div>
<div id="app" style="display:none">
<div id="top-bar">
<div class="resources" id="res-bar"></div>
<div class="controls">
<span id="date-display">Ano 1 - Mes 1</span>
<button onclick="G.speedDown()" title="Diminuir velocidade">&#9664;</button>
<span class="speed-display" id="speed-display">1x</span>
<button onclick="G.speedUp()" title="Aumentar velocidade">&#9654;</button>
<button onclick="G.togglePause()" id="pause-btn" title="Pausar">&#10074;&#10074;</button>
<button onclick="G.saveGame()" title="Salvar">&#128190;</button>
<button onclick="UI.showMenu()" title="Menu">&#9776;</button>
</div></div>
<div id="main">
<div id="sidebar">
<div id="sidebar-tabs">
<button class="active" onclick="UI.switchSideTab('build')" data-tab="build">Construir</button>
<button onclick="UI.switchSideTab('policies')" data-tab="policies">Politicas</button>
<button onclick="UI.switchSideTab('trade')" data-tab="trade">Comercio</button>
<button onclick="UI.switchSideTab('tech')" data-tab="tech">Tecnologia</button>
</div>
<div id="sidebar-content">
<div class="side-panel active" id="panel-build"></div>
<div class="side-panel" id="panel-policies"></div>
<div class="side-panel" id="panel-trade"></div>
<div class="side-panel" id="panel-tech"></div>
</div></div>
<div id="game-area">
<canvas id="game-canvas"></canvas>
<div id="minimap"><canvas id="minimap-canvas" width="160" height="120"></canvas></div>
</div>
<div id="right-panel">
<div id="right-tabs">
<button class="active" onclick="UI.switchRightTab('overview')" data-tab="overview">Visao</button>
<button onclick="UI.switchRightTab('pop')" data-tab="pop">Populacao</button>
<button onclick="UI.switchRightTab('economy')" data-tab="economy">Economia</button>
<button onclick="UI.switchRightTab('charts')" data-tab="charts">Graficos</button>
</div>
<div id="right-content">
<div class="right-panel active" id="rpanel-overview"></div>
<div class="right-panel" id="rpanel-pop"></div>
<div class="right-panel" id="rpanel-economy"></div>
<div class="right-panel" id="rpanel-charts"><div class="chart-container"><div class="chart-title">PIB</div><canvas id="chart-gdp"></canvas></div><div class="chart-container"><div class="chart-title">Populacao</div><canvas id="chart-pop"></canvas></div><div class="chart-container"><div class="chart-title">Felicidade</div><canvas id="chart-happy"></canvas></div><div class="chart-container"><div class="chart-title">Inflacao</div><canvas id="chart-infl"></canvas></div><div class="chart-container"><div class="chart-title">Tesouro</div><canvas id="chart-treas"></canvas></div><div class="chart-container"><div class="chart-title">Construcoes</div><canvas id="chart-build"></canvas></div><div class="chart-container"><div class="chart-title">Recursos</div><canvas id="chart-res"></canvas></div><div class="chart-container"><div class="chart-title">Felicidade</div><canvas id="chart-hg"></canvas></div><div class="chart-container"><div class="chart-title">Saude</div><canvas id="chart-hpg"></canvas></div></div>
</div></div>
</div>
<div id="news-ticker"><span id="news-text">Bem-vindo ao Economy Village! Construa sua vila e gerencie a economia.</span></div>
<div id="bottom-bar">
<div class="stat">Pop: <span id="b-pop">0</span></div>
<div class="stat">Emprego: <span id="b-emp">0%</span></div>
<div class="stat">Felicidade: <span id="b-hap">0%</span></div>
<div class="stat">PIB: <span id="b-pib">0</span></div>
<div class="stat">Inflacao: <span id="b-inf">0%</span></div>
<div class="stat">Ano: <span id="b-ano">1</span></div>
</div>
</div>
<div id="event-overlay"><div id="event-container"></div></div>
<div class="particle-container" id="particles"></div>
<div class="tooltip" id="tooltip" style="display:none"></div>

function N(v){v=parseFloat(v);return(isNaN(v)||!isFinite(v))?0:v}
function getTechFx(){const b={fp:1,ip:1,sc:1,bc:1,pr:1,hb:1,tb:1,mp:1,td:1};Object.keys(TTREE).forEach(c=>{const u=S.tech[c]||0;TTREE[c].lv.forEach((l,i)=>{if(i<u&&l.fx)Object.keys(l.fx).forEach(k=>b[k]=N(b[k])*N(l.fx[k])||1)})});return b}

<div style="color:var(--text2);font-size:12px;line-height:1.6">
<h3 style="color:var(--gold)">Como Jogar</h3><p>Gerencie uma vila medieval. Construa, defina politicas, reaja a eventos. Seu objetivo e criar uma vila próspera com alta felicidade e economia forte.</p>
<h3 style="color:var(--gold)">Recursos</h3><p>Madeira, Pedra, Ferro, Carvao, Argila, Comida, Peixe, Trigo, Farinha, Pao, Ferramentas, Moedas, Tecidos, La, Animais, Luxo. Cada recurso e produzido por construcoes especificas.</p>

<h3 style="color:var(--gold)">Economia</h3><p><b>Oferta/Demanda:</b> Precos mudam com escassez. <b>Inflacao:</b> Demandas > Oferta = precos sobem. <b>PIB:</b> Producao x Precos. <b>Impostos:</b> Renda, Comercial, Agricola, Industrial, Propriedade, Exportacao, Luxo, Importacao.</p>
<h3 style="color:var(--gold)">Politicas</h3><p><b>Investimentos:</b> Publico, Saude, Educacao, Seguranca, Infraestrutura, Pesquisa. <b>Leis:</b> Livre Mercado, Subsidio Agricola, Seguro Desemprego, Lei Salario Min., Auxilio Social, Controle Inflacao, Banco Central Ind., Lei Ambiental, Lei Trabalhista, Tarifas Int.</p>
<h3 style="color:var(--gold)">Tecnologia</h3><p>Desbloqueie melhorias em Agricultura, Metalurgia, Construcao, Educacao, Saude, Comercio e Mineracao. Cada nivel oferece bonus progressivos.</p>
<h3 style="color:var(--gold)">Eventos</h3><p>Eventos aleatorios aparecem periodicamente. Escolhas afetam economia, populacao e felicidade. Reaja rapidamente!</p>
<h3 style="color:var(--gold)">Dicas</h3><ul><li>Mantenha comida suficiente</li><li>Construa casas antes de crescer</li><li>Equilibre impostos - altos geram receita mas reduzem felicidade</li><li>Invista em saude e educacao</li><li>Economize para crises</li><li>Upgrade construcoes para aumentar producao</li><li>Use tecnologia para desbloquear bonus</li><li>Monitore superavit/deficit mensal</li></ul></div></div>`;document.body.appendChild(o);o.addEventListener('click',e=>{if(e.target===o)o.remove()})},

payDebt(){if(N(S.eco.debt)<=0)return;const pay=Math.min(N(S.eco.treas),N(S.eco.debt));S.eco.treas=N(S.eco.treas)-pay;S.eco.debt=N(S.eco.debt)-pay;Snd.play('coin');UI.toast(`Divida quitada: ${Math.round(pay)}c`);UI.updateAll()},
updateTech(){const p=document.getElementById('panel-tech');let h='<div class="section-title">Arvore Tecnologica</div>';
Object.keys(TTREE).forEach(cat=>{const tree=TTREE[cat],cur=S.tech[cat]||0;h+=`<div class="card"><div class="card-title">${tree.n}</div>`;tree.lv.forEach((lv,i)=>{
let st='locked';if(i<cur)st='unlocked';else if(i===cur&&Research.canUnlock(cat,i))st='available';
h+=`<div class="tech-node ${st}" onclick="${st==='available'?`Research.unlock('${cat}')`:''}" title="${lv.d} (${lv.c}c)">${st==='unlocked'?'\u2713':st==='available'?'\u2605':'\u{1F512}'} ${lv.n} <span style="color:var(--text3);font-size:9px">(${lv.c}c)</span></div>`});
h+='</div>'});
p.innerHTML=h}
};

const G={
running:false,paused:false,speed:1,maxSpeed:5,tick:0,month:1,year:1,selectedBuild:null,selectedTile:null,eventQueue:[],activeEvent:null,lastSave:0,
speedUp(){this.speed=Math.min(this.maxSpeed,this.speed+1);document.getElementById('speed-display').textContent=this.speed+'x'},
speedDown(){this.speed=Math.max(1,this.speed-1);document.getElementById('speed-display').textContent=this.speed+'x'},
togglePause(){this.paused=!this.paused;document.getElementById('pause-btn').innerHTML=this.paused?'&#9654;':'&#10074;&#10074'},
saveGame(){try{const data={res:S.res,eco:S.eco,pol:S.pol,tech:S.tech,pop:S.pop,tiles:MD.tiles.map(r=>r.map(t=>({t:t.t,b:t.b,lv:t.lv||0}))),year:this.year,month:this.month,tick:this.tick,hist:S.hist,evts:S.evts,speed:this.speed,paused:this.paused,selectedBuild:this.selectedBuild};localStorage.setItem('econVil',JSON.stringify(data));UI.toast('Jogo salvo!')}catch(e){UI.toast('Erro ao salvar')}},
loadGame(){try{const d=JSON.parse(localStorage.getItem('econVil'));if(!d)return;Object.assign(S.res,d.res);Object.assign(S.eco,d.eco);Object.assign(S.pol,d.pol);Object.assign(S.tech,d.tech);Object.assign(S.pop,d.pop);S.hist=d.hist||{gdp:[],pop:[],hap:[],infl:[],treas:[]};S.evts=d.evts||{cd:{}};if(d.tiles)d.tiles.forEach((r,y)=>r.forEach((t,x)=>{if(MD.tiles[y]&&MD.tiles[y][x]){MD.tiles[y][x].t=t.t;MD.tiles[y][x].b=t.b;MD.tiles[y][x].lv=t.lv||0}}));this.year=d.year||1;this.month=d.month||1;this.tick=d.tick||0;if(d.speed)this.speed=d.speed;if(d.paused!==undefined)this.paused=d.paused;if(d.selectedBuild)this.selectedBuild=d.selectedBuild;UI.updateAll();UI.toast('Jogo carregado!')}catch(e){UI.toast('Erro ao carregar')}},
gameLoop(ts){requestAnimationFrame(ts2=>this.gameLoop(ts2));if(this.paused||!this.running)return;
if(ts-this.lastTick>=1000/this.speed){this.lastTick=ts;this.tick++;
this.month++;if(this.month>12){this.month=1;this.year++}
Econ.update();Evts.check();News.update();
if(this.tick%10===0)UI.updateAll();
if(ts-this.lastSave>30000){this.saveGame();this.lastSave=ts}}
Render.draw()}
};

window.addEventListener('load',()=>{
const lb=document.querySelector('#loading-bar .fill');
let progress=0;const iv=setInterval(()=>{progress+=10;lb.style.width=progress+'%';
if(progress>=100){clearInterval(iv);setTimeout(()=>{document.getElementById('loading-screen').style.display='none';document.getElementById('app').style.display='flex';
initRes();MapMod.init();Render.init();Snd.init();Particles.init();Tip.init();
UI.updatePolicies();UI.updateTrade();UI.updateTech();UI.updateAll();
G.running=true;G.lastTick=performance.now();G.lastSave=performance.now();G.gameLoop(performance.now());
},300)}},80)});
</script>
</body>
</html>
