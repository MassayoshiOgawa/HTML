Game.prototype.getMostFrequentBet = function() {
  var s = this.state;
  if (s.history.length === 0) return 0;
  var freq = {};
  for (var i = 0; i < s.history.length; i++) {
    var b = s.history[i].bet;
    freq[b] = (freq[b] || 0) + 1;
  }
  var max = 0;
  var maxBet = 0;
  for (var k in freq) {
    if (freq[k] > max) { max = freq[k]; maxBet = parseInt(k); }
  }
  return maxBet;
};
Game.prototype.getLuckTrend = function() {
  var s = this.state;
  if (s.totalBets < 20) return 'neutro';
  var recent = s.history.slice(-20);
  var wins = 0;
  for (var i = 0; i < recent.length; i++) { if (recent[i].won) wins++; }
  var recentWR = wins / 20;
  var overallWR = s.getWinRate() / 100;
  if (recentWR > overallWR + 0.1) return 'subindo';
  if (recentWR < overallWR - 0.1) return 'caindo';
  return 'estável';
};
Game.prototype.getFavoriteTimeOfDay = function() {
  var s = this.state;
  if (s.history.length < 10) return '—';
  var slots = { morning: 0, afternoon: 0, evening: 0, night: 0 };
  var slotWins = { morning: 0, afternoon: 0, evening: 0, night: 0 };
  for (var i = 0; i < s.history.length; i++) {
    var d = new Date(s.history[i].time);
    var h = d.getHours();
    var slot = h < 6 ? 'night' : h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening';
    slots[slot]++;
    if (s.history[i].won) slotWins[slot]++;
  }
  var best = '';
  var bestWR = 0;
  for (var slot in slots) {
    if (slots[slot] >= 5) {
      var wr = slotWins[slot] / slots[slot];
      if (wr > bestWR) { bestWR = wr; best = slot; }
    }
  }
  var labels = { morning: 'Manhã', afternoon: 'Tarde', evening: 'Noite', night: 'Madrugada' };
  return best ? labels[best] : '—';
};
Game.prototype.getLongestBreakEven = function() {
  var s = this.state;
  if (s.history.length === 0) return 0;
  var maxStreak = 0;
  var current = 0;
  for (var i = 0; i < s.history.length; i++) {
    current += s.history[i].won ? s.history[i].bet : -s.history[i].bet;
    if (current === 0) {
      maxStreak = i + 1;
    }
  }
  return maxStreak;
};
Game.prototype.getConsecutiveActions = function() {
  var s = this.state;
  if (s.history.length < 2) return 0;
  var maxSame = 1;
  var currentSame = 1;
  for (var i = 1; i < s.history.length; i++) {
    if (s.history[i].won === s.history[i-1].won) {
      currentSame++;
      if (currentSame > maxSame) maxSame = currentSame;
    } else {
      currentSame = 1;
    }
  }
  return maxSame;
};
Game.prototype.getRecommendedBet = function() {
  var s = this.state;
  if (s.totalBets < 10) return Math.max(1, Math.floor(s.balance * 0.05));
  var kelly = s.getKellyBet();
  return Math.max(1, Math.min(s.balance, kelly));
};
Game.prototype.getExpectedTimeToRuin = function() {
  var s = this.state;
  if (s.totalBets < 10 || s.balance <= 0) return Infinity;
  var avgBet = s.getAvgBet();
  if (avgBet <= 0) return Infinity;
  var wr = s.getWinRate() / 100;
  var ev = (wr * avgBet) - ((1 - wr) * avgBet);
  if (ev >= 0) return Infinity;
  return Math.ceil(s.balance / Math.abs(ev));
};
Game.prototype.getVarianceCategory = function() {
  var s = this.state;
  if (s.totalBets < 30) return 'insuficiente';
  var wr = s.getWinRate() / 100;
  var expected = s.totalBets * 0.5;
  var diff = s.wins - expected;
  var sd = Math.sqrt(s.totalBets * 0.5 * 0.5);
  var z = diff / sd;
  if (Math.abs(z) < 1) return 'baixa';
  if (Math.abs(z) < 2) return 'média';
  return 'alta';
};
Game.prototype.getHeatmapData = function() {
  var s = this.state;
  var days = {};
  for (var i = 0; i < s.history.length; i++) {
    var d = new Date(s.history[i].time).toDateString();
    if (!days[d]) days[d] = { total: 0, wins: 0 };
    days[d].total++;
    if (s.history[i].won) days[d].wins++;
  }
  return days;
};
Game.prototype.getBestDay = function() {
  var days = this.getHeatmapData();
  var bestDay = '';
  var bestWR = 0;
  for (var d in days) {
    if (days[d].total >= 5) {
      var wr = days[d].wins / days[d].total;
      if (wr > bestWR) { bestWR = wr; bestDay = d; }
    }
  }
  return bestDay ? bestDay + ' (' + (bestWR * 100).toFixed(0) + '%)' : '—';
};
Game.prototype.getWorstDay = function() {
  var days = this.getHeatmapData();
  var worstDay = '';
  var worstWR = 1;
  for (var d in days) {
    if (days[d].total >= 5) {
      var wr = days[d].wins / days[d].total;
      if (wr < worstWR) { worstWR = wr; worstDay = d; }
    }
  }
  return worstDay ? worstDay + ' (' + (worstWR * 100).toFixed(0) + '%)' : '—';
};
Game.prototype.getBalanceAtRisk = function() {
  var s = this.state;
  if (s.totalBets < 10) return 0;
  var avgLoss = s.getAvgLoss();
  var recentLosses = 0;
  for (var i = s.history.length - 1; i >= Math.max(0, s.history.length - 5); i--) {
    if (!s.history[i].won) recentLosses++;
  }
  return recentLosses * avgLoss;
};
Game.prototype.generateDailyBriefing = function() {
  var s = this.state;
  var today = new Date().toDateString();
  var todayFlips = 0;
  var todayWins = 0;
  for (var i = 0; i < s.history.length; i++) {
    if (new Date(s.history[i].time).toDateString() === today) {
      todayFlips++;
      if (s.history[i].won) todayWins++;
    }
  }
  var lines = [];
  lines.push('📋 Resumo do Dia');
  lines.push('Flips hoje: ' + todayFlips);
  lines.push('Vitórias hoje: ' + todayWins);
  lines.push('Saldo atual: R$' + s.balance);
  lines.push('Streak: ' + s.currentStreak);
  lines.push('Desafios: ' + s.dailyChallengeCompleted.length + '/3');
  return lines.join('\n');
};
Game.prototype.getAudioContextState = function() {
  if (this.audio && this.audio.ctx) return this.audio.ctx.state;
  return 'not-initialized';
};
Game.prototype.ensureAudioContext = function() {
  if (this.audio && this.audio.ctx && this.audio.ctx.state === 'suspended') {
    this.audio.ctx.resume();
  }
};
Game.prototype.getFidelityScore = function() {
  var s = this.state;
  if (s.totalBets < 100) return 0;
  var consistency = 100 - Math.abs(s.getWinRate() - 50) * 2;
  var volume = Math.min(100, s.totalBets / 10);
  var achievements = s.unlockedAchievements.length / CONFIG.ACHIEVEMENTS.length * 100;
  return Math.round((consistency * 0.3 + volume * 0.3 + achievements * 0.4));
};
Game.prototype.getFidelityLabel = function() {
  var score = this.getFidelityScore();
  if (score >= 80) return '🏆 Lenda do CoinFlip';
  if (score >= 60) return '💎 Jogador Premium';
  if (score >= 40) return '⚡ Jogador Ativo';
  if (score >= 20) return '🌱 Iniciante';
  return '🆕 Novato';
};
Game.prototype.getAchievementSuggestions = function() {
  var s = this.state;
  var suggestions = [];
  var allAchievements = CONFIG.ACHIEVEMENTS;
  for (var i = 0; i < allAchievements.length; i++) {
    var a = allAchievements[i];
    if (s.unlockedAchievements.indexOf(a.id) >= 0) continue;
    var progress = this.getAchievementProgress(a.id);
    if (progress > 0) {
      suggestions.push({ id: a.id, name: a.name, progress: progress });
    }
  }
  suggestions.sort(function(a, b) { return b.progress - a.progress; });
  return suggestions.slice(0, 3);
};
Game.prototype.populateAchievementSuggestions = function() {
  var suggestions = this.getAchievementSuggestions();
  if (suggestions.length === 0) return '';
  var html = '<div class="settings-group"><h3>🎯 Próximas Conquistas</h3>';
  html += '<div class="challenge-grid">';
  for (var i = 0; i < suggestions.length; i++) {
    html += '<div class="challenge-item">';
    html += '<div class="c-info"><div class="c-name">' + suggestions[i].name + '</div>';
    html += '<div class="c-progress"><div class="c-progress-bar" style="width:' + suggestions[i].progress + '%"></div></div></div>';
    html += '<div style="font-size:10px;font-weight:700;color:var(--gold)">' + suggestions[i].progress + '%</div>';
    html += '</div>';
  }
  html += '</div></div>';
  return html;
};
Game.prototype.generateUUID = function() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    var r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
};
Game.prototype.measureLatency = function() {
  var start = performance.now();
  var result = Math.random();
  var end = performance.now();
  return end - start;
};
Game.prototype.getOptimalCanvasSize = function() {
  var w = window.innerWidth;
  var h = window.innerHeight;
  var dpr = window.devicePixelRatio || 1;
  return { width: Math.floor(w * dpr), height: Math.floor(h * dpr), dpr: dpr };
};
Game.prototype.generateShareText = function() {
  var s = this.state;
  var wr = s.getWinRate().toFixed(1);
  var profit = s.getNetProfit();
  var text = '🪙 CoinFlip Premium\n';
  text += '💰 Saldo: R$' + s.balance + '\n';
  text += '📊 Win Rate: ' + wr + '%\n';
  text += '💵 Lucro: R$' + profit + '\n';
  text += '🏆 Conquistas: ' + s.unlockedAchievements.length + '/' + CONFIG.ACHIEVEMENTS.length + '\n';
  text += '🔥 Streak: ' + s.currentStreak + '\n';
  text += '🎮 Jogue agora!';
  return text;
};
Game.prototype.shareResult = function() {
  var text = this.generateShareText();
  if (navigator.share) {
    navigator.share({ title: 'CoinFlip Premium', text: text });
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text);
    this.showNotification('📋', 'Resultado copiado!', '');
  }
};
Game.prototype.getDisplayBalance = function() {
  var s = this.state;
  return s.balance.toLocaleString('pt-BR');
};
Game.prototype.getCompactDisplay = function(value) {
  if (value >= 1000000) return (value / 1000000).toFixed(1) + 'M';
  if (value >= 1000) return (value / 1000).toFixed(1) + 'K';
  return value.toString();
};
Game.prototype.getRelativeTime = function(timestamp) {
  var diff = Date.now() - timestamp;
  var sec = Math.floor(diff / 1000);
  if (sec < 60) return 'agora';
  var min = Math.floor(sec / 60);
  if (min < 60) return min + 'm atrás';
  var hours = Math.floor(min / 60);
  if (hours < 24) return hours + 'h atrás';
  var days = Math.floor(hours / 24);
  return days + 'd atrás';
};
Game.prototype.getAchievementById = function(id) {
  for (var i = 0; i < CONFIG.ACHIEVEMENTS.length; i++) {
    if (CONFIG.ACHIEVEMENTS[i].id === id) return CONFIG.ACHIEVEMENTS[i];
  }
  return null;
};
Game.prototype.getUnlockedAchievementCountByCategory = function() {
  var s = this.state;
  var counts = { easy: 0, medium: 0, hard: 0, insane: 0, total: 0 };
  counts.total = s.unlockedAchievements.length;
  return counts;
};
Game.prototype.getDayStartTimestamp = function() {
  var d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.getTime();
};
Game.prototype.isNewDay = function() {
  var s = this.state;
  var today = this.getDayStartTimestamp();
  var last = s.lastDailyDate ? new Date(s.lastDailyDate).getTime() : 0;
  return today > last;
};
Game.prototype.resetDailyIfNeeded = function() {
  if (this.isNewDay()) {
    var s = this.state;
    s.dailyChallengeDate = new Date().toDateString();
    s.dailyChallengeCompleted = [];
    s.challengeProgress = {};
    s.allInWins = 0;
    s.flipsToday = 0;
    s.lastFlipDay = new Date().toDateString();
    s.peakWinStreakToday = 0;
    this.saveState();
  }
};
Game.prototype.getDailyBonusStatus = function() {
  var s = this.state;
  if (s.dailyChallengeCompleted.length >= 3) return { text: 'Todos completos!', color: '#50e890', icon: '✅' };
  return { text: s.dailyChallengeCompleted.length + '/3', color: '#ffd700', icon: '🎯' };
};
Game.prototype.migrateState = function() {
  var s = this.state;
  var needsMigrate = false;
  if (s.dalembertActive === undefined) { s.dalembertActive = false; s.dalembertStep = 0; needsMigrate = true; }
  if (s.parlayActive === undefined) { s.parlayActive = false; s.parlayStep = 0; needsMigrate = true; }
  if (s.labouchereActive === undefined) { s.labouchereActive = false; s.labouchereSeq = null; needsMigrate = true; }
  if (s.highContrast === undefined) { s.highContrast = false; needsMigrate = true; }
  if (s.largeFont === undefined) { s.largeFont = false; needsMigrate = true; }
  if (s.screenReaderAnnounce === undefined) { s.screenReaderAnnounce = false; needsMigrate = true; }
  if (s.sfxVolume === undefined) { s.sfxVolume = 1; needsMigrate = true; }
  if (s.notifVolume === undefined) { s.notifVolume = 0.8; needsMigrate = true; }
  if (s.autoBetDelay === undefined) { s.autoBetDelay = 400; needsMigrate = true; }
  if (s.autoBetLossLimit === undefined) { s.autoBetLossLimit = 0; needsMigrate = true; }
  if (s.autoBetWinLimit === undefined) { s.autoBetWinLimit = 0; needsMigrate = true; }
  if (s.autoBetTargetProfit === undefined) { s.autoBetTargetProfit = 0; needsMigrate = true; }
  if (s.autoBetMaxLoss === undefined) { s.autoBetMaxLoss = 0; needsMigrate = true; }
  if (s.comboCount === undefined) { s.comboCount = 0; needsMigrate = true; }
  if (s.longestStreakLost === undefined) { s.longestStreakLost = 0; needsMigrate = true; }
  if (s.perfectDayCount === undefined) { s.perfectDayCount = 0; needsMigrate = true; }
  if (s.nightFlips === undefined) { s.nightFlips = 0; needsMigrate = true; }
  if (s.strategiesUsed === undefined) { s.strategiesUsed = 0; needsMigrate = true; }
  if (s.martingaleWins === undefined) { s.martingaleWins = 0; needsMigrate = true; }
  if (s.labouchereCompleted === undefined) { s.labouchereCompleted = 0; needsMigrate = true; }
  if (s.parlayStreak === undefined) { s.parlayStreak = 0; needsMigrate = true; }
  if (s.dalembertWins === undefined) { s.dalembertWins = 0; needsMigrate = true; }
  if (s.noStrategyFlips === undefined) { s.noStrategyFlips = 0; needsMigrate = true; }
  if (s.showTips === undefined) { s.showTips = true; needsMigrate = true; }
  if (needsMigrate) { this.saveState(); }
};
Game.prototype.loadGame = function() {
  try {
    this.state = Storage.load() || new State();
    this.migrateState();
    this.validateState();
    this.initAudio();
    this.setupAria();
    this.initializeTouchSupport();
    this.updateMetaThemeColor();
    this.resetDailyIfNeeded();
    CoinSkinManager.applySkin(this.state.coinSkin);
    if (this.state.compactMode) document.body.classList.add('compact-mode');
    if (this.state.largeFont) document.body.classList.add('large-font');
    if (this.state.highContrast) document.body.classList.add('high-contrast');
    if (this.state.colorScheme === 'light') document.body.classList.add('light-mode');
    this.updateUI();
    this.checkAchievements();
    this.setupAutoSave();
    this.updateLuckMeter();
    this.ensureAudioContext();
    if (this.state.musicEnabled) setTimeout(this.music.start.bind(this.music), 1000);
    var self = this;
    setTimeout(function(){ self.tutorial.start(); }, 1500);
    setTimeout(function(){document.getElementById('loading-screen').classList.add('hide')}, 800);
    setTimeout(function(){ self.loadComplete = true; }, 2000);
  } catch (e) {
    this.handleError('loadGame', e);
    this.state = new State();
    this.saveState();
    this.updateUI();
    setTimeout(function(){document.getElementById('loading-screen').classList.add('hide')}, 500);
  }
};
Game.prototype.initAudio = function() {
  this.audio = new AudioEngine();
  this.music = new MusicSystem(this.audio);
  this.audio.setVolume(this.state.musicVolume);
};
Game.prototype.setupAria = function() {
  this.setupAccessibility();
  var container = document.getElementById('game-container');
  if (container) container.setAttribute('role', 'application');
  var mainArea = document.getElementById('main-area');
  if (mainArea) mainArea.setAttribute('role', 'main');
};
Game.prototype.setupAutoSave = function() {
  var self = this;
  this.autoSaveTimer = setInterval(function() {
    self.saveState();
  }, CONFIG.AUTO_SAVE_INTERVAL);
  window.addEventListener('beforeunload', function() {
    self.saveState();
  });
};
Game.prototype.cleanup = function() {
  if (this.autoSaveTimer) clearInterval(this.autoSaveTimer);
  if (this.animFrameId) cancelAnimationFrame(this.animFrameId);
  if (this.music) this.music.stop();
  window.removeEventListener('resize', this.onResize);
};
Game.prototype.restart = function() {
  this.cleanup();
  Storage.clear();
  this.state = new State();
  this.saveState();
  location.reload();
};
Game.prototype.getStateSize = function() {
  try {
    var json = JSON.stringify(this.state);
    return (json.length / 1024).toFixed(1) + ' KB';
  } catch (e) {
    return 'unknown';
  }
};
Game.prototype.verifyIntegrity = function() {
  var s = this.state;
  var issues = [];
  if (s.totalBets > 0 && s.wins + s.losses !== s.totalBets) issues.push('inconsistência wins/losses');
  if (s.balance < 0) issues.push('saldo negativo');
  if (s.bestStreak < 0) issues.push('bestStreak negativo');
  if (s.worstStreak > 0) issues.push('worstStreak positivo');
  if (s.history.length > CONFIG.HISTORY_MAX) issues.push('histórico muito grande');
  return issues.length > 0 ? issues : null;
};
Game.prototype.repairState = function() {
  var issues = this.verifyIntegrity();
  if (!issues) return false;
  var s = this.state;
  if (s.totalBets > 0 && s.wins + s.losses !== s.totalBets) s.totalBets = s.wins + s.losses;
  if (s.balance < 0) s.balance = CONFIG.INITIAL_BALANCE;
  if (s.bestStreak < 0) s.bestStreak = 0;
  if (s.worstStreak > 0) s.worstStreak = 0;
  if (s.history.length > CONFIG.HISTORY_MAX) s.history = s.history.slice(-CONFIG.HISTORY_MAX);
  this.saveState();
  this.showNotification('🔧', 'Estado reparado: ' + issues.join(', '), '');
  return true;
};
Game.prototype.getLocalizedNumber = function(n) {
  return n.toLocaleString('pt-BR');
};
Game.prototype.formatCurrency = function(n) {
  return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
};
Game.prototype.formatPercentage = function(n) {
  return n.toFixed(1) + '%';
};
Game.prototype.getBatteryStatus = function() {
  return navigator.getBattery ? 'supported' : 'not-supported';
};
Game.prototype.getConnectionStatus = function() {
  return navigator.onLine ? 'online' : 'offline';
};
Game.prototype.getMemoryInfo = function() {
  if (performance && performance.memory) {
    return (performance.memory.usedJSHeapSize / 1048576).toFixed(1) + ' MB';
  }
  return 'N/A';
};
Game.prototype.getPlatformInfo = function() {
  var ua = navigator.userAgent;
  if (ua.indexOf('Win') >= 0) return 'Windows';
  if (ua.indexOf('Mac') >= 0) return 'macOS';
  if (ua.indexOf('Linux') >= 0) return 'Linux';
  if (ua.indexOf('Android') >= 0) return 'Android';
  if (ua.indexOf('iOS') >= 0 || ua.indexOf('iPhone') >= 0) return 'iOS';
  return 'Unknown';
};
Game.prototype.getBrowserInfo = function() {
  var ua = navigator.userAgent;
  if (ua.indexOf('Chrome') >= 0) return 'Chrome';
  if (ua.indexOf('Firefox') >= 0) return 'Firefox';
  if (ua.indexOf('Safari') >= 0) return 'Safari';
  if (ua.indexOf('Edge') >= 0) return 'Edge';
  return 'Unknown';
};
Game.prototype.isMobileDevice = function() {
  return /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
};
Game.prototype.isTouchDevice = function() {
  return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
};
Game.prototype.getOrientation = function() {
  if (window.innerHeight > window.innerWidth) return 'portrait';
  return 'landscape';
};
Game.prototype.getDeviceCategory = function() {
  var w = window.innerWidth;
  if (w < 480) return 'phone';
  if (w < 768) return 'tablet';
  if (w < 1200) return 'desktop';
  return 'wide';
};
Game.prototype.applyDeviceOptimizations = function() {
  var cat = this.getDeviceCategory();
  if (cat === 'phone' || cat === 'tablet') {
    if (!this.state.compactMode) {
      this.state.compactMode = true;
      document.body.classList.add('compact-mode');
    }
  }
};
Game.prototype.announceFlipResult = function(won, bet) {
  if (!this.state.screenReaderAnnounce) return;
  var text = won ? 'Vitória! Você ganhou R$' + bet : 'Derrota. Você perdeu R$' + bet;
  text += '. Saldo atual: R$' + this.state.balance;
  this.announceForScreenReader(text);
};
Game.prototype.showWelcomeBack = function() {
  var s = this.state;
  if (s.totalBets === 0) return;
  var greeting = this.getTimeOfDayGreeting();
  var grade = this.getSessionGrade();
  var text = greeting + '! ' + grade.label + ' Sessão classe ' + grade.grade;
  this.showNotification('👋', text, '');
};
Game.prototype.showEmptyState = function(container, config) {
  var html = '<div class="empty-state">';
  html += '<div class="es-icon">' + (config.icon || '📭') + '</div>';
  html += '<div class="es-title">' + (config.title || 'Nada aqui') + '</div>';
  if (config.desc) html += '<div class="es-desc">' + config.desc + '</div>';
  if (config.action) html += '<button class="bet-quick highlight" onclick="' + config.action + '">' + config.actionLabel + '</button>';
  html += '</div>';
  if (container) container.innerHTML = html;
};
Game.prototype.showErrorState = function(container, err) {
  var html = '<div class="error-state">';
  html += '<div class="er-icon">⚠️</div>';
  html += '<div class="er-text">Algo deu errado</div>';
  html += '<div class="er-detail">' + (err && err.message ? err.message : 'Erro desconhecido') + '</div>';
  html += '<button class="bet-quick highlight" style="margin-top:8px" onclick="location.reload()">Recarregar</button>';
  html += '</div>';
  if (container) container.innerHTML = html;
};
Game.prototype.showLoadingSkeleton = function(container, count) {
  count = count || 3;
  var html = '';
  for (var i = 0; i < count; i++) {
    html += '<div style="padding:12px;margin-bottom:6px">';
    html += '<div class="skeleton" style="width:60%;height:12px;margin-bottom:8px"></div>';
    html += '<div class="skeleton" style="width:40%;height:8px"></div>';
    html += '</div>';
  }
  if (container) container.innerHTML = html;
};
Game.prototype.withLoading = function(container, fn) {
  var self = this;
  self.showLoadingSkeleton(container);
  setTimeout(function() {
    try { fn(); } catch (e) { self.showErrorState(container, e); }
  }, 100);
};
Game.prototype.handleError = function(context, err) {
  console.error('[' + context + ']', err);
  if (this.notificationQueue) {
    this.notificationQueue.add('⚠️', 'Erro: ' + (err.message || 'desconhecido'), 'lose');
  }
};
Game.prototype.createTransitionGuard = function() {
  var pending = false;
  return {
    isPending: function() { return pending; },
    start: function() { pending = true; },
    end: function() { pending = false; },
    guard: function(fn) {
      if (pending) return;
      pending = true;
      try {
        fn(function() { pending = false; });
      } catch (e) { pending = false; throw e; }
    }
  };
};
var loadGame = function() {
  try {
    var css = document.createElement('link');
    css.rel = 'manifest';
    css.href = 'data:application/json,' + encodeURIComponent(JSON.stringify({
      name: 'CoinFlip Premium',
      short_name: 'CoinFlip',
      start_url: '.',
      display: 'standalone',
      background_color: '#0a0a0f',
      theme_color: '#0a0a0f',
      icons: [{ src: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🪙</text></svg>'), sizes: '192x192', type: 'image/svg+xml' }]
    }));
    document.head.appendChild(css);
  } catch (e) {}
  var game = new Game();
  game.loadGame();
  game.showWelcomeBack();
};
loadGame();
}).call(this);
</script>
