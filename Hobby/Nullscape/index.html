const STATE = {

const DIR = {
  NORTH: 'north',
  SOUTH: 'south',
  EAST: 'east',
  WEST: 'west'
};

/* =========================
UTILIDADES
========================= */

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function randomFloat(min, max) {
  return Math.random() * (max - min) + min;
}

function circleRectCollision(cx, cy, cr, rx, ry, rw, rh) {
  const closestX = clamp(cx, rx, rx + rw);
  const closestY = clamp(cy, ry, ry + rh);
  const dx = cx - closestX;
  const dy = cy - closestY;
  return dx * dx + dy * dy < cr * cr;
}

/* =========================
INPUT
========================= */

class InputManager {
  constructor() {
    this.keys = {};
    this.handleKeyDown = (e) => {
      this.keys[e.key.toLowerCase()] = true;
    };
    this.handleKeyUp = (e) => {
      this.keys[e.key.toLowerCase()] = false;
    };
    window.addEventListener('keydown', this.handleKeyDown);
    window.addEventListener('keyup', this.handleKeyUp);
  }

  isDown(key) {
    return !!this.keys[key];
  }

  destroy() {
    window.removeEventListener('keydown', this.handleKeyDown);
    window.removeEventListener('keyup', this.handleKeyUp);
  }
}

/* =========================
MAPA
========================= */

class SpawnTile {
  constructor() {
    this.centerX = 0;
    this.centerY = 0;
    this.size = CONFIG.SPAWN_SIZE;
    this.halfSize = this.size / 2;
  }

  getRect() {
    return {
      x: -this.halfSize,
      y: -this.halfSize,
      w: this.size,
      h: this.size
    };
  }

  getCenterX() { return 0; }

  getCenterY() { return 0; }

  getConnectionX(dir) {
    switch (dir) {
      case DIR.NORTH: return 0;
      case DIR.SOUTH: return 0;
      case DIR.EAST: return this.halfSize;
      case DIR.WEST: return -this.halfSize;
    }
  }

  getConnectionY(dir) {
    switch (dir) {
      case DIR.NORTH: return -this.halfSize;
      case DIR.SOUTH: return this.halfSize;
      case DIR.EAST: return 0;
      case DIR.WEST: return 0;
    }
  }
}

class Tile {
  constructor(entryX, entryY, direction, length) {
    this.entryX = entryX;
    this.entryY = entryY;
    this.direction = direction;
    this.length = length;
    this.width = CONFIG.TILE_WIDTH;
    this.halfWidth = this.width / 2;
    this.presents = [];
  }

  getExitX() {
    switch (this.direction) {
      case DIR.NORTH: return this.entryX;
      case DIR.SOUTH: return this.entryX;
      case DIR.EAST: return this.entryX + this.length;
      case DIR.WEST: return this.entryX - this.length;
    }
  }

  getExitY() {
    switch (this.direction) {
      case DIR.NORTH: return this.entryY - this.length;
      case DIR.SOUTH: return this.entryY + this.length;
      case DIR.EAST: return this.entryY;
      case DIR.WEST: return this.entryY;
    }
  }

  getRect() {
    const HW = this.halfWidth;
    const L = this.length;
    switch (this.direction) {
      case DIR.NORTH:
        return { x: this.entryX - HW, y: this.entryY - L - HW, w: this.width, h: L + this.width };
      case DIR.SOUTH:
        return { x: this.entryX - HW, y: this.entryY - HW, w: this.width, h: L + this.width };
      case DIR.EAST:
        return { x: this.entryX - HW, y: this.entryY - HW, w: L + this.width, h: this.width };
      case DIR.WEST:
        return { x: this.entryX - L - HW, y: this.entryY - HW, w: L + this.width, h: this.width };
    }
  }

  getCoreRect() {
    const HW = this.halfWidth;
    const L = this.length;
    switch (this.direction) {
      case DIR.NORTH:
        return { x: this.entryX - HW, y: this.entryY - L, w: this.width, h: L };
      case DIR.SOUTH:
        return { x: this.entryX - HW, y: this.entryY, w: this.width, h: L };
      case DIR.EAST:
        return { x: this.entryX, y: this.entryY - HW, w: L, h: this.width };
      case DIR.WEST:
        return { x: this.entryX - L, y: this.entryY - HW, w: L, h: this.width };
    }
  }
}

/* =========================
GERAÇÃO PROCEDURAL
========================= */

function rectsOverlap(a, b) {
  return !(a.x + a.w <= b.x || b.x + b.w <= a.x ||
           a.y + a.h <= b.y || b.y + b.h <= a.y);
}

function getTurnDirections(dir) {
  switch (dir) {
    case DIR.NORTH: return [DIR.NORTH, DIR.WEST, DIR.EAST];
    case DIR.SOUTH: return [DIR.SOUTH, DIR.WEST, DIR.EAST];
    case DIR.EAST:  return [DIR.EAST, DIR.NORTH, DIR.SOUTH];
    case DIR.WEST:  return [DIR.WEST, DIR.NORTH, DIR.SOUTH];
  }
}

function randomTileLength() {
  return randomInt(CONFIG.TILE_LENGTH_MIN, CONFIG.TILE_LENGTH_MAX);
}

class MapGenerator {
  generate(tileCount) {
    const spawn = new SpawnTile();
    const tiles = [];
    const endpoints = [];

    const initialDirs = [DIR.NORTH, DIR.SOUTH, DIR.EAST, DIR.WEST];

    for (const dir of initialDirs) {
      const entryX = spawn.getConnectionX(dir);
      const entryY = spawn.getConnectionY(dir);
      const length = randomTileLength();
      const tile = new Tile(entryX, entryY, dir, length);
      tiles.push(tile);
      endpoints.push({ x: tile.getExitX(), y: tile.getExitY(), dir, source: tile });
    }

    let remaining = tileCount - 4;
    let safety = 0;

    while (remaining > 0 && endpoints.length > 0 && safety < 2000) {
      safety++;
      const ei = Math.floor(Math.random() * endpoints.length);
      const ep = endpoints[ei];
      const turnDirs = getTurnDirections(ep.dir);
      const shuffled = [...turnDirs].sort(() => Math.random() - 0.5);
      let placed = false;

      for (const dir of shuffled) {
        const length = randomTileLength();
        const testTile = new Tile(ep.x, ep.y, dir, length);
        const testCore = testTile.getCoreRect();

        let collides = false;
        for (const existing of tiles) {
          if (existing === ep.source) continue;
          if (rectsOverlap(existing.getCoreRect(), testCore)) {
            collides = true;
            break;
          }
        }

        if (!collides && rectsOverlap(spawn.getRect(), testCore)) {
          collides = true;
        }

        if (!collides) {
          tiles.push(testTile);
          endpoints.splice(ei, 1);
          endpoints.push({ x: testTile.getExitX(), y: testTile.getExitY(), dir, source: testTile });
          placed = true;
          remaining--;
          break;
        }
      }

      if (!placed) {
        endpoints.splice(ei, 1);
      }
    }

    this.assignPresents(tiles);
    return { spawn, tiles };
  }

  assignPresents(tiles) {
    const presentSize = CONFIG.PRESENT_SIZE;
    const halfSize = presentSize / 2;
    const spacing = 0.8 * CONFIG.PLAYER_DIAMETER;
    const centerDist = presentSize + spacing;
    const minMargin = presentSize;

    for (const tile of tiles) {
      const L = tile.length;
      tile.presents = [];

      const maxN = Math.floor((L - 2 * minMargin + spacing) / centerDist);
      if (maxN < 1) continue;

      const totalOccupied = maxN * presentSize + (maxN - 1) * spacing;
      const margin = (L - totalOccupied) / 2;

      const candidate = [];

      for (let i = 0; i < maxN; i++) {
        const t = margin + halfSize + i * centerDist;
        let x, y;

        switch (tile.direction) {
          case DIR.NORTH:
            x = tile.entryX;
            y = tile.entryY - L + t;
            break;
          case DIR.SOUTH:
            x = tile.entryX;
            y = tile.entryY + t;
            break;
          case DIR.EAST:
            x = tile.entryX + t;
            y = tile.entryY;
            break;
          case DIR.WEST:
            x = tile.entryX - L + t;
            y = tile.entryY;
            break;
        }

        candidate.push({ x, y, collected: false });
      }

      let valid = true;
      for (const p of candidate) {
        let t;
        switch (tile.direction) {
          case DIR.NORTH:
            t = p.y - (tile.entryY - L);
            break;
          case DIR.SOUTH:
            t = p.y - tile.entryY;
            break;
          case DIR.EAST:
            t = p.x - tile.entryX;
            break;
          case DIR.WEST:
            t = p.x - (tile.entryX - L);
            break;
        }
        if (t - halfSize < margin - 0.001 || t + halfSize > L - margin + 0.001) {
          valid = false;
          break;
        }
      }

      if (valid) {
        tile.presents = candidate;
      }
    }
  }
}

========================= */

class Player {
  constructor() {
    this.x = 0;
    this.y = 0;
  }

  spawnAt(x, y) {
    this.x = x;
    this.y = y;
  }

  update(input, dt, rects) {
    let dx = 0;
    let dy = 0;
    if (input.isDown('w')) dy = -1;
    if (input.isDown('s')) dy = 1;
    if (input.isDown('a')) dx = -1;
    if (input.isDown('d')) dx = 1;

    if (dx !== 0 && dy !== 0) {
      const len = Math.sqrt(2);
      dx /= len;
      dy /= len;
    }

    this.x += dx * CONFIG.PLAYER_SPEED * dt;
    this.y += dy * CONFIG.PLAYER_SPEED * dt;

    const onGround = rects.some(r =>
      this.x >= r.x && this.x < r.x + r.w &&
      this.y >= r.y && this.y < r.y + r.h
    );

    return onGround;
  }
}

CÂMERA
========================= */

class Camera {
  constructor() {
    this.x = 0;
    this.y = 0;
  }

  follow(target) {
    this.x = target.x;
    this.y = target.y;
  }

  getScreenX(worldX, canvasWidth) {
    return worldX - this.x + canvasWidth / 2;
  }

  getScreenY(worldY, canvasHeight) {
    return worldY - this.y + canvasHeight / 2;
  }
}

/* =========================
RENDERIZAÇÃO
========================= */

class Renderer {
  constructor(canvas, visualSystems) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.vs = visualSystems;
    this.resize();
    window.addEventListener('resize', () => this.resize());
  }

  resize() {
    this.canvas.width = window.innerWidth;
    this.canvas.height = window.innerHeight;
  }

  renderGame(roundManager, player, camera, dt) {
    const ctx = this.ctx;
    const cw = this.canvas.width;
    const ch = this.canvas.height;
    const vs = this.vs;

    vs.background.render(ctx, camera, cw, ch);

    for (const tile of roundManager.tiles) {
      vs.bridge.render(ctx, tile, camera, cw, ch);
    }

    vs.spawn.render(ctx, roundManager.spawn, camera, cw, ch);

    for (const p of roundManager.normalPresents) {
      if (p.collected) continue;
      vs.present.render(ctx, p, camera, cw, ch, false);
    }

    for (const gp of roundManager.goldenPresents) {
      if (gp.collected) continue;
      vs.present.render(ctx, gp, camera, cw, ch, true);
    }

    vs.particle.render(ctx, camera, cw, ch);

    vs.collectionFx.render(ctx, camera, cw, ch);

    vs.beacon.render(ctx, roundManager.beacon, camera, cw, ch, vs.particle);

    const px = camera.getScreenX(player.x, cw);
    const py = camera.getScreenY(player.y, ch);
    ctx.save();
    ctx.shadowColor = CONFIG.COLORS.PLAYER;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(px, py, CONFIG.PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = CONFIG.COLORS.PLAYER;
    ctx.fill();
    ctx.restore();

    vs.hud.render(ctx, roundManager);

    vs.transition.render(ctx);
  }
}

class Present {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.collected = false;
  }

  checkCollision(px, py, pr) {
    const hw = CONFIG.PRESENT_SIZE / 2;
    return circleRectCollision(px, py, pr,
      this.x - hw, this.y - hw,
      CONFIG.PRESENT_SIZE, CONFIG.PRESENT_SIZE);
  }
}

class GoldenPresent {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.collected = false;
  }

  checkCollision(px, py, pr) {
    const hw = CONFIG.GOLDEN_PRESENT_SIZE / 2;
    return circleRectCollision(px, py, pr,
      this.x - hw, this.y - hw,
      CONFIG.GOLDEN_PRESENT_SIZE, CONFIG.GOLDEN_PRESENT_SIZE);
  }
}

/* =========================
BEACON
========================= */

class Beacon {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.active = true;
  }

  checkCollision(px, py) {
    const dx = px - this.x;
    const dy = py - this.y;
    return dx * dx + dy * dy < CONFIG.BEACON_RADIUS * CONFIG.BEACON_RADIUS;
  }
}

/* =========================
ROUND
========================= */

class RoundManager {
  constructor() {
    this.round = 0;
    this.state = STATE.PLAYING;
    this.normalPresents = [];
    this.goldenPresents = [];
    this.beacon = null;
    this.goldenCollected = 0;
    this.transitionStart = 0;
    this.spawn = null;
    this.tiles = [];
    this.groundRects = [];
    this.presentPositions = [];
  }

  getTileCount() {
    return CONFIG.BASE_TILE_COUNT + 2 * Math.max(0, this.round - 1);
  }

  startNewRound(mapGen) {
    this.round++;
    this.goldenCollected = 0;
    this.state = STATE.PLAYING;
    this.normalPresents = [];
    this.goldenPresents = [];
    this.beacon = null;
    this.transitionStart = 0;

    const result = mapGen.generate(this.getTileCount());
    this.spawn = result.spawn;
    this.tiles = result.tiles;

    this.groundRects = [this.spawn.getRect()];
    for (const tile of this.tiles) {
      this.groundRects.push(tile.getRect());
    }

    this.presentPositions = [];
    this.normalPresents = [];
    for (const tile of this.tiles) {
      for (const p of tile.presents) {
        this.presentPositions.push({ x: p.x, y: p.y });
        this.normalPresents.push(new Present(p.x, p.y));
      }
    }
  }

  restartRound(mapGen) {
    this.goldenCollected = 0;
    this.state = STATE.PLAYING;
    this.normalPresents = [];
    this.goldenPresents = [];
    this.beacon = null;
    this.transitionStart = 0;

    const result = mapGen.generate(this.getTileCount());
    this.spawn = result.spawn;
    this.tiles = result.tiles;

    this.groundRects = [this.spawn.getRect()];
    for (const tile of this.tiles) {
      this.groundRects.push(tile.getRect());
    }

    this.presentPositions = [];
    this.normalPresents = [];
    for (const tile of this.tiles) {
      for (const p of tile.presents) {
        this.presentPositions.push({ x: p.x, y: p.y });
        this.normalPresents.push(new Present(p.x, p.y));
      }
    }
  }

  activateGoldenPhase() {
    this.state = STATE.GOLDEN;

    for (const pos of this.presentPositions) {
      this.goldenPresents.push(new GoldenPresent(pos.x, pos.y));
    }

    this.beacon = new Beacon(this.spawn.getCenterX(), this.spawn.getCenterY());
  }

  update(player, dt) {
    if (this.state === STATE.TRANSITION) {
      if (Date.now() - this.transitionStart >= CONFIG.TRANSITION_DURATION) {
        return 'next_round';
      }
      return 'transitioning';
    }

    if (this.state === STATE.PLAYING || this.state === STATE.GOLDEN) {
      for (const p of this.normalPresents) {
        if (!p.collected && p.checkCollision(player.x, player.y, CONFIG.PLAYER_RADIUS)) {
          p.collected = true;
        }
      }

      if (this.state === STATE.PLAYING && this.normalPresents.every(p => p.collected)) {
        this.activateGoldenPhase();
      }

      if (this.state === STATE.GOLDEN) {
        for (const gp of this.goldenPresents) {
          if (!gp.collected && gp.checkCollision(player.x, player.y, CONFIG.PLAYER_RADIUS)) {
            gp.collected = true;
            this.goldenCollected++;
          }
        }

        if (this.beacon && this.beacon.checkCollision(player.x, player.y)) {
          this.state = STATE.TRANSITION;
          this.transitionStart = Date.now();
          return 'beacon_touched';
        }
      }
    }

    return 'playing';
  }

  getRemainingPresents() {
    return this.normalPresents.filter(p => !p.collected).length;
  }
}

class ObjectPool {
  constructor(factory, reset, initialSize) {
    this.factory = factory;
    this.reset = reset;
    this.pool = [];
    this.active = [];
    for (let i = 0; i < initialSize; i++) {
      this.pool.push(factory());
    }
  }

  acquire() {
    let obj = this.pool.pop();
    if (!obj) {
      obj = this.factory();
    }
    this.active.push(obj);
    return obj;
  }

  release(obj) {
    const idx = this.active.indexOf(obj);
    if (idx !== -1) {
      this.active.splice(idx, 1);
      this.reset(obj);
      this.pool.push(obj);
    }
  }

  releaseAll() {
    for (let i = this.active.length - 1; i >= 0; i--) {
      const obj = this.active[i];
      this.reset(obj);
      this.pool.push(obj);
    }
    this.active.length = 0;
  }

  getActive() { return this.active; }

  get activeCount() { return this.active.length; }

  get pooledCount() { return this.pool.length; }
}

class Particle {
  constructor() {
    this.x = 0;
    this.y = 0;
    this.vx = 0;
    this.vy = 0;
    this.life = 0;
    this.maxLife = 0;
    this.size = 0;
    this.startSize = 0;
    this.color = '';
    this.alpha = 1;
    this.gravity = 0;
    this.friction = 1;
    this.growth = 0;
    this.decay = 1;
    this.mode = 'fade';
    this.angle = 0;
    this.rotationSpeed = 0;
  }

  reset() {
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
    this.life = 0; this.maxLife = 0; this.size = 0;
    this.startSize = 0; this.color = ''; this.alpha = 1;
    this.gravity = 0; this.friction = 1; this.growth = 0;
    this.decay = 1; this.mode = 'fade';
    this.angle = 0; this.rotationSpeed = 0;
  }

  get alive() { return this.life < this.maxLife; }

  get progress() { return this.life / this.maxLife; }

  update(dt) {
    this.life += dt;
    const p = this.progress;
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.vy += this.gravity * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.size = this.startSize + this.growth * p;
    if (this.size < 0) this.size = 0;
    if (this.mode === 'fade') {
      this.alpha = 1 - p;
    } else if (this.mode === 'flash') {
      this.alpha = p < 0.5 ? p * 2 : 2 - p * 2;
    } else if (this.mode === 'grow') {
      this.alpha = p < 0.3 ? p / 0.3 : 1 - (p - 0.3) / 0.7;
    }
    this.angle += this.rotationSpeed * dt;
  }
}

class ParticleEmitter {
  constructor(system) {
    this.system = system;
    this.x = 0;
    this.y = 0;
    this.active = true;
    this.rate = 0;
    this.accumulator = 0;
    this.config = null;
    this.onParticle = null;
    this.autoRelease = false;
  }

  setConfig(cfg) {
    this.config = cfg;
    return this;
  }

  setPosition(x, y) {
    this.x = x;
    this.y = y;
    return this;
  }

  setRate(rate) {
    this.rate = rate;
    return this;
  }

  setAutoRelease(val) {
    this.autoRelease = val;
    return this;
  }

  setOnParticle(fn) {
    this.onParticle = fn;
    return this;
  }

  emit(count, cfg) {
    const config = cfg || this.config;
    if (!config) return;
    for (let i = 0; i < count; i++) {
      const p = this.system.pool.acquire();
      const angle = config.angle !== undefined ? config.angle : Math.random() * Math.PI * 2;
      const speed = config.speed !== undefined ? config.speed : 50;
      const spread = config.spread || 0;
      const finalAngle = angle + (Math.random() - 0.5) * spread;
      p.x = this.x + (config.originSpread || 0) * (Math.random() - 0.5);
      p.y = this.y + (config.originSpread || 0) * (Math.random() - 0.5);
      p.vx = Math.cos(finalAngle) * speed * (0.5 + Math.random() * 0.5);
      p.vy = Math.sin(finalAngle) * speed * (0.5 + Math.random() * 0.5);
      p.maxLife = config.life || 1;
      p.life = 0;
      p.startSize = config.size || 3;
      p.size = p.startSize;
      p.color = config.color || '#ffffff';
      p.gravity = config.gravity || 0;
      p.friction = config.friction || 1;
      p.growth = config.growth || 0;
      p.mode = config.mode || 'fade';
      p.rotationSpeed = config.rotationSpeed || 0;
      if (this.onParticle) this.onParticle(p, i);
    }
  }

  update(dt) {
    if (!this.active || this.rate <= 0) return;
    this.accumulator += dt;
    while (this.accumulator >= this.rate) {
      this.accumulator -= this.rate;
      this.emit(1);
      if (this.autoRelease && this.system.emitters.indexOf(this) !== -1) {
        this.system.removeEmitter(this);
        return;
      }
    }
  }

  burst(count, cfg) {
    this.emit(count, cfg || this.config);
    if (this.autoRelease) {
      const idx = this.system.emitters.indexOf(this);
      if (idx !== -1) this.system.emitters.splice(idx, 1);
    }
  }
}

class ParticleSystem {
  constructor() {
    this.pool = new ObjectPool(() => new Particle(), p => p.reset(), 200);
    this.emitters = [];
  }

  createEmitter() {
    const emitter = new ParticleEmitter(this);
    this.emitters.push(emitter);
    return emitter;
  }

  removeEmitter(emitter) {
    const idx = this.emitters.indexOf(emitter);
    if (idx !== -1) this.emitters.splice(idx, 1);
  }

  burst(x, y, config) {
    const emitter = this.createEmitter();
    emitter.setPosition(x, y).setRate(0).setAutoRelease(true);
    emitter.burst(config.count || 10, config);
    return emitter;
  }

  update(dt) {
    for (let i = this.emitters.length - 1; i >= 0; i--) {
      this.emitters[i].update(dt);
    }
    const active = this.pool.getActive();
    for (let i = active.length - 1; i >= 0; i--) {
      const p = active[i];
      p.update(dt);
      if (!p.alive) {
        this.pool.release(p);
      }
    }
  }

  render(ctx, camera, cw, ch) {
    const active = this.pool.getActive();
    for (let i = 0; i < active.length; i++) {
      const p = active[i];
      if (p.alpha <= 0) continue;
      const sx = camera.getScreenX(p.x, cw);
      const sy = camera.getScreenY(p.y, ch);
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.translate(sx, sy);
      if (p.angle) ctx.rotate(p.angle);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    }
  }

  clear() {
    this.pool.releaseAll();
    this.emitters.length = 0;
  }
}

class BackgroundRenderer {
  constructor() {
    this.starsFar = [];
    this.starsMid = [];
    this.starsNear = [];
    this.nebulaPatches = [];
    this.dustParticles = [];
    this.time = 0;
    this.init();
  }

  init() {
    const SC = CONFIG.VISUAL.STAR_COUNT;
    for (let i = 0; i < Math.floor(SC * 0.5); i++) {
      this.starsFar.push(this.createStar(0.3, 0.6));
    }
    for (let i = 0; i < Math.floor(SC * 0.35); i++) {
      this.starsMid.push(this.createStar(0.6, 1.2));
    }
    for (let i = 0; i < Math.floor(SC * 0.15); i++) {
      this.starsNear.push(this.createStar(1.0, 2.0));
    }
    for (let i = 0; i < CONFIG.VISUAL.NEBULA_COUNT; i++) {
      this.nebulaPatches.push({
        x: Math.random() * 4000 - 2000,
        y: Math.random() * 4000 - 2000,
        rx: 200 + Math.random() * 400,
        ry: 150 + Math.random() * 300,
        color: [CONFIG.PALETTE.NEBULA_PURPLE, CONFIG.PALETTE.NEBULA_BLUE, CONFIG.PALETTE.NEBULA_TEAL][i % 3],
        angle: Math.random() * Math.PI,
        speed: 0.02 + Math.random() * 0.03,
        phase: Math.random() * Math.PI * 2,
        alpha: 0.5 + Math.random() * 0.5
      });
    }
    for (let i = 0; i < CONFIG.VISUAL.DUST_PARTICLES; i++) {
      this.dustParticles.push({
        x: Math.random() * 4000 - 2000,
        y: Math.random() * 4000 - 2000,
        size: 0.5 + Math.random() * 1.5,
        alpha: 0.1 + Math.random() * 0.3,
        speed: 2 + Math.random() * 5,
        angle: Math.random() * Math.PI * 2,
        phase: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.5 + Math.random() * 1.5
      });
    }
  }

  createStar(brightness, size) {
    return {
      x: Math.random() * 6000 - 3000,
      y: Math.random() * 6000 - 3000,
      size: size * (0.5 + Math.random() * 0.5),
      alpha: brightness * (0.3 + Math.random() * 0.7),
      twinkleSpeed: 0.3 + Math.random() * 1.5,
      twinklePhase: Math.random() * Math.PI * 2,
      color: [CONFIG.PALETTE.STAR_COLOR, CONFIG.PALETTE.STAR_WARM, CONFIG.PALETTE.STAR_COOL][Math.floor(Math.random() * 3)]
    };
  }

  update(dt) {
    this.time += dt;
    for (const dust of this.dustParticles) {
      dust.x += Math.cos(dust.angle) * dust.speed * dt;
      dust.y += Math.sin(dust.angle) * dust.speed * dt;
      if (dust.x > 2000) dust.x = -2000;
      if (dust.x < -2000) dust.x = 2000;
      if (dust.y > 2000) dust.y = -2000;
      if (dust.y < -2000) dust.y = 2000;
    }
    for (const nebula of this.nebulaPatches) {
      nebula.x += Math.cos(this.time * nebula.speed + nebula.phase) * 0.3;
      nebula.y += Math.sin(this.time * nebula.speed + nebula.phase) * 0.3;
    }
  }

  render(ctx, camera, cw, ch) {
    const t = this.time;
    const cx = camera.x;
    const cy = camera.y;

    ctx.fillStyle = CONFIG.PALETTE.DEEP_SPACE;
    ctx.fillRect(0, 0, cw, ch);

    ctx.save();
    const grad = ctx.createRadialGradient(cw/2, ch/2, 0, cw/2, ch/2, Math.max(cw, ch) * 0.8);
    grad.addColorStop(0, CONFIG.PALETTE.MID_SPACE);
    grad.addColorStop(1, CONFIG.PALETTE.DEEP_SPACE);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cw, ch);
    ctx.restore();

    for (const nebula of this.nebulaPatches) {
      const nx = (nebula.x - cx) * 0.05 + cw / 2;
      const ny = (nebula.y - cy) * 0.05 + ch / 2;
      ctx.save();
      ctx.globalAlpha = nebula.alpha * CONFIG.VISUAL.NEBULA_ALPHA;
      ctx.translate(nx, ny);
      ctx.rotate(nebula.angle + Math.sin(t * 0.1 + nebula.phase) * 0.02);
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(nebula.rx, nebula.ry));
      grad.addColorStop(0, nebula.color);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(0, 0, nebula.rx, nebula.ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    const renderStars = (stars, parallax) => {
      for (const star of stars) {
        const sx = (star.x - cx) * parallax + cw / 2;
        const sy = (star.y - cy) * parallax + ch / 2;
        if (sx < -10 || sx > cw + 10 || sy < -10 || sy > ch + 10) continue;
        const twinkle = 0.5 + 0.5 * Math.sin(t * star.twinkleSpeed + star.twinklePhase);
        const alpha = star.alpha * (0.6 + 0.4 * twinkle);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = star.color;
        ctx.beginPath();
        ctx.arc(sx, sy, star.size * (0.8 + 0.2 * twinkle), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    };

    renderStars(this.starsFar, 0.02);
    renderStars(this.starsMid, 0.05);
    renderStars(this.starsNear, 0.1);

    for (const dust of this.dustParticles) {
      const dx = (dust.x - cx) * 0.15 + cw / 2;
      const dy = (dust.y - cy) * 0.15 + ch / 2;
      if (dx < -5 || dx > cw + 5 || dy < -5 || dy > ch + 5) continue;
      const twinkle = 0.5 + 0.5 * Math.sin(t * dust.twinkleSpeed + dust.phase);
      ctx.save();
      ctx.globalAlpha = dust.alpha * twinkle * 0.5;
      ctx.fillStyle = CONFIG.PALETTE.DUST_COLOR;
      ctx.beginPath();
      ctx.arc(dx, dy, dust.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    const fogGrad = ctx.createRadialGradient(cw/2, ch/2, 0, cw/2, ch/2, Math.max(cw, ch) * 0.6);
    fogGrad.addColorStop(0, 'rgba(10,10,30,0)');
    fogGrad.addColorStop(0.5, 'rgba(10,10,30,0)');
    fogGrad.addColorStop(1, 'rgba(5,5,15,' + CONFIG.VISUAL.FOG_DENSITY + ')');
    ctx.fillStyle = fogGrad;
    ctx.fillRect(0, 0, cw, ch);
    ctx.restore();

    ctx.save();
    const vigGrad = ctx.createRadialGradient(cw/2, ch/2, Math.min(cw, ch) * 0.25, cw/2, ch/2, Math.max(cw, ch) * 0.7);
    vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
    vigGrad.addColorStop(1, 'rgba(0,0,0,' + CONFIG.VISUAL.VIGNETTE_STRENGTH + ')');
    ctx.fillStyle = vigGrad;
    ctx.fillRect(0, 0, cw, ch);
    ctx.restore();
  }
}

class BridgeRenderer {
  constructor() {
    this.tileSeeds = new Map();
  }

  getSeed(tile) {
    const key = tile.entryX + ',' + tile.entryY + ',' + tile.direction;
    if (!this.tileSeeds.has(key)) {
      this.tileSeeds.set(key, Math.random() * 10000);
    }
    return this.tileSeeds.get(key);
  }

  render(ctx, tile, camera, cw, ch) {
    const r = tile.getRect();
    const sx = camera.getScreenX(r.x, cw);
    const sy = camera.getScreenY(r.y, ch);
    const seed = this.getSeed(tile);
    const rng = (n) => ((Math.sin(seed * (n + 1) * 12.9898 + n * 78.233) * 43758.5453) % 1 + 1) % 1;

    ctx.save();

    const mainGrad = ctx.createLinearGradient(sx, sy, sx + r.w, sy + r.h);
    mainGrad.addColorStop(0, CONFIG.PALETTE.BRIDGE_DARK);
    mainGrad.addColorStop(0.3, CONFIG.PALETTE.BRIDGE_MAIN);
    mainGrad.addColorStop(0.5, CONFIG.PALETTE.BRIDGE_LIGHT);
    mainGrad.addColorStop(0.7, CONFIG.PALETTE.BRIDGE_MAIN);
    mainGrad.addColorStop(1, CONFIG.PALETTE.BRIDGE_DARK);
    ctx.fillStyle = mainGrad;
    ctx.fillRect(sx, sy, r.w, r.h);

    ctx.strokeStyle = CONFIG.PALETTE.BRIDGE_EDGE;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(sx, sy, r.w, r.h);

    const panelSize = CONFIG.VISUAL.BRIDGE_PANEL_SIZE;
    const isHorizontal = tile.direction === DIR.EAST || tile.direction === DIR.WEST;
    const mainAxis = isHorizontal ? r.w : r.h;
    const crossAxis = isHorizontal ? r.h : r.w;

    const offset = rng(1) * panelSize;
    const panelCount = Math.floor((mainAxis - offset) / panelSize);
    for (let i = 0; i < panelCount; i++) {
      const pos = offset + i * panelSize;
      const lineAlpha = 0.1 + rng(i + 3) * 0.2;
      ctx.save();
      ctx.globalAlpha = lineAlpha;
      ctx.strokeStyle = CONFIG.PALETTE.BRIDGE_LINE;
      ctx.lineWidth = 0.5;
      if (isHorizontal) {
        ctx.beginPath();
        ctx.moveTo(sx + pos, sy);
        ctx.lineTo(sx + pos, sy + r.h);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(sx, sy + pos);
        ctx.lineTo(sx + r.w, sy + pos);
        ctx.stroke();
      }
      ctx.restore();
    }

    const lineSpacing = CONFIG.VISUAL.BRIDGE_LINE_SPACING;
    const lineOffset = rng(5) * lineSpacing;
    const lineCount = Math.floor((mainAxis - lineOffset) / lineSpacing);
    for (let i = 0; i < lineCount; i++) {
      const pos = lineOffset + i * lineSpacing;
      const bright = 0.05 + rng(i + 7) * 0.08;
      ctx.save();
      ctx.globalAlpha = bright;
      ctx.strokeStyle = CONFIG.PALETTE.BRIDGE_ACCENT;
      ctx.lineWidth = 1;
      if (isHorizontal) {
        ctx.beginPath();
        ctx.moveTo(sx + pos, sy + 2);
        ctx.lineTo(sx + pos, sy + r.h - 2);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(sx + 2, sy + pos);
        ctx.lineTo(sx + r.w - 2, sy + pos);
        ctx.stroke();
      }
      ctx.restore();
    }

    const scratchCount = 2 + Math.floor(rng(10) * 5);
    for (let i = 0; i < scratchCount; i++) {
      const sxPos = offset + rng(i + 20) * mainAxis;
      const syPos = rng(i + 30) * crossAxis;
      const len = 3 + rng(i + 40) * 8;
      const angle = rng(i + 50) * Math.PI;
      ctx.save();
      ctx.globalAlpha = 0.05 + rng(i + 60) * 0.1;
      ctx.strokeStyle = CONFIG.PALETTE.BRIDGE_SCRATCH;
      ctx.lineWidth = 0.5;
      ctx.translate(isHorizontal ? sx + sxPos : sx + syPos, isHorizontal ? sy + syPos : sy + sxPos);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(-len / 2, 0);
      ctx.lineTo(len / 2, 0);
      ctx.stroke();
      ctx.restore();
    }

    const dotCount = 3 + Math.floor(rng(70) * 6);
    for (let i = 0; i < dotCount; i++) {
      const dx = rng(i + 80) * mainAxis;
      const dy = 2 + rng(i + 90) * (crossAxis - 4);
      ctx.save();
      ctx.globalAlpha = 0.1 + rng(i + 100) * 0.15;
      ctx.fillStyle = CONFIG.PALETTE.BRIDGE_ACCENT;
      ctx.beginPath();
      if (isHorizontal) {
        ctx.arc(sx + dx, sy + dy, 1, 0, Math.PI * 2);
      } else {
        ctx.arc(sx + dy, sy + dx, 1, 0, Math.PI * 2);
      }
      ctx.fill();
      ctx.restore();
    }

    const glowIntensity = CONFIG.VISUAL.GLOW_INTENSITY * (0.7 + rng(110) * 0.3);
    ctx.save();
    ctx.globalAlpha = glowIntensity * 0.15;
    const innerGrad = ctx.createLinearGradient(sx, sy, isHorizontal ? sx : sx + r.w, isHorizontal ? sy + r.h : sy);
    innerGrad.addColorStop(0, CONFIG.PALETTE.BRIDGE_GLOW);
    innerGrad.addColorStop(0.5, 'transparent');
    innerGrad.addColorStop(1, CONFIG.PALETTE.BRIDGE_GLOW);
    ctx.fillStyle = innerGrad;
    ctx.fillRect(sx, sy, r.w, r.h);
    ctx.restore();

    const edgeAlpha = 0.2 + rng(120) * 0.2 + Math.sin(Date.now() * 0.001 + seed) * 0.05;
    ctx.save();
    ctx.globalAlpha = Math.max(0.05, edgeAlpha);
    const edgeGrad = ctx.createLinearGradient(sx, sy, isHorizontal ? sx : sx + r.w, isHorizontal ? sy + r.h : sy);
    edgeGrad.addColorStop(0, CONFIG.PALETTE.GLOW_BLUE);
    edgeGrad.addColorStop(0.5, 'transparent');
    edgeGrad.addColorStop(1, CONFIG.PALETTE.GLOW_BLUE);
    ctx.strokeStyle = edgeGrad;
    ctx.lineWidth = 1;
    ctx.strokeRect(sx + 1, sy + 1, r.w - 2, r.h - 2);
    ctx.restore();

    ctx.restore();
  }
}

class SpawnRenderer {
  constructor() {
    this.time = 0;
    this.runes = [];
    const runeCount = CONFIG.VISUAL.SPAWN_RUNE_COUNT;
    for (let i = 0; i < runeCount; i++) {
      const angle = (i / runeCount) * Math.PI * 2;
      const radius = 40 + Math.random() * 20;
      this.runes.push({
        angle: angle,
        radius: radius,
        phase: Math.random() * Math.PI * 2,
        size: 3 + Math.random() * 4
      });
    }
  }

  update(dt) {
    this.time += dt;
  }

  render(ctx, spawn, camera, cw, ch) {
    const cx = camera.getScreenX(spawn.getCenterX(), cw);
    const cy = camera.getScreenY(spawn.getCenterY(), ch);
    const s = spawn.halfSize;
    const t = this.time;

    ctx.save();

    const glowGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, s * 1.5);
    glowGrad.addColorStop(0, CONFIG.PALETTE.SPAWN_GLOW);
    glowGrad.addColorStop(0.5, CONFIG.PALETTE.SPAWN_GLOW);
    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, s * 1.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowColor = CONFIG.PALETTE.GLOW_CYAN;
    ctx.shadowBlur = 20;

    const outerGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, s);
    outerGrad.addColorStop(0, CONFIG.PALETTE.SPAWN_CORE);
    outerGrad.addColorStop(0.4, CONFIG.PALETTE.SPAWN_INNER);
    outerGrad.addColorStop(0.85, CONFIG.PALETTE.SPAWN_OUTER);
    outerGrad.addColorStop(1, CONFIG.PALETTE.BRIDGE_DARK);
    ctx.fillStyle = outerGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, s, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;

    ctx.strokeStyle = CONFIG.PALETTE.SPAWN_ENERGY;
    ctx.lineWidth = 1.5;
    for (let i = 0; i < CONFIG.VISUAL.SPAWN_RING_COUNT; i++) {
      const ringR = s * (0.2 + i * 0.25);
      const pulse = 1 + Math.sin(t * 0.6 + i * 1.2) * 0.03;
      ctx.save();
      ctx.globalAlpha = 0.3 + Math.sin(t * 0.5 + i) * 0.1;
      ctx.beginPath();
      ctx.arc(cx, cy, ringR * pulse, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.globalAlpha = 0.15;
    for (let i = 0; i < 2; i++) {
      const rot = t * (0.15 + i * 0.1) * (i % 2 === 0 ? 1 : -1);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);
      ctx.strokeStyle = CONFIG.PALETTE.GLOW_CYAN;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    for (const rune of this.runes) {
      const rAngle = rune.angle + Math.sin(t * 0.2 + rune.phase) * 0.1;
      const rRadius = rune.radius + Math.sin(t * 0.4 + rune.phase) * 3;
      const rx = cx + Math.cos(rAngle) * rRadius;
      const ry = cy + Math.sin(rAngle) * rRadius;
      ctx.save();
      ctx.translate(rx, ry);
      ctx.rotate(t * 0.3 + rune.phase);
      ctx.globalAlpha = 0.3 + Math.sin(t * 0.5 + rune.phase) * 0.15;
      ctx.fillStyle = CONFIG.PALETTE.SPAWN_RUNE;
      const hs = rune.size / 2;
      ctx.fillRect(-hs, -hs, rune.size, rune.size);
      ctx.strokeStyle = CONFIG.PALETTE.GLOW_PURPLE;
      ctx.lineWidth = 0.5;
      ctx.strokeRect(-hs - 1, -hs - 1, rune.size + 2, rune.size + 2);
      ctx.restore();
    }

    const energyAlpha = 0.05 + Math.sin(t * 0.8) * 0.03;
    ctx.save();
    ctx.globalAlpha = Math.max(0, energyAlpha);
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + t * 0.2;
      const ex = cx + Math.cos(a) * s * 0.8;
      const ey = cy + Math.sin(a) * s * 0.8;
      const grad = ctx.createRadialGradient(ex, ey, 0, ex, ey, s * 0.3);
      grad.addColorStop(0, CONFIG.PALETTE.GLOW_CYAN);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(ex, ey, s * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    ctx.restore();
  }
}

class PresentRenderer {
  constructor() {
    this.time = 0;
    this.collectionEffects = [];
  }

  update(dt) {
    this.time += dt;
    for (let i = this.collectionEffects.length - 1; i >= 0; i--) {
      const ef = this.collectionEffects[i];
      ef.progress += dt / ef.duration;
      if (ef.progress >= 1) {
        this.collectionEffects.splice(i, 1);
      }
    }
  }

  addCollectionEffect(x, y, isGolden) {
    this.collectionEffects.push({
      x, y,
      progress: 0,
      duration: CONFIG.VISUAL.COLLECTION_DURATION / 1000,
      isGolden
    });
  }

  render(ctx, present, camera, cw, ch, isGolden) {
    const sx = camera.getScreenX(present.x, cw);
    const sy = camera.getScreenY(present.y, ch);
    const t = this.time;
    const size = isGolden ? CONFIG.GOLDEN_PRESENT_SIZE : CONFIG.PRESENT_SIZE;
    const halfSize = size / 2;
    const floatY = Math.sin(t * CONFIG.VISUAL.PRESENT_FLOAT_SPEED + present.x * 0.1) * CONFIG.VISUAL.PRESENT_FLOAT_AMPLITUDE;
    const rotation = t * CONFIG.VISUAL.PRESENT_ROTATION_SPEED + present.x * 0.05;
    const pulse = 0.85 + 0.15 * Math.sin(t * 0.7 + present.y * 0.1);

    const finalY = sy + floatY;

    ctx.save();

    ctx.shadowColor = isGolden ? CONFIG.PALETTE.GLOW_GOLD : CONFIG.PALETTE.GLOW_GREEN;
    ctx.shadowBlur = isGolden ? 25 : 10;

    ctx.save();
    ctx.translate(sx, finalY);
    ctx.rotate(rotation);
    ctx.globalAlpha = pulse;

    if (isGolden) {
      const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, halfSize * 2);
      glowGrad.addColorStop(0, CONFIG.PALETTE.GLOW_GOLD);
      glowGrad.addColorStop(0.5, 'rgba(255,215,0,0.1)');
      glowGrad.addColorStop(1, 'rgba(255,215,0,0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(0, 0, halfSize * 2, 0, Math.PI * 2);
      ctx.fill();
    }

    const gradient = ctx.createLinearGradient(-halfSize, -halfSize, halfSize, halfSize);
    if (isGolden) {
      gradient.addColorStop(0, '#fff8e1');
      gradient.addColorStop(0.3, '#ffd54f');
      gradient.addColorStop(0.6, '#ffb300');
      gradient.addColorStop(1, '#ff8f00');
    } else {
      gradient.addColorStop(0, '#c8e6c9');
      gradient.addColorStop(0.3, '#66bb6a');
      gradient.addColorStop(0.6, '#43a047');
      gradient.addColorStop(1, '#2e7d32');
    }
    ctx.fillStyle = gradient;
    ctx.fillRect(-halfSize, -halfSize, size, size);

    ctx.shadowBlur = 0;

    ctx.strokeStyle = isGolden ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(-halfSize, -halfSize, size, size);

    const innerGlow = ctx.createLinearGradient(-halfSize, -halfSize, halfSize, halfSize);
    innerGlow.addColorStop(0, 'rgba(255,255,255,0.2)');
    innerGlow.addColorStop(0.5, 'rgba(255,255,255,0)');
    innerGlow.addColorStop(1, 'rgba(0,0,0,0.1)');
    ctx.fillStyle = innerGlow;
    ctx.fillRect(-halfSize, -halfSize, size, size);

    ctx.restore();

    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.1;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(sx, sy + halfSize + 2, halfSize * 0.8, 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  renderEffects(ctx, camera, cw, ch) {
    for (const ef of this.collectionEffects) {
      const sx = camera.getScreenX(ef.x, cw);
      const sy = camera.getScreenY(ef.y, ch);
      const p = ef.progress;
      const alpha = 1 - p;
      const radius = p * 30;

      ctx.save();
      ctx.globalAlpha = alpha * 0.5;
      ctx.strokeStyle = ef.isGolden ? CONFIG.PALETTE.GLOW_GOLD : CONFIG.PALETTE.GLOW_GREEN;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx, sy, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = alpha * 0.3;
      const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, radius);
      grad.addColorStop(0, ef.isGolden ? CONFIG.PALETTE.GLOW_GOLD : CONFIG.PALETTE.GLOW_GREEN);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(sx, sy, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

class BeaconRenderer {
  constructor() {
    this.time = 0;
    this.appearProgress = 0;
    this.isActive = false;
    this.rings = [];
    for (let i = 0; i < CONFIG.VISUAL.BEACON_RING_COUNT; i++) {
      this.rings.push({
        phase: Math.random() * Math.PI * 2,
        speed: 0.3 + Math.random() * 0.4,
        radius: 40 + i * 25 + Math.random() * 10,
        direction: i % 2 === 0 ? 1 : -1,
        yOffset: Math.random() * 100 - 50
      });
    }
    this.particleAccum = 0;
  }

  activate() {
    this.isActive = true;
    this.appearProgress = 0;
  }

  update(dt) {
    this.time += dt;
    if (this.isActive && this.appearProgress < 1) {
      this.appearProgress = Math.min(1, this.appearProgress + dt * 2);
    }
  }

  render(ctx, beacon, camera, cw, ch, particleSystem) {
    if (!beacon || !this.isActive) return;
    const bx = camera.getScreenX(beacon.x, cw);
    const by = camera.getScreenY(beacon.y, ch);
    const t = this.time;
    const ap = this.appearProgress;

    ctx.save();

    const columnH = CONFIG.VISUAL.BEACON_HEIGHT * ap;
    const colW = CONFIG.VISUAL.BEACON_COLUMN_WIDTH;

    ctx.save();
    ctx.globalAlpha = 0.3 * ap;
    const colGrad = ctx.createLinearGradient(bx, by - columnH, bx, by);
    colGrad.addColorStop(0, 'rgba(255,215,0,0)');
    colGrad.addColorStop(0.3, CONFIG.PALETTE.BEACON_COLUMN);
    colGrad.addColorStop(0.7, CONFIG.PALETTE.BEACON_COLUMN);
    colGrad.addColorStop(1, 'rgba(255,215,0,0.05)');
    ctx.fillStyle = colGrad;
    ctx.fillRect(bx - colW / 2, by - columnH, colW, columnH);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.15 * ap;
    for (let i = 0; i < 3; i++) {
      const lx = bx + Math.sin(t * 0.5 + i * 2) * colW * 0.6;
      const grad = ctx.createLinearGradient(lx, by - columnH, lx, by);
      grad.addColorStop(0, 'rgba(255,215,0,0)');
      grad.addColorStop(0.5, 'rgba(255,215,0,0.05)');
      grad.addColorStop(1, 'rgba(255,215,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(lx - 1, by - columnH, 2, columnH);
    }
    ctx.restore();

    const baseR = CONFIG.BEACON_RADIUS;
    const pulse = 1 + Math.sin(t * 0.5) * 0.1;

    const glowGrad = ctx.createRadialGradient(bx, by, 0, bx, by, baseR * 2 * pulse);
    glowGrad.addColorStop(0, CONFIG.PALETTE.GLOW_GOLD);
    glowGrad.addColorStop(0.3, 'rgba(255,215,0,0.15)');
    glowGrad.addColorStop(0.6, 'rgba(255,215,0,0.05)');
    glowGrad.addColorStop(1, 'rgba(255,215,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(bx, by, baseR * 2 * pulse, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowColor = CONFIG.PALETTE.GLOW_GOLD;
    ctx.shadowBlur = 30;

    const baseGrad = ctx.createRadialGradient(bx, by, 0, bx, by, baseR);
    baseGrad.addColorStop(0, CONFIG.PALETTE.BEACON_INNER);
    baseGrad.addColorStop(0.4, CONFIG.PALETTE.BEACON_CORE);
    baseGrad.addColorStop(0.8, '#ff8f00');
    baseGrad.addColorStop(1, CONFIG.PALETTE.BEACON_CORE);
    ctx.fillStyle = baseGrad;
    ctx.beginPath();
    ctx.arc(bx, by, baseR * pulse, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;

    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(bx, by, baseR * pulse * 0.7, 0, Math.PI * 2);
    ctx.stroke();

    for (const ring of this.rings) {
      const rot = t * ring.speed * ring.direction + ring.phase;
      const rR = ring.radius * pulse;
      const ringY = by - (columnH * 0.5) * ap + Math.sin(t * 0.3 + ring.phase) * 20;

      ctx.save();
      ctx.globalAlpha = 0.2 * ap;
      ctx.translate(bx, ringY);
      ctx.rotate(rot);
      ctx.strokeStyle = CONFIG.PALETTE.BEACON_RING;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 8]);
      ctx.beginPath();
      ctx.arc(0, 0, rR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    ctx.save();
    ctx.globalAlpha = 0.1 * ap;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + t * 0.3;
      const r = baseR * 0.8;
      const dotX = bx + Math.cos(a) * r;
      const dotY = by + Math.sin(a) * r;
      ctx.fillStyle = CONFIG.PALETTE.GLOW_GOLD;
      ctx.beginPath();
      ctx.arc(dotX, dotY, 2 + Math.sin(t + i) * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    ctx.restore();

    if (particleSystem && ap >= 0.5) {
      this.particleAccum += 0.016;
      if (this.particleAccum >= CONFIG.VISUAL.BEACON_PARTICLE_RATE) {
        this.particleAccum = 0;
        const emitter = particleSystem.createEmitter();
        emitter.setPosition(
          beacon.x + (Math.random() - 0.5) * baseR * 0.5,
          beacon.y
        ).setRate(0).setAutoRelease(true);
        emitter.burst(1, {
          angle: -Math.PI / 2 + (Math.random() - 0.5) * 0.5,
          speed: 30 + Math.random() * 60,
          size: 1.5 + Math.random() * 2,
          life: 1 + Math.random() * 1.5,
          color: CONFIG.PALETTE.GLOW_GOLD,
          mode: 'fade',
          gravity: -10
        });
      }
    }
  }
}

class CollectionEffectRenderer {
  constructor() {
    this.effects = [];
  }

  add(x, y, isGolden) {
    this.effects.push({
      x, y,
      time: 0,
      duration: CONFIG.VISUAL.COLLECTION_DURATION / 1000,
      isGolden,
      particles: []
    });
  }

  update(dt) {
    for (let i = this.effects.length - 1; i >= 0; i--) {
      const ef = this.effects[i];
      ef.time += dt;
      if (ef.time >= ef.duration) {
        this.effects.splice(i, 1);
      }
    }
  }

  render(ctx, camera, cw, ch) {
    for (const ef of this.effects) {
      const sx = camera.getScreenX(ef.x, cw);
      const sy = camera.getScreenY(ef.y, ch);
      const p = Math.min(1, ef.time / ef.duration);
      const alpha = 1 - p;

      ctx.save();
      ctx.globalAlpha = alpha * 0.6;
      const color = ef.isGolden ? CONFIG.PALETTE.GLOW_GOLD : CONFIG.PALETTE.GLOW_GREEN;

      const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, p * 40);
      grad.addColorStop(0, color);
      grad.addColorStop(0.5, color.replace('0.3', '0.1').replace('0.4', '0.1').replace('0.35', '0.1'));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(sx, sy, p * 40, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = color;
      ctx.lineWidth = 2 * alpha;
      ctx.beginPath();
      ctx.arc(sx, sy, p * 25, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(sx, sy, p * 35, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();

      const sparkleCount = Math.floor(p * 12);
      for (let i = 0; i < sparkleCount; i++) {
        const a = (i / sparkleCount) * Math.PI * 2 + p * 3;
        const r = p * 30 + Math.sin(p * 10 + i) * 5;
        ctx.save();
        ctx.globalAlpha = alpha * (0.3 + Math.sin(p * 10 + i) * 0.3);
        ctx.fillStyle = ef.isGolden ? '#ffd54f' : '#81c784';
        ctx.beginPath();
        ctx.arc(sx + Math.cos(a) * r, sy + Math.sin(a) * r, 1.5 * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
  }
}

class TransitionManager {
  constructor() {
    this.progress = 1;
    this.fading = false;
    this.fadeDir = 0;
    this.onComplete = null;
    this.particles = [];
    this.bgCanvas = null;
  }

  fadeIn(callback) {
    this.progress = 1;
    this.fading = true;
    this.fadeDir = -1;
    this.onComplete = callback;
  }

  fadeOut(callback) {
    this.progress = 0;
    this.fading = true;
    this.fadeDir = 1;
    this.onComplete = callback;
  }

  update(dt) {
    if (!this.fading) return;
    this.progress += this.fadeDir * CONFIG.VISUAL.TRANSITION_FADE_SPEED;
    if (this.progress <= 0) {
      this.progress = 0;
      this.fading = false;
      if (this.onComplete) {
        const cb = this.onComplete;
        this.onComplete = null;
        cb();
      }
    }
    if (this.progress >= 1) {
      this.progress = 1;
      this.fading = false;
      if (this.onComplete) {
        const cb = this.onComplete;
        this.onComplete = null;
        cb();
      }
    }
  }

  render(ctx) {
    if (!this.fading && this.progress >= 1) return;
    const alpha = this.fadeDir > 0 ? this.progress : 1 - this.progress;
    ctx.save();
    ctx.fillStyle = CONFIG.PALETTE.FADE_COLOR;
    ctx.globalAlpha = alpha * 0.7;
    ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

class HUDModern {
  render(ctx, roundManager) {
    const { FONT, PADDING, LINE_HEIGHT } = CONFIG.HUD;
    const cw = ctx.canvas.width;
    const ch = ctx.canvas.height;

    ctx.save();

    const panelW = 260;
    const panelH = 100;
    const panelX = PADDING;
    const panelY = PADDING;

    ctx.fillStyle = CONFIG.PALETTE.HUD_PANEL;
    ctx.fillRect(panelX, panelY, panelW, panelH);

    ctx.strokeStyle = CONFIG.PALETTE.HUD_BORDER;
    ctx.lineWidth = 1;
    ctx.strokeRect(panelX, panelY, panelW, panelH);

    ctx.save();
    ctx.globalAlpha = 0.3;
    const hGlow = ctx.createLinearGradient(panelX, panelY, panelX + panelW, panelY);
    hGlow.addColorStop(0, CONFIG.PALETTE.HUD_GLOW);
    hGlow.addColorStop(0.5, 'transparent');
    hGlow.addColorStop(1, CONFIG.PALETTE.HUD_GLOW);
    ctx.fillStyle = hGlow;
    ctx.fillRect(panelX, panelY, panelW, 2);
    ctx.restore();

    ctx.font = '11px monospace';
    ctx.fillStyle = CONFIG.PALETTE.HUD_ACCENT;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';

    const iconSize = 8;
    const ix = panelX + 12;
    const iy = panelY + 14;
    ctx.fillRect(ix, iy, iconSize, iconSize);
    ctx.strokeStyle = CONFIG.PALETTE.HUD_ACCENT;
    ctx.lineWidth = 0.5;
    ctx.strokeRect(ix, iy, iconSize, iconSize);

    ctx.font = FONT;
    ctx.fillStyle = CONFIG.COLORS.HUD_TEXT;
    ctx.fillText(`ROUND ${roundManager.round}`, panelX + 28, panelY + 10);

    ctx.font = '12px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    const remaining = roundManager.getRemainingPresents();
    ctx.fillText(`PRESENTES  ${remaining}`, panelX + 12, panelY + 36);
    ctx.fillText(`DOURADOS   ${roundManager.goldenCollected}`, panelX + 12, panelY + 54);

    ctx.fillStyle = CONFIG.PALETTE.HUD_ACCENT;
    ctx.font = '9px monospace';
    ctx.fillText('▌' + '█'.repeat(Math.max(0, 10 - remaining)) + '░'.repeat(remaining) + '▐', panelX + 12, panelY + 76);

    ctx.restore();

    ctx.save();
    ctx.font = '9px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('NULLSCAPE // v1.0', cw - PADDING, ch - PADDING);
    ctx.restore();
  }
}

/* =========================
GAME
========================= */

class Game {
  constructor() {
    this.canvas = document.getElementById('gameCanvas');
    this.input = new InputManager();
    this.mapGen = new MapGenerator();
    this.player = new Player();
    this.camera = new Camera();
    this.roundManager = new RoundManager();
    this.lastTime = 0;

    this.visuals = this.createVisualSystems();
    this.renderer = new Renderer(this.canvas, this.visuals);

    this.roundManager.startNewRound(this.mapGen);
    this.player.spawnAt(this.roundManager.spawn.getCenterX(), this.roundManager.spawn.getCenterY());
    this.camera.follow(this.player);

    this.collectedTracker = new Set();
    this.goldenCollectedTracker = new Set();
    this.lastRoundState = STATE.PLAYING;
    this.deathTimer = 0;
    this.isDying = false;

    this.loop = (time) => this.gameLoop(time);
    requestAnimationFrame(this.loop);
  }

  createVisualSystems() {
    return {
      background: new BackgroundRenderer(),
      bridge: new BridgeRenderer(),
      spawn: new SpawnRenderer(),
      present: new PresentRenderer(),
      beacon: new BeaconRenderer(),
      particle: new ParticleSystem(),
      collectionFx: new CollectionEffectRenderer(),
      transition: new TransitionManager(),
      hud: new HUDModern()
    };
  }

  detectCollection(roundManager) {
    for (const p of roundManager.normalPresents) {
      if (p.collected && !this.collectedTracker.has(p)) {
        this.collectedTracker.add(p);
        this.visuals.present.addCollectionEffect(p.x, p.y, false);
        this.visuals.collectionFx.add(p.x, p.y, false);
        this.visuals.particle.burst(p.x, p.y, {
          count: 8, size: 2.5, speed: 80, life: 0.5,
          color: CONFIG.PALETTE.GLOW_GREEN, mode: 'fade', spread: 1.5
        });
      }
    }
    for (const gp of roundManager.goldenPresents) {
      if (gp.collected && !this.goldenCollectedTracker.has(gp)) {
        this.goldenCollectedTracker.add(gp);
        this.visuals.present.addCollectionEffect(gp.x, gp.y, true);
        this.visuals.collectionFx.add(gp.x, gp.y, true);
        this.visuals.particle.burst(gp.x, gp.y, {
          count: 16, size: 3, speed: 100, life: 0.7,
          color: CONFIG.PALETTE.GLOW_GOLD, mode: 'fade', spread: 2,
          gravity: -20
        });
      }
    }
  }

  handleDeath() {
    this.isDying = true;
    this.deathTimer = 0;
    const px = this.player.x;
    const py = this.player.y;
    this.visuals.particle.burst(px, py, {
      count: 30, size: 4, speed: 150, life: 0.8,
      color: '#4fc3f7', mode: 'fade', spread: 2,
      gravity: 30
    });
  }

  handleGoldenActivation() {
    this.visuals.beacon.activate();
    for (const pos of this.roundManager.presentPositions) {
      this.visuals.particle.burst(pos.x, pos.y, {
        count: 6, size: 2, speed: 60, life: 0.6,
        color: CONFIG.PALETTE.GLOW_GOLD, mode: 'grow', spread: 1
      });
    }
  }

  handleNewRound() {
    this.visuals.particle.clear();
    this.visuals.beacon.isActive = false;
    this.visuals.beacon.appearProgress = 0;
    this.collectedTracker.clear();
    this.goldenCollectedTracker.clear();
    this.isDying = false;
    this.deathTimer = 0;
  }

  gameLoop(time) {
    const dt = Math.min((time - this.lastTime) / 1000, 0.05);
    this.lastTime = time;

    if (this.isDying) {
      this.deathTimer += dt;
      if (this.deathTimer > 0.6) {
        this.isDying = false;
        this.roundManager.restartRound(this.mapGen);
        this.player.spawnAt(this.roundManager.spawn.getCenterX(), this.roundManager.spawn.getCenterY());
        this.camera.follow(this.player);
        this.handleNewRound();
      }
    } else if (this.roundManager.state !== STATE.TRANSITION) {
      const wasGolden = this.roundManager.state === STATE.GOLDEN;
      const alive = this.player.update(this.input, dt, this.roundManager.groundRects);

      if (!alive) {
        this.handleDeath();
      } else {
        this.camera.follow(this.player);
      }

      const status = this.roundManager.update(this.player, dt);

      if (this.roundManager.state === STATE.GOLDEN && !wasGolden && this.roundManager.beacon) {
        this.handleGoldenActivation();
      }

      if (!this.isDying) {
        this.detectCollection(this.roundManager);
      }

      if (status === 'next_round' || status === 'beacon_touched') {
        this.visuals.transition.fadeOut(() => {
          this.roundManager.startNewRound(this.mapGen);
          this.player.spawnAt(this.roundManager.spawn.getCenterX(), this.roundManager.spawn.getCenterY());
          this.camera.follow(this.player);
          this.handleNewRound();
          this.visuals.transition.fadeIn(null);
        });
      }
    }

    this.visuals.background.update(dt);
    this.visuals.spawn.update(dt);
    this.visuals.present.update(dt);
    this.visuals.beacon.update(dt);
    this.visuals.collectionFx.update(dt);
    this.visuals.transition.update(dt);
    this.visuals.particle.update(dt);

    this.renderer.renderGame(this.roundManager, this.player, this.camera, dt);

    requestAnimationFrame(this.loop);
  }
}

/* =========================
INICIALIZAÇÃO
========================= */
