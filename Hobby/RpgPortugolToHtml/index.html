<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sombras de Valdoria</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a12;--panel:#13131f;--border:#2a1a3a;--gold:#ffd700;--hp:#e02424;--mp:#4488ff;--hpbg:#3a1010;--mpbg:#102040;--text:#c8c8d8;--textdim:#6a6a7a;--rar1:#aaa;--rar2:#4c4;--rar3:#48f;--rar4:#a4f;--rar5:#f80;--rar6:#f04}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;font-size:14px;image-rendering:pixelated}
#game-container{position:relative;width:100%;height:100%;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
#hud{display:flex;flex-wrap:wrap;gap:4px;padding:4px 6px;background:linear-gradient(180deg,#1a1a2e,#0d0d1a);border-bottom:2px solid var(--border);min-height:48px;align-items:center;font-size:12px;flex-shrink:0}
#hud .hg{display:flex;align-items:center;gap:4px;padding:0 6px;border-right:1px solid #2a2a3a}
#hud .hg:last-child{border-right:none}
.hud-bar{position:relative;width:100px;height:14px;background:#1a1a1a;border-radius:3px;overflow:hidden;border:1px solid #333}
.hud-bar-fill{height:100%;transition:width .3s ease;border-radius:2px}
.hud-bar-fill.hp{background:linear-gradient(90deg,#cc2222,#ff4444)}
.hud-bar-fill.mp{background:linear-gradient(90deg,#2266cc,#44aaff)}
.hud-bar-fill.stamina{background:linear-gradient(90deg,#ccaa22,#ffdd44)}
.hud-bar-fill.fome{background:linear-gradient(90deg,#886622,#ccaa44)}
.hud-bar-text{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;text-shadow:1px 1px 0 #000}
.hud-icon{font-size:14px;width:20px;text-align:center}
#main-area{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
#screen{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.screen-panel{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;overflow-y:auto;background:var(--bg)}
.screen-panel.active{display:flex}
#map-container{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;overflow:hidden}
#map-viewport{position:relative;display:grid;gap:1px;background:#0a0a0a;padding:4px;border-radius:8px;border:2px solid var(--border);box-shadow:0 0 30px #00000066}
.map-tile{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(7px,1.8vw,15px);font-weight:700;border-radius:2px;transition:.1s;position:relative;min-width:12px;min-height:12px}
.map-tile.tp{background:#1a1a14;color:#3a3a2a}
.map-tile.te{background:#2a0a0a;color:#ff4444;animation:pe 2s infinite}
.map-tile.tc{background:#2a1a00;color:#ffaa00;animation:pg 2s infinite}
.map-tile.ts{background:#0a2a0a;color:#44ff44}
.map-tile.tx{background:#0a0a2a;color:#4488ff;animation:pb 2s infinite}
.map-tile.tt{background:#0a1a0a;color:#228822}
.map-tile.tpl{background:#1a1a3a;color:#44ccff;text-shadow:0 0 8px #4488ff;z-index:2;box-shadow:0 0 12px #4488ff44}
.map-tile.tv{background:#141410;color:#3a3a2a}
@keyframes pe{0%,100%{box-shadow:inset 0 0 4px #f004}50%{box-shadow:inset 0 0 10px #f008}}
@keyframes pg{0%,100%{box-shadow:inset 0 0 4px #fa04}50%{box-shadow:inset 0 0 10px #fa08}}
@keyframes pb{0%,100%{box-shadow:inset 0 0 4px #48f4}50%{box-shadow:inset 0 0 10px #48f8}}
@keyframes tbp{0%,100%{box-shadow:inset 0 0 8px #f006}50%{box-shadow:inset 0 0 16px #f00c}}
@keyframes telp{0%,100%{box-shadow:inset 0 0 6px #f4f4}50%{box-shadow:inset 0 0 12px #f4f8}}
.map-tile .tc2{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:inherit;text-shadow:0 0 4px currentColor}
.map-tile.tpl .tc2{text-shadow:0 0 12px #44ccff,0 0 24px #4488ff88}
#combat-screen{background:radial-gradient(ellipse at 50% 0%,#1a0a1a,#0a0a12)}
.cl{display:flex;flex-direction:column;height:100%;padding:6px;gap:6px}
.cr{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cu{flex:1;min-width:100px;max-width:260px;background:var(--panel);border:2px solid var(--border);border-radius:8px;padding:6px;position:relative}
.cu .un{font-size:13px;font-weight:700;text-align:center}
.cu .uc{font-size:10px;color:var(--textdim);text-align:center}
.cu .up{width:56px;height:56px;margin:4px auto;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:28px;background:#0a0a1a}
.cu .ub{margin:3px 0;height:12px}
.cu .ub .hud-bar{width:100%;height:12px}
.cu .ub .hud-bar-text{font-size:8px}
.us{font-size:10px;color:var(--textdim);text-align:center}
.ca{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:4px}
.ca button{padding:6px 12px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:4px;cursor:pointer;font-size:12px;transition:.15s;white-space:nowrap}
.ca button:hover{background:#2a2a4a;border-color:var(--gold)}
.ca button:disabled{opacity:.4;cursor:default}
.ca button.skill-btn{font-size:10px;padding:4px 8px;max-width:130px}
.ca button.skill-ready{color:#8f8;border-color:#484}
.ca button.skill-cd{color:#888;border-color:#444}
.ca button.skill-nomana{color:#f88;border-color:#844}
.clog{min-height:32px;max-height:72px;overflow-y:auto;background:#0a0a0a;border:1px solid var(--border);border-radius:4px;padding:4px;font-size:11px;margin-top:4px;flex-shrink:0}
.clog div{padding:1px 0;border-bottom:1px solid #111}
#inv-screen{padding:4px}
.ih{display:flex;gap:12px;padding:4px 8px;font-size:12px;border-bottom:1px solid var(--border);margin-bottom:4px;flex-wrap:wrap}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px;padding:4px}
.is{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:6px;cursor:pointer;transition:.15s;position:relative;min-height:40px}
.is:hover{border-color:var(--gold);background:#1a1a2e}
.is .in{font-size:11px;font-weight:600;word-break:break-all}
.is .id{font-size:9px;color:var(--textdim)}
.is .iq{font-size:9px;color:var(--textdim);position:absolute;top:2px;right:4px}
.is .ir{font-size:8px;position:absolute;bottom:2px;right:4px}
.r1{color:var(--rar1)}.r2{color:var(--rar2)}.r3{color:var(--rar3)}.r4{color:var(--rar4)}.r5{color:var(--rar5)}.r6{color:var(--rar6)}
.eb{background:var(--gold);color:#000;font-size:7px;padding:1px 3px;border-radius:2px;margin-left:4px;font-weight:700}
.inv-btns{display:flex;gap:4px;padding:4px;justify-content:center;flex-wrap:wrap}
.inv-btns button{padding:4px 10px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:4px;cursor:pointer;font-size:11px}
.inv-btns button:hover{background:var(--gold);color:#000}
#shop-screen{padding:4px}
.sh{display:flex;gap:12px;padding:4px 8px;font-size:12px;border-bottom:1px solid var(--border);margin-bottom:4px;flex-wrap:wrap}
.si{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px}
.sit{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:6px;cursor:pointer;transition:.15s}
.sit:hover{border-color:var(--gold);background:#1a1a2e}
.sit .sn{font-size:12px;font-weight:600}
.sit .sp{font-size:12px;color:var(--gold)}
.sit .sd{font-size:10px;color:var(--textdim)}
.sit .sr{font-size:9px;color:#f64}
.stabs{display:flex;gap:4px;margin-bottom:6px}
.stabs button{padding:5px 12px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:4px;cursor:pointer;font-size:11px}
.stabs button.act{background:var(--gold);color:#000;border-color:var(--gold)}
#stat-screen{padding:16px;max-width:500px;margin:0 auto;width:100%}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:12px}
.sr2{padding:4px 6px;background:var(--panel);border-radius:4px;display:flex;justify-content:space-between}
.sr2 .sl{color:var(--textdim)}.sr2 .sv{color:var(--text);font-weight:600}
#quest-screen{padding:8px}
.qc{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px;margin:4px 0}
.qc .qt{font-size:13px;font-weight:700}
.qc .qd{font-size:11px;color:var(--textdim)}
.qc .qp{font-size:11px;color:var(--gold);margin-top:4px}
.qc .qr{font-size:10px;color:#4c4}
#title-screen{align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,#1a0a2e,#0a0a12);padding:20px}
#title-screen h1{font-size:clamp(24px,6vw,48px);color:var(--gold);text-shadow:0 0 20px #f804,0 0 40px #80f2;margin-bottom:8px}
#title-screen .sub{color:var(--textdim);font-size:clamp(12px,2.5vw,18px);margin-bottom:24px}
#title-screen .ver{color:var(--textdim);font-size:11px;margin-top:8px}
.mb{display:block;margin:8px auto;padding:12px 40px;font-size:16px;border:2px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;cursor:pointer;transition:.3s;min-width:200px;font-weight:600;text-align:center}
.mb:hover{background:var(--gold);color:#000;border-color:var(--gold);transform:scale(1.05)}
.mb:active{transform:scale(.95)}
.mb.sm{padding:8px 20px;font-size:13px;min-width:120px}
#cs-screen{padding:12px;max-width:800px;margin:0 auto;width:100%}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin:8px 0}
.cc{background:var(--panel);border:2px solid var(--border);border-radius:8px;padding:8px;cursor:pointer;transition:.2s}
.cc:hover{border-color:var(--gold);transform:translateY(-2px)}
.cc.sel{border-color:var(--gold);background:linear-gradient(135deg,#1a1a2e,#2a1a3e)}
.cc .cn{font-size:13px;font-weight:700;text-align:center}
.cc .cs2{font-size:9px;color:var(--textdim);margin-top:3px}
#ci{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:6px;font-size:12px;line-height:1.6}
#lvlup{position:absolute;inset:0;background:#000000cc;display:none;align-items:center;justify-content:center;z-index:100}
#lvlup.show{display:flex}
.lb{background:linear-gradient(135deg,#1a1a3a,#2a1a2a);border:3px solid var(--gold);border-radius:12px;padding:20px;text-align:center;max-width:380px;animation:lp .5s ease}
@keyframes lp{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.lb h2{color:var(--gold);font-size:22px;margin-bottom:6px}
.lb .ls{font-size:12px;line-height:1.8}
#bb{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;background:var(--panel);border-top:2px solid var(--border);flex-shrink:0;justify-content:center}
#bb button{padding:7px 12px;border:1px solid var(--border);background:linear-gradient(180deg,#1a1a2e,#0d0d1a);color:var(--text);border-radius:6px;cursor:pointer;font-size:11px;transition:.15s;min-width:40px;text-align:center}
#bb button:hover{background:linear-gradient(180deg,#2a2a4e,#1a1a2e);border-color:var(--gold)}
#bb button.act{background:var(--gold);color:#000;border-color:var(--gold)}
#bb button:disabled{opacity:.3;cursor:default}
#mc{display:none;grid-template-columns:56px 56px 56px;gap:3px;justify-content:center;padding:3px;flex-shrink:0}
#mc button{width:56px;height:48px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:6px;font-size:18px;cursor:pointer;transition:.1s;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
#mc button:active{background:var(--gold);color:#000}
#mc .bu{grid-column:2}#mc .bl{grid-column:1;grid-row:2}#mc .br{grid-column:3;grid-row:2}#mc .bd{grid-column:2;grid-row:3}
.tt{position:fixed;background:#1a1a2e;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:12px;z-index:200;pointer-events:none;max-width:260px;box-shadow:0 4px 20px #0008;display:none}
.tt .ttn{font-weight:700;font-size:13px}.tt .ttd{color:var(--textdim);margin-top:2px}.tt .tts{color:#999;margin-top:2px;font-size:11px}
.df{position:absolute;font-weight:700;font-size:20px;pointer-events:none;animation:df 1s ease-out forwards;text-shadow:0 2px 4px #000;z-index:10}
@keyframes df{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.df.dmg{color:#ff4444}.df.crit{color:#ff8800;font-size:26px}.df.heal{color:#44ff44}.df.miss{color:#888}
.pt{position:absolute;pointer-events:none;border-radius:50%;animation:pf .6s ease-out forwards;z-index:5}
@keyframes pf{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}
.fl{animation:fl .3s ease}@keyframes fl{0%,100%{opacity:1}50%{opacity:.3}}
.shk{animation:sh .3s ease}@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#modal{position:absolute;inset:0;background:#000000aa;display:none;align-items:center;justify-content:center;z-index:50}
#modal.show{display:flex}
.mc2{background:var(--panel);border:2px solid var(--border);border-radius:10px;padding:20px;max-width:400px;width:90%;text-align:center}
.mc2 h3{margin-bottom:8px;color:var(--gold)}.mc2 p{font-size:13px;margin-bottom:12px;line-height:1.5}
.mc2 input{width:100%;padding:8px;background:#0a0a12;border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:14px;margin:8px 0;text-align:center}
.mc2 .mbs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mc2 .mbs button{padding:8px 20px;border:1px solid var(--border);background:linear-gradient(180deg,#1a1a2e,#0d0d1a);color:var(--text);border-radius:4px;cursor:pointer;font-size:12px}
.mc2 .mbs button:hover{background:var(--gold);color:#000}
.en{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:2px solid var(--gold);border-radius:10px;padding:16px 24px;z-index:60;text-align:center;animation:ep .3s ease;max-width:280px}
@keyframes ep{0%{transform:translate(-50%,-50%) scale(.8);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.en .evt{font-size:15px;font-weight:700;color:var(--gold)}.en .evd{font-size:12px;margin:6px 0;color:var(--textdim)}
.en button{margin-top:6px;padding:6px 20px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:4px;cursor:pointer}
.en button:hover{background:var(--gold);color:#000}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0a0a12}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@media(max-width:600px){
#hud{font-size:10px;gap:2px;padding:2px 4px;min-height:36px}#hud .hud-bar{width:50px;height:10px}#hud .hud-bar-text{font-size:7px}.hud-icon{font-size:11px;width:14px}
.cu{min-width:80px;max-width:180px;padding:4px}.cu .up{width:36px;height:36px;font-size:18px}.ca button{padding:4px 7px;font-size:10px}
.ig{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}.si{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.cg{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
#mc{display:grid}.sg{grid-template-columns:1fr}.mb{padding:10px 24px;font-size:14px;min-width:140px}#bb button{padding:5px 8px;font-size:10px;min-width:32px}
}
@media(min-width:601px)and (max-width:1024px){.ig{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}.cg{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}
</style>
</head>
<body>
<div id="game-container">
<div id="hud">
  <div class="hg"><span class="hud-icon">⚔</span><span id="hud-name" style="font-weight:700;font-size:13px">Heroi</span></div>
  <div class="hg"><span class="hud-icon">⬆</span><span id="hud-level">1</span></div>
  <div class="hg"><div class="hud-bar"><div class="hud-bar-fill hp" id="hud-hp-fill" style="width:100%"></div><div class="hud-bar-text" id="hud-hp-text">175/175</div></div></div>
  <div class="hg"><div class="hud-bar"><div class="hud-bar-fill mp" id="hud-mp-fill" style="width:100%"></div><div class="hud-bar-text" id="hud-mp-text">90/90</div></div></div>
  <div class="hg"><span class="hud-icon">💰</span><span id="hud-gold">50</span></div>
  <div class="hg"><span id="hud-time-icon">☀</span><span id="hud-time-text">Dia</span></div>
  <div class="hg"><div class="hud-bar"><div class="hud-bar-fill fome" id="hud-fome-fill" style="width:100%"></div><div class="hud-bar-text" id="hud-fome-text">100</div></div></div>
  <div class="hg" id="hud-exh" style="display:none;color:#ff6644;font-weight:700">⚠EXAUSTO</div>
  <div class="hg"><span class="hud-icon">🎒</span><span id="hud-weight">0/30</span></div>
  <div class="hg"><span id="hud-region" style="font-size:10px;color:var(--textdim)">Floresta Sombria</span></div>
</div>
<div id="main-area">
  <div id="screen">
    <div class="screen-panel active" id="title-screen">
      <h1>✦ SOMBRAS DE VALDORIA ✦</h1>
      <div class="sub">Um RPG de Fantasia Medieval</div>
      <button class="mb" onclick="novoJogo()">⚔ Novo Jogo</button>
      <button class="mb" onclick="mostrarCarregar()">📂 Carregar Jogo</button>
      <div class="ver">v1.0</div>
    </div>
    <div class="screen-panel" id="cs-screen"></div>
    <div class="screen-panel" id="game-screen"><div id="map-container"><div id="map-viewport"></div></div></div>
    <div class="screen-panel" id="combat-screen"><div class="cl" id="combat-layout"></div></div>
    <div class="screen-panel" id="inv-screen"></div>
    <div class="screen-panel" id="shop-screen"></div>
    <div class="screen-panel" id="stat-screen"></div>
    <div class="screen-panel" id="quest-screen"></div>
  </div>
  <div id="bb"></div>
  <div id="mc">
    <button class="bu" onpointerdown="movePlayer('cima')">▲</button>
    <button class="bl" onpointerdown="movePlayer('esquerda')">◀</button>
    <button class="br" onpointerdown="movePlayer('direita')">▶</button>
    <button class="bd" onpointerdown="movePlayer('baixo')">▼</button>
  </div>
</div>
<div id="lvlup"><div class="lb"><h2>⬆ LEVEL UP!</h2><div id="lvlup-content"></div><button class="mb sm" onclick="fecharLevelUp()" style="margin-top:10px">Continuar</button></div></div>
<div id="modal"><div class="mc2" id="modal-content"></div></div>
<div class="tt" id="tooltip"></div>

<script>
// ======================================================================
// CONSTANTES
// ======================================================================
const LEVEL_MAX=50,MAX_BUFFS=10,MAX_DEBUFFS=3,MAX_SLOTS=30,PESO_BASE=30;
const MAX_INIMIGOS=30,MAX_HABILIDADES=50,MAX_DEBUFF_SLOTS=9;
const LIMITE_REDUCAO_DANO=80,LIMITE_CRITICO=80,LIMITE_ESQUIVA=75;
const ELEM_F=1,ELEM_G=2,ELEM_T=3,ELEM_L=4,ELEM_D=5,ELEM_R=6,ELEM_N=0;
const CAT_C=1,CAT_E=2,CAT_M=3,CAT_Q=4,CAT_S=5;
const RAR_C=1,RAR_I=2,RAR_R=3,RAR_EP=4,RAR_L=5,RAR_M=6;
const CLS_G=1,CLS_MG=2,CLS_L=3,CLS_P=4,CLS_A=5,CLS_D=6,CLS_N=7,CLS_MO=8;
const TW=0,TP=1,TE=2,TC=3,TS=4,TX=5,TT=6,TV=7,TF=8,TDR=9,TEL=10,TBO=11,TSH=12,TRS=13,TSEC=14,TEV=15;
const RT_COM=0,RT_TES=1,RT_COMERC=2,RT_EVT=3,RT_ELI=4,RT_DESC=5,RT_CHE=6,RT_SAI=7;
const DZ_SEG=0,DZ_MED=1,DZ_DIF=2,DZ_ELI=3;
const ELEM_NM=['Neutro','Fogo','Gelo','Terra','Luz','Trevas','Raio'];
const RAR_NM=['','Comum','Incomum','Raro','Epico','Lendario','Mitico'];
const REGIOES={
  floresta:{nm:"Floresta Sombria",tc:TT,desc:"Uma floresta densa e sombria",amb:"Escura e silenciosa",

function cHp(){return 100+(G.vi+G.ev)*15+G.nivel*12;}
function cMp(){return 50+(G.it+G.ei)*8+G.nivel*10;}
function cAtk(){const b=G.ad+(G.f+G.ef)*1.8;const bn=G.nivel*8;const rf=[0,10,25,40,60,100];const rp=rf[G.aref]||0;return arr(b+bn+b*rp/100);}
function cDef(){return G.de+G.ard+G.ed+G.nivel*7;}
function cRed(def){return Math.min(arr(def*0.35),LIMITE_REDUCAO_DANO);}
function cCrit(){return Math.min(G.cr+G.ec,LIMITE_CRITICO);}
function cEsq(){return Math.min(G.es+G.ee,LIMITE_ESQUIVA);}
function cPeso(){return arr(PESO_BASE+G.f*1.5);}
function cXp(){let x=100;for(let i=0;i<G.nivel;i++)x*=1.45;return arr(x);}
function cStag(hp){return arr(hp/4);}
function fEl(at,de){
if(at===ELEM_N||de===ELEM_N||at===ELEM_R||de===ELEM_R)return 1;
if(at===ELEM_F&&de===ELEM_G)return 2;if(at===ELEM_G&&de===ELEM_T)return 2;
if(at===ELEM_T&&de===ELEM_F)return 2;if(at===ELEM_L&&de===ELEM_D)return 2;
if(at===ELEM_D&&de===ELEM_L)return 2;
if(de===ELEM_F&&at===ELEM_G)return .5;if(de===ELEM_G&&at===ELEM_T)return .5;
if(de===ELEM_T&&at===ELEM_F)return .5;if(de===ELEM_L&&at===ELEM_D)return .5;
if(de===ELEM_D&&at===ELEM_L)return .5;return 1;
}
function nEl(e){return ELEM_NM[e]||'Neutro';}
function nCl(c){return CLS_DATA[c]?CLS_DATA[c].nm:'?';}
function nRa(r){return RAR_NM[r]||'?';}

function apBuf(nm,dr,it,tp){
const e=G.buffs.find(b=>b.nm===nm);if(e){e.dr=dr;e.it=it;return;}
if(G.buffs.length<MAX_BUFFS)G.buffs.push({nm,dr,it,tp,at:true});
}
function apDeb(nm,dr,it,tp){
const e=G.debuffs.find(b=>b.nm===nm);if(e){e.dr=dr;return;}
if(G.debuffs.length<MAX_DEBUFF_SLOTS)G.debuffs.push({nm,dr,it,tp,at:true});
}
function atEfJ(){
G.buffs=G.buffs.filter(b=>{b.dr--;return b.dr>0;});
G.debuffs=G.debuffs.filter(d=>{d.dr--;return d.dr>0;});
}
function prEfTJ(){
for(const b of G.buffs){if(b.tp===1)G.hp=Math.min(G.hpM,G.hp+b.it);if(b.tp===2)G.mp=Math.min(G.mpM,G.mp+b.it);}
for(const d of G.debuffs){if(d.tp<=3)G.hp-=d.it;}
}
function pBuf(tp){return G.buffs.some(b=>b.tp===tp);}
function pDeb(tp){return G.debuffs.some(d=>d.tp===tp);}

// INVENTARIO
// ======================================================================
function addItem(nm,desc,cat,rar,tp,el,qtd,qm,ps,vl,nr,emp,ut,eq,dc,qst,bf,bd,bc,ba,bm,bh,efp,dur,durM){
if(qtd==null||qtd<1)qtd=1;if(qm==null)qm=10;if(emp==null)emp=true;if(ut==null)ut=false;if(eq==null)eq=false;if(dc==null)dc=true;if(ps==null)ps=.5;if(vl==null)vl=10;
const ip={nm,desc,cat,rar,tp:tp||0,el:el||ELEM_N,qtd,qm,ps,vl,nr:nr||0,emp,ut,eq,dc,qst:!!qst,bf:bf||0,bd:bd||0,bc:bc||0,ba:ba||0,bm:bm||0,bh:bh||0,efp:efp||0,dur:dur||0,durM:durM||0};
if(emp&&qtd>1){
for(let i=0;i<G.inv.length;i++){const it=G.inv[i];if(it.nm===nm&&it.emp&&it.qtd<it.qm&&it.cat===cat){const sp=it.qm-it.qtd;const co=Math.min(sp,qtd);it.qtd+=co;qtd-=co;if(qtd<=0)return true;}}
}
const pm=cPeso();
while(qtd>0){
if(G.su>=MAX_SLOTS){cLog("Inventario cheio!");return false;}
const lt=Math.min(qtd,emp?qm:1);if(G.pa+ps*(lt/(qtd||1))>pm){cLog("Peso maximo excedido!");return false;}
const it2={...ip,qtd:lt};if(!emp)it2.qtd=1;G.inv.push(it2);G.su++;G.pa+=ps;qtd-=lt;
}return true;
}
function remItem(idx){if(idx<0||idx>=G.inv.length)return;G.pa-=G.inv[idx].ps;G.inv.splice(idx,1);G.su--;}
function useItem(idx){
if(idx<0||idx>=G.inv.length)return;const it=G.inv[idx];if(!it.ut||it.qtd<=0)return;
const ef=it.efp||0;
if(ef===1)G.fome=Math.min(100,G.fome+it.ve);
else if(ef===2)G.hp=Math.min(G.hpM,G.hp+it.ve);
else if(ef===3)G.mp=Math.min(G.mpM,G.mp+it.ve);
else if(ef===4)G.st=Math.min(100,G.st+it.ve);
else if(ef===5){G.adur=G.adurM;}
else if(ef===6){if(G.ca&&G.ci>=0)G.ini[G.ci].stunned=true;}
else if(ef===7)G.lob=1.3;
else if(ef===9)apBuf("Sangue Demonio",10,50,14);
it.qtd--;if(it.qtd<=0)remItem(idx);
}
function sellItem(idx){
if(idx<0||idx>=G.inv.length)return 0;const it=G.inv[idx];if(it.qst){return 0;}
let m=.3;if(it.rar>=RAR_R)m=.5;if(it.rar>=RAR_L)m=.7;
const pr=arr(it.vl*m*it.qtd);G.ouro+=pr;remItem(idx);return pr;
}
function eqItem(idx){
if(idx<0||idx>=G.inv.length)return;const it=G.inv[idx];if(!it.eq)return;
if(it.tp===1){
if(G.aeIdx>=0&&G.aeIdx<G.inv.length){G.inv[G.aeIdx].qtd++;if(G.inv[G.aeIdx].qtd<=0)remItem(G.aeIdx);}
G.ad=Math.max(1,it.bf||10);G.an=it.nm;G.ae=it.el||ELEM_N;G.adur=it.dur||100;G.adurM=it.durM||100;G.ef=(it.bf||0);G.aeIdx=idx;
}else if(it.tp===2){
if(G.ardeIdx>=0&&G.ardeIdx<G.inv.length){G.inv[G.ardeIdx].qtd++;if(G.inv[G.ardeIdx].qtd<=0)remItem(G.ardeIdx);}
G.ard=it.bd||5;G.ardn=it.nm;G.ed=(it.bd||0);G.ardeIdx=idx;
}
it.qtd--;if(it.qtd<=0)remItem(idx);
}

const hb=50+nv*22+nv*nv*2,ab=8+nv*3.5,db=5+nv*2.2;

if(bo){h*=5;at*=2.2;def2*=1.8;ti=3;}else if(el){h*=2.2;at*=1.5;def2*=1.4;ti=2;}
const pr=["Selvagem","Sombrio","Antigo","Corrompido","Feroz","Mistico","Venenoso","Glacial"];
const tp=["Goblin","Orc","Esqueleto","Lobo","Aranha","Morcego","Slime","Morto-vivo","Demonio","Elemental"];
const ch=['G','O','S','W','A','B','L','Z','D','E'];const tIdx=ale(0,9);
const in2={nm:pr[ale(0,7)]+" "+tp[tIdx],hpM:arr(h),hp:arr(h),atk:arr(at),def:arr(def2),it:nv*3,ag:nv*2,vi:nv*4,cr:5+nv,es:3+nv,re:nv*2,el:ale(1,6),xp:arr(nv*15*(el?2.5:1)*(bo?5:1)),ou:arr((nv*4+ale(0,nv*3))*(el?2:1)*(bo?5:1)),ti,stM:cStag(h),stAt:cStag(h),stunned:false,ch:ch[tIdx],buffAtk:0};

}

function apDan(af,ap,ac,ae,dd,dr,de,sm,fc){
if(ale(1,100)>ap)return{d:0,cr:false,em:1,miss:true};
let d=af*(sm/100);let cr=false;
if(fc||ale(1,100)<=ac){d*=2;cr=true;}
const em=fEl(ae,de);d*=em;
const rd=cRed(dd);d-=d*(rd/100);
if(sm>150)d-=d*(dr*.25/100);
d=Math.max(1,arr(d));return{d,cr,em,miss:false};
}

function escolherRegiao(){
  const idx=G.dtc%REGIOES_LIST.length;
  const chave=REGIOES_LIST[idx];
  G.regiaoChave=chave;
  G.regiaoAtual=REGIOES[chave].nm;
  G.dtc++;
}

function gerarSalas(){
  const qtd=ale(8,15);
  const salas=[];
  const tipos=[RT_COM,RT_COM,RT_COM,RT_COM,RT_TES,RT_COM,RT_COM,RT_EVT,RT_COM,RT_COM,RT_COMERC,RT_ELI,RT_DESC,RT_CHE,RT_SAI];
  const tiposSala=[];
  for(let i=0;i<qtd;i++)tiposSala.push(tipos[i%tipos.length]);
  for(let i=tiposSala.length-1;i>0;i--){const j=ale(0,i);[tiposSala[i],tiposSala[j]]=[tiposSala[j],tiposSala[i]];}
  const margem=2;
  let tentativas=0;
  while(salas.length<qtd&&tentativas<200){
    tentativas++;
    const w=ale(3,7),h=ale(3,5);
    const x=ale(margem,G.mtX-h-margem);
    const y=ale(margem,G.mtY-w-margem);
    let colide=false;
    for(const s of salas){
      if(x<s.x+s.h+2&&x+h+2>s.x&&y<s.y+s.w+2&&y+w+2>s.y){colide=true;break;}
    }
    if(colide)continue;
    const tipo=tiposSala[salas.length]||RT_COM;
    salas.push({x,y,w,h,tipo,conectado:false,idx:salas.length});
  }
  G.salas=salas;
}

function escavarSala(sala){
  for(let i=sala.x;i<sala.x+sala.h;i++)
    for(let j=sala.y;j<sala.y+sala.w;j++)
      if(i>=0&&i<G.mtX&&j>=0&&j<G.mtY)G.mm[i][j]=TP;
}

function conectarSalas(){
  G.corredores=[];
  for(let i=1;i<G.salas.length;i++){
    const a=G.salas[i-1],b=G.salas[i];
    const ax=ale(a.x,a.x+a.h-1),ay=ale(a.y,a.y+a.w-1);
    const bx=ale(b.x,b.x+b.h-1),by=ale(b.y,b.y+b.w-1);
    const passos=[];
    let cx=ax,cy=ay;
    while(cx!==bx||cy!==by){
      if(cx!==bx){cx+=cx<bx?1:-1;}
      else if(cy!==by){cy+=cy<by?1:-1;}
      passos.push([cx,cy]);
    }
    for(const [px,py] of passos){
      if(px>=0&&px<G.mtX&&py>=0&&py<G.mtY&&G.mm[px][py]===TW){
        G.mm[px][py]=TP;
        for(let dx=-1;dx<=1;dx++){for(let dy=-1;dy<=1;dy++){
          const nx=px+dx,ny=py+dy;
          if(Math.abs(dx)===Math.abs(dy))continue;
          if(nx>=0&&nx<G.mtX&&ny>=0&&ny<G.mtY&&G.mm[nx][ny]===TW)G.mm[nx][ny]=TP;
        }}
      }
    }
    G.corredores.push({a:i-1,b:i});
    G.salas[i-1].conectado=true;G.salas[i].conectado=true;
  }
  const extras=ale(1,Math.max(1,Math.floor(G.salas.length/3)));
  for(let e=0;e<extras;e++){
    const a=ale(0,G.salas.length-1);let b=ale(0,G.salas.length-1);
    if(b===a)b=(b+1)%G.salas.length;
    const sa=G.salas[a],sb=G.salas[b];
    const ax=ale(sa.x,sa.x+sa.h-1),ay=ale(sa.y,sa.y+sa.w-1);
    const bx=ale(sb.x,sb.x+sb.h-1),by=ale(sb.y,sb.y+sb.w-1);
    let cx=ax,cy=ay;
    const passos=[];
    while(cx!==bx||cy!==by){
      if(cx!==bx){cx+=cx<bx?1:-1;}
      else if(cy!==by){cy+=cy<by?1:-1;}
      passos.push([cx,cy]);
    }
    for(const [px,py] of passos){
      if(px>=0&&px<G.mtX&&py>=0&&py<G.mtY&&G.mm[px][py]===TW){
        G.mm[px][py]=TP;
        for(let dx=-1;dx<=1;dx++){for(let dy=-1;dy<=1;dy++){
          if(Math.abs(dx)===Math.abs(dy))continue;
          const nx=px+dx,ny=py+dy;
          if(nx>=0&&nx<G.mtX&&ny>=0&&ny<G.mtY&&G.mm[nx][ny]===TW)G.mm[nx][ny]=TP;
        }}
      }
    }
    G.corredores.push({a,b});
  }
}

function calcularDistanciaSpawn(){
  G.distSpawn=[];
  for(let i=0;i<G.mtX;i++){
    G.distSpawn[i]=[];
    for(let j=0;j<G.mtY;j++)G.distSpawn[i][j]=Infinity;
  }
  const fila=[[G.mX,G.mY]];
  G.distSpawn[G.mX][G.mY]=0;
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  let head=0;
  while(head<fila.length){
    const [cx,cy]=fila[head++];
    for(const [dx,dy] of dirs){
      const nx=cx+dx,ny=cy+dy;
      if(nx>=0&&nx<G.mtX&&ny>=0&&ny<G.mtY&&G.mm[nx][ny]!==TW&&G.distSpawn[nx][ny]===Infinity){
        G.distSpawn[nx][ny]=G.distSpawn[cx][cy]+1;
        fila.push([nx,ny]);
      }
    }
  }
}

function definirZonasDificuldade(){
  G.dzMap=[];
  for(let i=0;i<G.mtX;i++){
    G.dzMap[i]=[];
    for(let j=0;j<G.mtY;j++){
      const d=G.distSpawn[i][j];
      if(d===Infinity)G.dzMap[i][j]=-1;
      else if(d<10)G.dzMap[i][j]=DZ_SEG;
      else if(d<25)G.dzMap[i][j]=DZ_MED;
      else if(d<45)G.dzMap[i][j]=DZ_DIF;
      else G.dzMap[i][j]=DZ_ELI;
    }
  }
}

function gerarDecoracoes(){
  const reg=REGIOES[G.regiaoChave];
  const decs=DECORACOES[G.regiaoChave]||DECORACOES.floresta;
  G.dec=[];
  for(let i=0;i<G.mtX;i++){
    G.dec[i]=[];
    for(let j=0;j<G.mtY;j++){
      G.dec[i][j]=null;
    }
  }
  G.tileVar=[];
  for(let i=0;i<G.mtX;i++){
    G.tileVar[i]=[];
    for(let j=0;j<G.mtY;j++){
      G.tileVar[i][j]=ale(0,9);
    }
  }
  for(let i=0;i<G.mtX;i++){for(let j=0;j<G.mtY;j++){
    if(G.mm[i][j]===TP||G.mm[i][j]===TV){
      if(ale(1,100)<=35){
        const dIdx=ale(0,decs.length-1);
        G.dec[i][j]={c:decs[dIdx].c,t:decs[dIdx].t,idx:dIdx};
      }
    }
  }}
}

function gerarInimigoVisivel(i,j,elite,boss){
  const nv=getNivelPorZona(G.dzMap[i][j]);
  const reg=REGIOES[G.regiaoChave];
  const inis=boss?reg.iniE:elite?reg.iniE:reg.iniP;
  const pf=reg.iniPf;
  const tp=inis[ale(0,inis.length-1)];
  const pr=pf[ale(0,pf.length-1)];
  const nm=pr+" "+tp;
  let ch='E',cor='#ff6666';
  if(tp.indexOf('Goblin')>=0||tp.indexOf('G')>=0){ch='G';cor='#66cc66';}
  else if(tp.indexOf('Orc')>=0){ch='O';cor='#88aa44';}
  else if(tp.indexOf('Esqueleto')>=0||tp.indexOf('Lich')>=0){ch='S';cor='#ccccaa';}
  else if(tp.indexOf('Lobo')>=0){ch='W';cor='#aa8866';}
  else if(tp.indexOf('Aranha')>=0){ch='A';cor='#88aa88';}
  else if(tp.indexOf('Morcego')>=0){ch='B';cor='#886688';}
  else if(tp.indexOf('Slime')>=0){ch='L';cor='#66cc88';}
  else if(tp.indexOf('Demonio')>=0||tp.indexOf('Dragao')>=0){ch='D';cor='#ff4444';}
  else if(tp.indexOf('Elemental')>=0){ch='E';cor='#44aaff';}
  else if(tp.indexOf('Cavaleiro')>=0){ch='N';cor='#aa88ff';}
  else if(tp.indexOf('Morto')>=0){ch='Z';cor='#888888';}
  if(!G.enemyMap[i])G.enemyMap[i]=[];
  G.enemyMap[i][j]={ch,cor,nm,nv,tp,pr};
}

function posicionarConteudo(){
  const reg=REGIOES[G.regiaoChave];
  const chaveP=[];
  for(let i=0;i<G.mtX;i++){for(let j=0;j<G.mtY;j++){
    if(G.mm[i][j]===TP&&!(i===G.mX&&j===G.mY))chaveP.push([i,j]);
  }}
  for(const sala of G.salas){
    const centroX=Math.floor(sala.x+sala.h/2);
    const centroY=Math.floor(sala.y+sala.w/2);
    if(sala.tipo===RT_TES){
      G.mm[centroX][centroY]=TC;
    }else if(sala.tipo===RT_COMERC){
      G.mm[centroX][centroY]=TS;
    }else if(sala.tipo===RT_ELI){
      G.mm[centroX][centroY]=TEL;
      gerarInimigoVisivel(centroX,centroY,true,false);
    }else if(sala.tipo===RT_CHE){
      G.mm[centroX][centroY]=TBO;
      gerarInimigoVisivel(centroX,centroY,true,true);
    }else if(sala.tipo===RT_DESC){
      G.mm[centroX][centroY]=TV;
    }else if(sala.tipo===RT_EVT){
      G.mm[centroX][centroY]=TEV;
    }else if(sala.tipo===RT_SAI){
      G.mm[centroX][centroY]=TX;
    }
  }
  let mercadores=0;
  for(let i=0;i<G.salas.length;i++)if(G.salas[i].tipo===RT_COMERC)mercadores++;
  if(mercadores<1){
    const disp=chaveP.filter(([x,y])=>G.mm[x][y]===TP);
    if(disp.length>0){
      const [mx,my]=disp[ale(0,disp.length-1)];
      G.mm[mx][my]=TS;
    }
  }
  for(let i=0;i<chaveP.length;i++){
    const [px,py]=chaveP[i];
    if(G.mm[px][py]!==TP)continue;
    const dz=G.dzMap[px][py];
    const r=ale(1,100);
    if(dz===DZ_SEG){if(r<=8){G.mm[px][py]=TE;gerarInimigoVisivel(px,py,false,false);}}
    else if(dz===DZ_MED){if(r<=18){G.mm[px][py]=TE;gerarInimigoVisivel(px,py,false,false);}}
    else if(dz===DZ_DIF){if(r<=28){if(ale(1,100)<=15){G.mm[px][py]=TEL;gerarInimigoVisivel(px,py,true,false);}else{G.mm[px][py]=TE;gerarInimigoVisivel(px,py,false,false);}}}
    else if(dz===DZ_ELI){if(r<=38){if(ale(1,100)<=25){G.mm[px][py]=TEL;gerarInimigoVisivel(px,py,true,false);}else{G.mm[px][py]=TE;gerarInimigoVisivel(px,py,false,false);}}}
  }
  for(let i=0;i<G.mtX;i++){for(let j=0;j<G.mtY;j++){
    if(G.mm[i][j]===TP&&ale(1,100)<=8&&!(i===G.mX&&j===G.mY)){
      const dz=G.dzMap[i][j];
      if(dz>=DZ_DIF&&ale(1,100)<=40)continue;
      G.mm[i][j]=TT;
    }
  }}
  gerarDecoracoes();
}

function inicializarFog(){
  G.fog=[];
  for(let i=0;i<G.mtX;i++){
    G.fog[i]=[];
    for(let j=0;j<G.mtY;j++){
      G.fog[i][j]=G.mm[i][j]===TW?0:0;
    }
  }
  const R=8;const visRadius=[];for(let dx=-R;dx<=R;dx++){for(let dy=-R;dy<=R;dy++){if(Math.abs(dx)+Math.abs(dy)<=R)visRadius.push([dx,dy]);}}
  for(const [dx,dy] of visRadius){
    const nx=G.mX+dx,ny=G.mY+dy;
    if(nx>=0&&nx<G.mtX&&ny>=0&&ny<G.mtY)G.fog[nx][ny]=2;
  }
  G.fog[G.mX][G.mY]=2;
}

function atualizarFog(){
  const R=8;const dirs=[];for(let dx=-R;dx<=R;dx++){for(let dy=-R;dy<=R;dy++){if(Math.abs(dx)+Math.abs(dy)<=R)dirs.push([dx,dy]);}}
  for(let i=0;i<G.mtX;i++){for(let j=0;j<G.mtY;j++){
    if(G.fog[i][j]===2)G.fog[i][j]=1;
  }}
  for(const [dx,dy] of dirs){
    const nx=G.mX+dx,ny=G.mY+dy;
    if(nx>=0&&nx<G.mtX&&ny>=0&&ny<G.mtY)G.fog[nx][ny]=2;
  }
  G.fog[G.mX][G.mY]=2;
}

function validarMapa(){
  const visitado=[];
  for(let i=0;i<G.mtX;i++){visitado[i]=[];for(let j=0;j<G.mtY;j++)visitado[i][j]=false;}
  const fila=[[G.mX,G.mY]];
  visitado[G.mX][G.mY]=true;
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  let head=0;
  while(head<fila.length){
    const [cx,cy]=fila[head++];
    for(const [dx,dy] of dirs){
      const nx=cx+dx,ny=cy+dy;
      if(nx>=0&&nx<G.mtX&&ny>=0&&ny<G.mtY&&!visitado[nx][ny]&&G.mm[nx][ny]!==TW){
        visitado[nx][ny]=true;
        fila.push([nx,ny]);
      }
    }
  }
  let temSaida=false,temMercador=false;
  for(let i=0;i<G.mtX;i++){for(let j=0;j<G.mtY;j++){
    if(G.mm[i][j]===TX&&visitado[i][j])temSaida=true;
    if(G.mm[i][j]===TS&&visitado[i][j])temMercador=true;
    if(G.mm[i][j]!==TW&&!visitado[i][j])return false;
  }}
  return temSaida&&temMercador;
}

function gerarMapa(){
  G.mm=[];for(let i=0;i<G.mtX;i++){G.mm[i]=[];for(let j=0;j<G.mtY;j++)G.mm[i][j]=TW;}
  G.salas=[];G.corredores=[];G.ini=[];G.inC=0;
  G.enemyMap=[];for(let i=0;i<G.mtX;i++){G.enemyMap[i]=[];}
  G.dec=[];G.tileVar=[];
  escolherRegiao();
  let tentativas=0;
  while(tentativas<20){
    tentativas++;
    G.mm=[];for(let i=0;i<G.mtX;i++){G.mm[i]=[];for(let j=0;j<G.mtY;j++)G.mm[i][j]=TW;}
    gerarSalas();
    if(G.salas.length<3)continue;
    for(const s of G.salas)escavarSala(s);
    conectarSalas();
    const salaSpawn=G.salas[0];
    G.mX=Math.floor(salaSpawn.x+salaSpawn.h/2);
    G.mY=Math.floor(salaSpawn.y+salaSpawn.w/2);
    if(G.mm[G.mX][G.mY]!==TP)continue;
    calcularDistanciaSpawn();
    definirZonasDificuldade();
    posicionarConteudo();
    if(validarMapa())break;
  }
  if(tentativas>=20){
    G.mm=[];for(let i=0;i<G.mtX;i++){G.mm[i]=[];for(let j=0;j<G.mtY;j++)G.mm[i][j]=TW;}
    for(let i=5;i<G.mtX-5;i++){for(let j=3;j<G.mtY-3;j++)G.mm[i][j]=TP;}
    G.mX=5;G.mY=5;
    G.mm[10][15]=TX;G.mm[8][8]=TS;
    G.salas=[{x:5,y:5,w:5,h:5,tipo:RT_COM,conectado:true,idx:0}];
    calcularDistanciaSpawn();
    definirZonasDificuldade();
    G.enemyMap=[];for(let i=0;i<G.mtX;i++){G.enemyMap[i]=[];}
    for(let i=0;i<5;i++){const ex=ale(10,40),ey=ale(10,40);if(G.mm[ex][ey]===TP){G.mm[ex][ey]=TE;gerarInimigoVisivel(ex,ey,false,false);}}
    G.mm[12][12]=TC;G.mm[14][14]=TT;
    gerarDecoracoes();
  }
  inicializarFog();
  atualizarFog();
  G.mg=true;
}

function getTileChar(v,i,j){
  if(v===TW)return{ch:'.',cls:'tw'};
  if(v===TP||v===TV)return{ch:'\u00A0',cls:'tp'};
  if(v===TE){
    const ed=G.enemyMap&&G.enemyMap[i]&&G.enemyMap[i][j];
    if(ed)return{ch:ed.ch||'E',cls:'te',nm:ed.nm||'',nv:ed.nv||0,cor:ed.cor||'#ff6666'};
    return{ch:'E',cls:'te'};
  }
  if(v===TC)return{ch:'■',cls:'tc'};
  if(v===TS)return{ch:'⚜',cls:'ts'};
  if(v===TX)return{ch:'➤',cls:'tx'};
  if(v===TT){
    const tv=G.tileVar&&G.tileVar[i]&&G.tileVar[i][j];
    const tvv=tv||0;
    const tc=[{ch:'♠'},{ch:'♣'},{ch:'♥'},{ch:'♦'},{ch:'♪'}];
    return{ch:tc[tvv%tc.length].ch,cls:'tt'};
  }
  if(v===TEL)return{ch:'⭐',cls:'tel'};
  if(v===TBO)return{ch:'◆',cls:'tbo'};
  if(v===TEV)return{ch:'?',cls:'tev'};
  return{ch:'.',cls:'tw'};
}

const CORES_BIOMA={

function desenharMapa(){
  const ct=document.getElementById('map-viewport');ct.innerHTML='';
  const vw=Math.min(G.mtY,32);const vh=Math.min(G.mtX,22);
  const sy=Math.max(0,Math.min(G.mY-Math.floor(vw/2),G.mtY-vw));
  const sx=Math.max(0,Math.min(G.mX-Math.floor(vh/2),G.mtX-vh));
  ct.style.gridTemplateColumns=`repeat(${vw},1fr)`;
  const regChave=G.regiaoChave;
  const cores=CORES_BIOMA[regChave]||CORES_BIOMA.floresta;
  for(let i=sx;i<sx+vh&&i<G.mtX;i++){for(let j=sy;j<sy+vw&&j<G.mtY;j++){
    const t=document.createElement('div');let ch='',cls='',bg='',color='';
    const v=G.mm[i][j];const f=G.fog[i]&&G.fog[i][j]!==undefined?G.fog[i][j]:0;
    if(i===G.mX&&j===G.mY){cls='tpl';ch='@';color='#44ccff';bg=cores.tpl;}
    else if(f===0){cls='tw';ch='.';bg=cores.tw;color='#2a2a3a';}
    else if(f===1){
      const tc=getTileChar(v,i,j);
      if(v===TP||v===TV){cls='tv';ch='\u00A0';bg=cores.tv;color='#3a3a2a';}
      else{
        const arr=Array.isArray(cores[tc.cls])?cores[tc.cls]:[cores[tc.cls]];
        bg=arr[(i*7+j*13)%arr.length];color=tc.ch==='.'?'#2a2a3a':'#6a6a6a88';
        t.className='map-tile '+tc.cls;t.style.background=bg;t.style.color=color;
        if(G.dec&&G.dec[i]&&G.dec[i][j]){t.innerHTML=`<span class="tc2" style="opacity:0.4">${G.dec[i][j].c}</span>`;}
        else{t.innerHTML=`<span class="tc2" style="opacity:0.4">${tc.ch}</span>`;}
        ct.appendChild(t);continue;
      }
    }
    else{
      const tc=getTileChar(v,i,j);
      cls=tc.cls;ch=tc.ch;
      if(v===TP||v===TV){const arr=Array.isArray(cores.tp)?cores.tp:[cores.tp];bg=arr[(i*7+j*13)%arr.length];color='#3a3a2a';}
      else if(v===TW){bg=cores.tw;color='#2a2a3a';}
      else if(v===TE){bg=cores.te;color='#ff6666';}
      else if(v===TC){bg=cores.tc;color='#ffaa00';}
      else if(v===TS){bg=cores.ts;color='#44ff44';}
      else if(v===TX){bg=cores.tx;color='#4488ff';}
      else if(v===TT){const arr=Array.isArray(cores.tt)?cores.tt:[cores.tt];bg=arr[(i*7+j*13)%arr.length];color='#228822';}
      else if(v===TEL){bg=cores.tel;color='#ff66ff';}
      else if(v===TBO){bg=cores.tbo;color='#ff2222';}
      else if(v===TEV){bg=cores.tev||'#0a2a2a';color='#66ffcc';}
      else{bg=cores.tp[0];color='#3a3a2a';}
    }
    t.className='map-tile '+cls;
    if(bg)t.style.background=bg;
    if(color)t.style.color=color;
    let inner=ch;
    if(G.dec&&G.dec[i]&&G.dec[i][j]&&f===2&&v===TP){
      const d=G.dec[i][j];inner=d.c;
    }
    if((v===TE||v===TEL||v===TBO)&&f===2){
      const ed=G.enemyMap&&G.enemyMap[i]&&G.enemyMap[i][j];
      if(ed){
        if(v===TBO){inner='◆';color='#ff2222';t.style.color='#ff2222';t.style.textShadow='0 0 12px #ff000088,0 0 24px #ff000044';}
        else if(v===TEL){inner='⭐';color='#ff66ff';t.style.color='#ff66ff';t.style.textShadow='0 0 8px #ff66ff88';}
        else{inner=ed.ch||'E';color=ed.cor||'#ff6666';t.style.color=color;}
        t.title=`${ed.nm||'Inimigo'} (Nv ${ed.nv||'?'})`;
      }
    }
    if(i===G.mX&&j===G.mY&&f===2){
      t.style.color='#44ccff';t.style.textShadow='0 0 12px #4488ff88';
    }
    t.innerHTML=`<span class="tc2">${inner}</span>`;
    ct.appendChild(t);
  }}
}

function getNivelPorZona(dz){
  if(dz===DZ_SEG)return Math.max(1,G.nivel+ale(-1,1));
  if(dz===DZ_MED)return Math.max(1,G.nivel+ale(0,2));
  if(dz===DZ_DIF)return Math.max(1,G.nivel+ale(1,3));
  if(dz===DZ_ELI)return Math.max(1,G.nivel+ale(2,5));
  return G.nivel;
}

function movePlayer(dir){
if(G.ca){cLog("Em combate!");return;}
let nx=G.mX,ny=G.mY;
if(dir==='cima')nx--;else if(dir==='baixo')nx++;else if(dir==='esquerda')ny--;else if(dir==='direita')ny++;
if(nx<0||nx>=G.mtX||ny<0||ny>=G.mtY)return;
const tile=G.mm[nx][ny];
if(tile===TW)return;
let processado=false;
  const dz=G.dzMap&&G.dzMap[nx]?G.dzMap[nx][ny]:DZ_SEG;

  if(tile===TE||tile===TEL){
    processado=true;
    const isElite=tile===TEL;
    const ed=G.enemyMap&&G.enemyMap[nx]&&G.enemyMap[nx][ny];
    const nv=ed?ed.nv:getNivelPorZona(dz);
    G.mm[nx][ny]=TV;
    G.ca=true;G.ct=0;G.ci=-1;G.caj=0;G.ter=false;combateLog=[];
    const iIdx=gInim(nv,isElite,false);
    if(iIdx>=0){G.ci=iIdx;G.ca=true;mostrarCombate();cLog(`⚔ ${isElite?'⭐ ':'E'}${G.ini[G.ci].nm} apareceu!`);}
    else showMessage("Nenhum inimigo pode ser gerado!");
    atualizarFome(2);G.at++;verCiclo();
  }else if(tile===TBO){
    processado=true;
    const ed=G.enemyMap&&G.enemyMap[nx]&&G.enemyMap[nx][ny];
    const nv=ed?ed.nv:getNivelPorZona(DZ_ELI);
    G.mm[nx][ny]=TV;
    G.ca=true;G.ct=0;G.ci=-1;G.caj=0;G.ter=false;combateLog=[];
    const iIdx=gInim(Math.max(1,nv+2),true,true);
    if(iIdx>=0){G.ci=iIdx;G.ca=true;mostrarCombate();cLog(`👑 BOSS: ${G.ini[G.ci].nm} apareceu!`);}
    else showMessage("Nenhum inimigo pode ser gerado!");
    atualizarFome(2);G.at++;verCiclo();
  }else if(tile===TC){
processado=true;G.mm[nx][ny]=TV;
const dzC=G.dzMap&&G.dzMap[nx]?G.dzMap[nx][ny]:DZ_SEG;
const multTesouro=dzC>=DZ_ELI?3:dzC>=DZ_DIF?2:1;
const rBau=ale(1,100);
if(rBau<=10){gerarLootBau();G.ouro+=ale(10,20)*multTesouro;}
else if(rBau<=50){const g=ale(20,80)*multTesouro;G.ouro+=g;showMessage(`💰 Bau! ${g} moedas de ouro!`);}
else{addItem("Pocao de Vida P","Cura 30 HP",CAT_C,RAR_C,0,ELEM_N,1,10,.5,25,0,true,true,false,true,false,0,0,0,0,0,0,2,0,0);
showMessage("🧪 Bau! Pocao encontrada!");}
atualizarFome(2);G.at++;verCiclo();
}else if(tile===TS){
processado=true;G.mm[nx][ny]=TV;
mostrarLoja();atualizarFome(2);G.at++;verCiclo();
}else if(tile===TX){
processado=true;G.mm[nx][ny]=TV;
const dzS=G.dzMap&&G.dzMap[G.mX]?G.dzMap[G.mX][G.mY]:DZ_SEG;
const bonusXP=dzS>=DZ_ELI?50:dzS>=DZ_DIF?25:0;
if(bonusXP>0){G.xp+=bonusXP;cLog(`✨ Bonus de exploracao: +${bonusXP}XP`);checkLvl();}
showMessage("Voce encontrou a saida! Um novo mapa e gerado...");
setTimeout(()=>{gerarMapa();desenharMapa();updateHud();updateBB('explore');},500);
atualizarFome(2);G.at++;verCiclo();
}else if(tile===TT){
processado=true;G.mm[nx][ny]=TV;
const dzT=G.dzMap&&G.dzMap[nx]?G.dzMap[nx][ny]:DZ_SEG;
const multOuro=dzT>=DZ_DIF?2:1;
if(ale(1,100)<=30){const g=ale(5,15)*multOuro;G.ouro+=g;showMessage(`Voce encontrou ${g} moedas de ouro na arvore!`);}
atualizarFome(2);G.at++;verCiclo();
}else if(tile===TEV){
processado=true;G.mm[nx][ny]=TV;
eventoPorRegiao();atualizarFome(2);G.at++;verCiclo();
  }else if(tile===TP||tile===TV){
    processado=true;
    atualizarFome(2);G.at++;verCiclo();
  }
if(processado){
G.mX=nx;G.mY=ny;
if(G.fog&&G.fog[nx])G.fog[nx][ny]=2;
atualizarFog();
desenharMapa();updateHud();
}
}

function eventoPorRegiao(){
  const reg=REGIOES[G.regiaoChave];
  if(!reg||!reg.evt||reg.evt.length===0){eventoAleatorio();return;}
  const evts=reg.evt;
  const roll=ale(1,100);let cum=0;
  for(let i=0;i<evts.length;i++){
    cum+=evts[i].ch;
    if(roll<=cum){
      const ev=evts[i];
      if(ev.tp===1){
        const nv=Math.max(1,G.nivel+ale(0,2));
        const elite=ale(1,100)<=20;
        G.ca=true;G.ct=0;G.ci=-1;G.caj=0;G.ter=false;combateLog=[];
        const iIdx=gInim(nv,elite,false);
        if(iIdx>=0){G.ci=iIdx;G.ca=true;mostrarCombate();cLog(`⚔ ${ev.nm}! ${G.ini[G.ci].nm} ataca!`);}
      } else if(ev.tp===2){
        const dz=G.dzMap&&G.dzMap[G.mX]?G.dzMap[G.mX][G.mY]:DZ_SEG;
        const mult=dz>=DZ_DIF?2:1;
        const g=ale(10,30)*mult;G.ouro+=g;showEvent("💰 "+ev.nm,`Voce encontrou ${g} moedas!`);
      } else if(ev.tp===4){
        const d=ale(5,20);G.hp=Math.max(1,G.hp-d);showEvent("⚠ "+ev.nm,`${d} de dano!`);
      } else if(ev.tp===6){
        G.hp=G.hpM;G.mp=G.mpM;showEvent("✨ "+ev.nm,"HP e MP totalmente restaurados!");
      } else if(ev.tp===7){
        const g=ale(20,50);G.ouro+=g;
        if(ale(1,100)<=30){G.xp+=ale(30,80);checkLvl();showEvent("📖 "+ev.nm,`${ev.desc} +${g}Ouro +XP`);}
        else showEvent("📖 "+ev.nm,`${ev.desc} +${g}Ouro`);
      } else if(ev.tp===8){
        const cura=arr(G.hpM*0.3);G.hp=Math.min(G.hpM,G.hp+cura);G.mp=Math.min(G.mpM,G.mp+arr(G.mpM*0.2));
        if(ale(1,100)<=20){apBuf("Bencao Regional",10,15,3);showEvent("✨ "+ev.nm,`${ev.desc} +${cura}HP +Buff!`);}
        else showEvent("✨ "+ev.nm,`${ev.desc} +${cura}HP`);
      } else if(ev.tp===9){
        if(ale(1,100)<=40){gerarLootBau();showEvent("🏛 "+ev.nm,`${ev.desc} Tesouro encontrado!`);}
        else{const g2=ale(15,40);G.ouro+=g2;showEvent("🏛 "+ev.nm,`${ev.desc} +${g2}Ouro`);}
      } else if(ev.tp===3){
        mostrarLoja();showEvent("🏪 "+ev.nm,"Um mercador aparece!");
      } else if(ev.tp===5){
        ativarQuestAleatoria();
      }
      return;
    }
  }
}

function eventoAleatorio(){
if(G.evC===0)return;
const roll=ale(1,100);let cum=0;
for(let i=0;i<G.evC;i++){
cum+=G.evt[i].ch;
if(roll<=cum){
const ev=G.evt[i];
if(ev.tp===1){
const nv=Math.max(1,G.nivel);const elite=ale(1,100)<=20;
G.ca=true;G.ct=0;G.ci=-1;G.caj=0;G.ter=false;combateLog=[];
const iIdx=gInim(nv,elite,false);
if(iIdx>=0){G.ci=iIdx;G.ca=true;mostrarCombate();cLog(`⚔ ${ev.nm}! ${G.ini[G.ci].nm} ataca!`);}
} else if(ev.tp===2){
const g=ale(10,30);G.ouro+=g;showEvent("💰 "+ev.nm,`Voce encontrou ${g} moedas!`);
} else if(ev.tp===3){
mostrarLoja();showEvent("🏪 "+ev.nm,"Um mercador ambulante aparece!");
} else if(ev.tp===4){
const d=ale(5,20);G.hp=Math.max(1,G.hp-d);showEvent("⚠ "+ev.nm,`${d} de dano!`);
} else if(ev.tp===5){
ativarQuestAleatoria();
} else if(ev.tp===6){
G.hp=G.hpM;G.mp=G.mpM;showEvent("✨ "+ev.nm,"HP e MP totalmente restaurados!");
}
return;
}
}
}

function ativarQuestAleatoria(){
for(let i=0;i<G.qC;i++){
if(!G.qs[i].at&&!G.qs[i].co){
G.qs[i].at=true;
showEvent("📜 Missao Encontrada",`${G.qs[i].nm}: ${G.qs[i].desc}`);
return;
}
}
showEvent("📜 Missao","Nenhuma missao disponivel no momento.");
}

if(tp===1){addItem(nome,"Item raro de bau",cat,rar,tp,ELEM_N,1,1,5,vl,0,false,false,true,true,false,bonus,0,0,0,0,0,0,100,100);}
else if(tp===2){addItem(nome,"Item raro de bau",cat,rar,tp,ELEM_N,1,1,8,vl,0,false,false,true,true,false,0,bonus,0,0,0,0,0,100,100);}
else{addItem(nome,"Item raro de bau",cat,rar,tp,ELEM_N,1,1,3,vl,0,false,false,true,true,false,0,0,ale(1,5),ale(1,3),0,0,0,100,100);}

function gerarLoot(iIdx){
if(iIdx<0||iIdx>=G.ini.length)return;
const ini=G.ini[iIdx];
const roll=ale(1,100);
let rar=RAR_C;
if(roll<=1)rar=RAR_M;
else if(roll<=3)rar=RAR_L;
else if(roll<=7)rar=RAR_EP;
else if(roll<=17)rar=RAR_R;
else if(roll<=42)rar=RAR_I;
const prefixos=["Ferrugento","Simples","Refinado","Reluzente","Encantado","Mitico"];
const tiposArmas=["Espada","Machado","Cajado","Adaga","Arco","Lanca"];
const tiposArmaduras=["Armadura","Cota","Tunica","Capa","Elmo","Grevas"];
const tiposAcessorios=["Amuleto","Anel","Pingente","Bracete","Diadema","Colar"];
const p=prefixos[Math.min(rar-1,prefixos.length-1)];
const vl=G.nivel*20*rar;const bonus=rar*3;
const t=ale(0,5);
if(t<2){
const armaNome=p+" "+tiposArmas[ale(0,5)];
addItem(armaNome,"Equipamento",CAT_E,rar,1,ELEM_N,1,1,5,vl,0,false,false,true,true,false,bonus,0,0,0,0,0,0,100,100);
}else if(t<4){
const armaduraNome=p+" "+tiposArmaduras[ale(0,5)];
addItem(armaduraNome,"Equipamento",CAT_E,rar,2,ELEM_N,1,1,8,vl,0,false,false,true,true,false,0,bonus,0,0,0,0,0,100,100);
}else{
const accNome=p+" "+tiposAcessorios[ale(0,5)];
addItem(accNome,"Acessorio",CAT_E,rar,3,ELEM_N,1,1,3,vl,0,false,false,true,true,false,0,0,ale(1,rar),0,ale(1,rar*2),0,0,100,100);
}
if(rar>=RAR_R)cLog(`🎁 Loot: ${p} (${nRa(rar)})`);
}

}

function comprarItem(idx){
if(idx<0||idx>=G.ljC)return;
const it=G.lj[idx];
const isNegro=idx>=11;
let preco=it.pr;
        if(G.ciclo==='Noite'&&it.cat===CAT_C)preco=arr(preco*1.25);
        if(isNegro&&G.ciclo==='Noite')preco=arr(preco*0.8);
        preco=arr(preco*(1-G.desc/100));
if(it.nr>0&&G.nivel<it.nr){showMessage("Nivel insuficiente!");return;}
if(isNegro&&G.ciclo!=='Noite'){showMessage("Item disponivel apenas a noite!");return;}
if(G.ouro<preco){showMessage("Ouro insuficiente!");return;}
G.ouro-=preco;
G.rep+=preco;
if(G.rep>=500){G.desc=Math.min(20,G.desc+5);G.rep-=500;cLog(`💰 Desconto aumentado para ${G.desc}%`);}
let emp=true,ut=false,nm=it.nm;
if(it.ef===2||it.ef===3||it.ef===1||it.ef===4)ut=true;
if(it.ef===6||it.ef===9||it.ef===10||it.ef===11)ut=true;
if(it.ef===5)ut=true;
if(it.ef===7)ut=true;
if(it.ef===8)ut=true;
const cat=it.cat;
const rar=it.rar;
const efeito=it.ef;
const valor=it.ve;
addItem(nm,it.desc,cat,rar,0,ELEM_N,1,10,.5,preco,0,emp,ut,false,true,false,0,0,0,0,0,0,efeito,valor);
showMessage(`✅ ${nm} comprado!`);
renderLoja();updateHud();
}

function repararArma(){
const custo=arr((G.adurM-G.adur)/2);
if(G.ouro<custo){showMessage("Ouro insuficiente!");return;}
if(G.adur>=G.adurM){showMessage("Arma ja esta no maximo!");return;}
G.ouro-=custo;G.adur=G.adurM;
showMessage("🔧 Arma reparada!");
renderLoja();updateHud();
}

function refinarArma(){
const refCustos=[0,100,250,500,1000,2500];
if(G.aref>=5){showMessage("Arma ja esta no maximo!");return;}
const custo=refCustos[G.aref+1];
if(G.ouro<custo){showMessage("Ouro insuficiente!");return;}
if(G.nivel<G.aref+2){showMessage(`Requer nivel ${G.aref+2}!`);return;}
G.ouro-=custo;G.aref++;
showMessage(`⬆ Arma refinada para +${G.aref}!`);
renderLoja();updateHud();
}

function venderItemLoja(idx){
const g=sellItem(idx);
if(g>0){showMessage(`Vendido por ${g} moedas!`);renderLoja();updateHud();}
else showMessage("Item de missao!");
}

function atkBasico(){
if(!G.ca||G.ci<0)return;
const ini=G.ini[G.ci];
let mult=100;
if(G.adur<=0){mult=10;cLog("⚠ Arma quebrada! Dano reduzido!");}
const atk=cAtk();
const res=apDan(atk,G.pr,cCrit(),G.ae,ini.def,ini.re,ini.el,mult,false);
if(res.miss){cLog(`❌ ${G.nome} errou o ataque!`);}
else{
let dmg=res.d;
const hasGrito=pBuf(7);
if(hasGrito)dmg=arr(dmg*1.25);
const isExa=G.fome<=10;
if(isExa)dmg=arr(dmg*0.5);
ini.hp-=dmg;
const critText=res.cr?'💥 CRITICO!':'';
const elemText=res.em>1?'🔥 Super eficaz!':res.em<1?'💧 Resistente!':'';
cLog(`⚔ ${G.nome} ataca! ${dmg} ${critText}${elemText}`);
const hpEl=document.querySelector('.cu:last-child .hud-bar-fill');if(hpEl){hpEl.classList.add('shk');setTimeout(()=>hpEl.classList.remove('shk'),300);}
floatDmg(window.innerWidth/2+40,window.innerHeight/3,dmg+'',res.cr?'crit':'dmg');
G.adur=Math.max(0,G.adur-1);
aplicarStagger(G.ci,15);
}
atualizarFome(4);G.at++;verCiclo();
if(ini.hp<=0){combateVitoria();return;}
if(G.hp<=0){combateDerrota();return;}
processarTurnoPosJogador();
}

function usarSkillCombate(skIdx){
if(!G.ca||G.ci<0)return;
const sk=G.sk[skIdx];
if(!sk)return;
if(sk.cda>0){cLog("❌ Habilidade em cooldown!");renderCombate();return;}
if(G.mp<sk.cu){cLog("❌ Mana insuficiente!");renderCombate();return;}
if(G.ct===0&&G.turnoExtraRodada&&sk.tp===27){cLog("❌ Ja usou turno extra esta rodada!");renderCombate();return;}
G.mp-=sk.cu;sk.cda=sk.cd;
const ini=G.ini[G.ci];
const isExa=G.fome<=10;
let dmg=0,curou=false,stun=false;
const atkTotal=cAtk();
const intTotal=G.it+G.ei;

// Skill type dispatch
if(sk.tp===1){
let mult=sk.dm;
if(sk.idx===4&&ini.hp<ini.hpM*0.3){mult=Math.min(200,110+ini.hpM*0.3/(atkTotal/100));}
G.adur=Math.max(0,G.adur-2);
const res=apDan(atkTotal,G.pr,cCrit(),sk.el||G.ae,ini.def,ini.re,ini.el,mult,false);
if(!res.miss){
dmg=res.d;
const hasGrito=pBuf(7);if(hasGrito)dmg=arr(dmg*1.25);
if(isExa)dmg=arr(dmg*0.5);
ini.hp-=dmg;
const ct=res.cr?'💥 ':'';const et=res.em>1?'🔥 ':res.em<1?'💧 ':'';
cLog(`⚔ ${sk.nm}: ${dmg} ${ct}${et}`);
aplicarStagger(G.ci,15);
}}
else if(sk.tp===2){
apBuf(sk.nm,sk.dr,sk.it8,3);cLog(`🛡 ${sk.nm} ativada! (-${sk.it8}% dano)`);
}
else if(sk.tp===3){
apBuf(sk.nm,sk.dr,sk.it8,7);cLog(`📯 ${sk.nm}: +25% dano!`);
}
else if(sk.tp===4){
if(sk.idx===6){G.escudoArcano=50+G.it*2;cLog(`🔮 ${sk.nm}: ${G.escudoArcano} de absorcao!`);}
const res=apDan(intTotal*2,G.pr,cCrit(),sk.el||G.ae,ini.def,ini.re,ini.el,sk.dm||130,false);
if(!res.miss){
dmg=res.d;if(isExa)dmg=arr(dmg*0.5);
if(sk.idx===8&&ale(1,100)<=20){apDeb("Choque",2,10,4);cLog("⚡ Choque aplicado!");}
ini.hp-=dmg;
const ct=res.cr?'💥 ':'';const et=res.em>1?'🔥 ':res.em<1?'💧 ':'';
cLog(`✨ ${sk.nm}: ${dmg} ${ct}${et}`);
}}
else if(sk.tp===5){
G.amb="Nevasca";apDeb("Precisao Reduzida",5,30,5);cLog(`❄ ${sk.nm}: ambiente congelante!`);
}
else if(sk.tp===6){
const res=apDan(atkTotal,G.pr,cCrit(),sk.el||G.ae,ini.def,ini.re,ini.el,sk.dm||140,false);
if(!res.miss){dmg=res.d;ini.hp-=dmg;const rec=arr(sk.cu*0.5);G.mp=Math.min(G.mpM,G.mp+rec);cLog(`💧 ${sk.nm}: ${dmg} dano, ${rec} MP recuperado!`);}
}
else if(sk.tp===7){
const res=apDan(atkTotal,G.pr,50,sk.el||G.ae,ini.def,ini.re,ini.el,sk.dm||80,true);
if(!res.miss){dmg=res.d;ini.hp-=dmg;cLog(`🗡 ${sk.nm}: ${dmg} (critico fixo 50%)!`);}
}
else if(sk.tp===8){
apBuf(sk.nm,sk.dr,sk.it8,8);cLog(`💨 ${sk.nm}: invisivel!`);
}
else if(sk.tp===9){
const venDmg=ini.ti===3?1:ini.ti===2?2:4;
apDeb("Veneno",5,venDmg,1);cLog(`☠ ${sk.nm}: ${venDmg}/turno!`);
}
else if(sk.tp===10){
const res=apDan(atkTotal,G.pr,cCrit(),sk.el||G.ae,ini.def,ini.re,ini.el,sk.dm||140,false);
if(!res.miss){dmg=res.d;ini.hp-=dmg;const cura=arr(dmg*0.15);G.hp=Math.min(G.hpM,G.hp+cura);cLog(`🩸 ${sk.nm}: ${dmg}, ${cura} HP recuperado!`);curou=true;}
}
else if(sk.tp===11){
const cura=arr(G.hpM*0.3);G.hp=Math.min(G.hpM,G.hp+cura);
cLog(`✨ ${sk.nm}: +${cura} HP!`);
}
else if(sk.tp===12){
const res=apDan(atkTotal,G.pr,cCrit(),sk.el||ELEM_L,ini.def,ini.re,ini.el,sk.dm||130,false);
if(!res.miss){dmg=res.d;ini.hp-=dmg;apDeb("Julgamento",1,50,6);cLog(`⚖ ${sk.nm}: ${dmg}! Ataque inimigo reduzido!`);}
}
else if(sk.tp===13){
cLog(`✨ ${sk.nm}: passiva de ressurreição ativa.`);
}
else if(sk.tp===14){
apBuf(sk.nm,sk.dr,sk.it8,9);cLog(`👁 ${sk.nm}: proximo ataque critico garantido!`);
}
else if(sk.tp===15){
stun=true;
if(ini.ti===3&&ale(1,100)<=50){cLog(`⚠ ${sk.nm} falhou no boss!`);}else{ini.stunned=true;cLog(`⚡ ${sk.nm}: inimigo atordoado!`);}
}
else if(sk.tp===16){
const res=apDan(atkTotal,G.pr,cCrit(),sk.el||G.ae,ini.def,ini.re,ini.el,sk.dm||150,false);
if(!res.miss){dmg=res.d;ini.hp-=dmg;const cura=ini.ti===3?arr(dmg*0.5):dmg;G.hp=Math.min(G.hpM,G.hp+cura);cLog(`🩸 ${sk.nm}: ${dmg}, ${cura} HP!`);}
}
else if(sk.tp===17){
apBuf(sk.nm,sk.dr,sk.it8,10);cLog(`🌳 ${sk.nm}: reflete 20% dano!`);
}
else if(sk.tp===18){
const regen=G.regiaoAtual==="Floresta Sombria"?9:6;
apBuf(sk.nm,sk.dr,regen,1);cLog(`🌿 ${sk.nm}: +${regen}HP/turno!`);
}
else if(sk.tp===19){
const bonusHp=arr(G.hpM*0.35);G.hpM+=bonusHp;G.hp+=bonusHp;apBuf(sk.nm,sk.dr,bonusHp,11);cLog(`🐻 Forma de Urso: +${bonusHp} HP!`);
}
else if(sk.tp===20){
const res=apDan(atkTotal,G.pr,cCrit(),ELEM_D,ini.def,ini.re,ini.el,sk.dm||90,false);

else if(sk.tp===21){

else if(sk.tp===22){

else if(sk.tp===23){

else if(sk.tp===24){

else if(sk.tp===25){
dmg=arr(atkTotal*sk.dm/100);if(isExa)dmg=arr(dmg*0.5);ini.hp-=dmg;cLog(`👊 ${sk.nm}: ${dmg} (ignora armadura)!`);

else if(sk.tp===26){
const ch=arr(G.hpM*0.2);const cm=arr(G.mpM*0.2);G.hp=Math.min(G.hpM,G.hp+ch);G.mp=Math.min(G.mpM,G.mp+cm);cLog(`🧘 ${sk.nm}: +${ch}HP +${cm}MP!`);

else if(sk.tp===27){
dmg=arr(atkTotal*sk.dm/100);if(isExa)dmg=arr(dmg*0.5);ini.hp-=dmg;
if(!G.turnoExtraRodada){G.turnoExtraRodada=true;G.caj--;cLog(`⚡ ${sk.nm}: ${dmg}! Turno extra!`);}else{cLog(`⚡ ${sk.nm}: ${dmg}!`);}
}
else if(sk.tp===28){
apBuf(sk.nm,sk.dr,1,13);cLog(`🛡 ${sk.nm}: bloqueia 1 ataque!`);
}
else if(sk.tp===29){
dmg=arr(atkTotal*sk.dm/100);if(isExa)dmg=arr(dmg*0.5);ini.hp-=dmg;aplicarStagger(G.ci,70);cLog(`👊 ${sk.nm}: ${dmg}! Stagger +70!`);
}

if(dmg>0){
floatDmg(window.innerWidth/2+40,window.innerHeight/3,dmg+'','dmg');
const hpEl=document.querySelector('.cu:last-child .hud-bar-fill');if(hpEl){hpEl.classList.add('shk');setTimeout(()=>hpEl.classList.remove('shk'),300);}
}
if(curou){floatDmg(window.innerWidth/2-60,window.innerHeight/3,'+'+arr(G.hpM*0.15),'heal');}

atualizarFome(4);G.at++;verCiclo();
if(ini.hp<=0){combateVitoria();return;}
if(G.hp<=0){combateDerrota();return;}
processarTurnoPosJogador();
}

function processarTurnoPosJogador(){
if(!G.ca)return;
G.ct++;
const ini=G.ini[G.ci];
if(ini.stunned){cLog(`⏭ ${ini.nm} esta atordoado(a) e perdeu o turno!`);ini.stunned=false;}
else if(ini.stAt<=0){ini.stAt=arr(ini.stM*0.5);cLog(`⏭ ${ini.nm} atordoado(a) pelo stagger!`);}
else{iaInimigo();}
if(G.hp<=0){combateDerrota();return;}
atEfJ();prEfTJ();
if(G.esqueletoAtivo){ini.hp-=arr(G.it*0.35);cLog(`💀 Esqueleto causa ${arr(G.it*0.35)} dano!`);}
reduzirCooldowns();
G.ter=false;
renderCombate();
if(ini.hp<=0)combateVitoria();
}

function iaInimigo(){
if(G.ci<0)return;
const ini=G.ini[G.ci];
if(ini.hp<ini.hpM*0.3&&ale(1,100)<=30){const cura=arr(ini.hpM*0.1);ini.hp=Math.min(ini.hpM,ini.hp+cura);cLog(`💚 ${ini.nm} se curou (${cura})!`);return;}
if(G.ct>5&&ale(1,100)<=20){ini.buffAtk+=5;cLog(`⬆ ${ini.nm} ficou mais forte! (+5 ATK)`);return;}
const esqJ=cEsq();
const hasEsq=pBuf(5);const esqTotal=esqJ+(hasEsq?40:0);
if(ale(1,100)<=esqTotal){cLog(`💨 ${G.nome} esquivou!`);return;}
if(pBuf(13)){cLog(`🛞 ${G.nome} bloqueou o ataque!`);return;}
let danoIni=ini.atk+ini.buffAtk-cRed(cDef());
if(G.ciclo==='Noite')danoIni=arr(danoIni*1.3);
if(pBuf(3))danoIni=arr(danoIni*0.6);
danoIni=Math.max(1,danoIni);
const isExa=G.fome<=10;
if(isExa)danoIni=arr(danoIni*0.5);
if(G.escudoArcano>0){
if(G.escudoArcano>=danoIni){G.escudoArcano-=danoIni;danoIni=0;cLog(`🔮 Escudo Arcano absorveu o dano! (${G.escudoArcano} restante)`);}
else{danoIni-=G.escudoArcano;G.escudoArcano=0;cLog(`🔮 Escudo Arcano quebrou!`);}
}
G.hp-=danoIni;
cLog(`💥 ${ini.nm} ataca! ${danoIni} de dano!`);
floatDmg(window.innerWidth/2-60,window.innerHeight/3,danoIni+'','dmg');
const hpEl=document.querySelector('.cu:first-child .hud-bar-fill');if(hpEl){hpEl.classList.add('shk');setTimeout(()=>hpEl.classList.remove('shk'),300);}
if(pBuf(10)){const reflete=arr(danoIni*0.2);ini.hp-=reflete;cLog(`🌳 Pele de Arvore reflete ${reflete}!`);}
}

function aplicarStagger(idx,valor){
if(idx<0||idx>=G.ini.length)return;
const ini=G.ini[idx];
if(ini.ti===3)valor=arr(valor/4);
ini.stAt=Math.max(0,ini.stAt-valor);
if(ini.stAt<=0)ini.stunned=true;
}

function reduzirCooldowns(){
for(let i=0;i<G.skC;i++){if(G.sk[i].cda>0)G.sk[i].cda--;}
}

function tentarFugirCombate(){
const ini=G.ini[G.ci];
const chance=ini.ti===3?20:50+G.ag;
if(ale(1,100)<=chance){G.ca=false;cLog(`🏃 ${G.nome} fugiu do combate!`);G.fugiu=true;combateLog=[];voltarExploracao();}
else{cLog("❌ Falha ao fugir!");processarTurnoPosJogador();}
}

function combateVitoria(){
if(G.ci<0)return;
const ini=G.ini[G.ci];
G.ca=false;G.cv++;G.im++;
let xpG=ini.xp||0;let ouG=ini.ou||0;
if(G.ciclo==='Noite'){xpG=arr(xpG*1.5);ouG=arr(ouG*1.5);}
if(G.lob>1){ouG=arr(ouG*G.lob);}
if(ale(1,100)<=30)gerarLoot(G.ci);
G.xp+=xpG;G.ouro+=ouG;
cLog(`🏆 Vitoria! +${xpG}XP +${ouG}Ouro`);
atualizarQuestsCombate();
checkLvl();
updateHud();
combateLog=[];
showEvent("🏆 Vitoria!",`${ini.nm} derrotado! +${xpG}XP +${ouG}Ouro`,()=>{
G.ini[G.ci].hp=0;
voltarExploracao();
});
}

function combateDerrota(){
G.ca=false;
const temFenix=G.inv.some(it=>it.efp===8&&it.qtd>0);
if(temFenix){
for(let i=0;i<G.inv.length;i++){if(G.inv[i].efp===8){G.inv[i].qtd--;if(G.inv[i].qtd<=0)remItem(i);break;}}
G.hp=arr(G.hpM*0.2);G.mp=arr(G.mpM*0.5);
cLog(`💖 Coracao de Fenix reviveu ${G.nome}!`);
showEvent("💖 Renascido!","Coracao de Fenix consumido.",()=>{voltarExploracao();});
}else if(G.classe===CLS_P&&G.nivel>=5){
G.hp=G.hpM;G.mp=G.mpM;
cLog(`✨ Ressurreicao do Paladino ativada!`);
showEvent("✨ Renascido!","Ressurreicao divina!",()=>{voltarExploracao();});
}else{
const perda=arr(G.ouro*0.2);G.ouro-=perda;
G.hp=arr(G.hpM*0.5);G.mp=arr(G.mpM*0.5);
cLog(`💀 ${G.nome} foi derrotado! Perdeu ${perda} ouro.`);
showEvent("💀 Derrota!",`${G.nome} foi derrotado! -${perda} Ouro`,()=>{voltarExploracao();});
}
G.ci=-1;combateLog=[];updateHud();
}

// ======================================================================
// INICIALIZACAO
// ======================================================================
function init(){
resetGameState();inicializarJogo();
document.addEventListener('keydown',(e)=>{
const key=e.key.toLowerCase();
if(G.curScreen==='game-screen'||document.getElementById('game-screen').classList.contains('active')){
if(key==='w'||key==='arrowup')movePlayer('cima');
else if(key==='s'||key==='arrowdown')movePlayer('baixo');
else if(key==='a'||key==='arrowleft')movePlayer('esquerda');
else if(key==='d'||key==='arrowright')movePlayer('direita');
}
if(key==='escape'){const m=document.getElementById('modal');if(m.classList.contains('show'))closeModal();}
});
document.addEventListener('touchstart',()=>{},false);
document.getElementById('game-container').addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('resize',()=>{if(G.curScreen==='game-screen')desenharMapa();});
}

document.addEventListener('DOMContentLoaded',()=>{init();});
</script>
</body>
